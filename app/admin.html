<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTWorld — Admin Panel</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    /* ===== RESET & BASE ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0f1a;
      color: #e0f2fe;
      font-family: "Science Gothic", sans-serif;
      min-height: 100vh;
    }

    /* ===== ADMIN CONTENT ===== */
    .admin-page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .admin-hero {
      text-align: center;
      padding: 10px 0 20px;
    }
    .admin-hero h1 {
      font-family: "Science Gothic", sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #e0f2fe;
    }
    .admin-hero h1 span { color: #38bdf8; }
    .admin-hero .badge {
      display: inline-block;
      background: rgba(251,191,36,0.12);
      border: 1px solid rgba(251,191,36,0.25);
      padding: 3px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      color: #fbbf24;
      font-family: "Science Gothic", sans-serif;
      margin-top: 4px;
    }

    /* ===== STATS ===== */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 600px;
      margin: 0 auto 20px;
    }
    .stat-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(56,189,248,0.10);
      border-radius: 14px;
      padding: 14px 8px;
      text-align: center;
      transition: border-color 0.2s;
    }
    .stat-card:hover { border-color: rgba(56,189,248,0.25); }
    .stat-number {
      font-family: "Science Gothic", sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: #38bdf8;
    }
    .stat-label {
      font-size: 10px;
      color: #64748b;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }
    .stat-card.gold .stat-number { color: #fbbf24; }
    .stat-card.gold { border-color: rgba(251,191,36,0.15); }

    /* ===== SEARCH ===== */
    .search-wrap {
      max-width: 600px;
      margin: 0 auto 16px;
    }
    .search-box {
      width: 100%;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(56,189,248,0.2);
      background: rgba(0,0,0,0.3);
      color: #e0f2fe;
      outline: none;
      font-size: 14px;
      font-family: "Science Gothic", sans-serif;
      transition: border-color 0.2s;
    }
    .search-box:focus { border-color: rgba(56,189,248,0.5); }
    .search-box::placeholder { color: #4a7a9b; }

    /* ===== USER GRID (CARD) ===== */
    .user-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      max-width: 700px;
      margin: 0 auto;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(56,189,248,0.10);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s;
    }
    .user-card:hover {
      background: rgba(56,189,248,0.06);
      border-color: rgba(56,189,248,0.25);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .user-card:active { transform: scale(0.98); }

    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
      flex-shrink: 0;
      background-size: cover;
      background-position: center;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }
    .user-name {
      font-weight: 700;
      font-size: 14px;
      color: #e0f2fe;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-email {
      font-size: 12px;
      color: #7dd3fc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-points {
      font-family: "Science Gothic", sans-serif;
      font-size: 16px;
      font-weight: 900;
      color: #fbbf24;
      flex-shrink: 0;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #4a7a9b;
      grid-column: 1 / -1;
    }
    .empty-state .icon { font-size: 48px; }
    .empty-state .text { font-size: 16px; font-weight: 700; margin-top: 8px; }
    .empty-state .sub { font-size: 13px; color: #334155; }
    .empty-state .error { color: #f87171; }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-card {
      background: linear-gradient(145deg, #1a2744, #0f172a);
      border: 1px solid rgba(56,189,248,0.2);
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      background-size: cover;
      background-position: center;
      border: 3px solid rgba(167,139,250,0.3);
      flex-shrink: 0;
    }
    .modal-name {
      font-size: 22px;
      font-weight: 800;
      color: #e0f2fe;
    }
    .modal-email {
      font-size: 14px;
      color: #7dd3fc;
      margin-bottom: 8px;
    }
    .modal-points-label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 12px;
    }
    .modal-points {
      font-size: 42px;
      font-weight: 900;
      color: #fbbf24;
      font-family: "Science Gothic", sans-serif;
      margin: 4px 0 12px;
      text-shadow: 0 0 30px rgba(251,191,36,0.15);
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .input-group input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(56,189,248,0.25);
      background: rgba(0,0,0,0.4);
      color: #fff;
      outline: none;
      font-size: 14px;
      font-family: "Science Gothic", sans-serif;
    }
    .input-group input:focus { border-color: rgba(56,189,248,0.5); }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 13px;
      font-family: "Science Gothic", sans-serif;
    }
    .btn:active { transform: scale(0.96); }
    .btn-add {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }
    .btn-add:hover { box-shadow: 0 4px 20px rgba(16,185,129,0.3); }
    .btn-sub {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
    }
    .btn-sub:hover { box-shadow: 0 4px 20px rgba(239,68,68,0.3); }
    .btn-reset {
      background: rgba(100,116,139,0.2);
      color: #94a3b8;
      border: 1px solid rgba(100,116,139,0.2);
      margin-top: 6px;
      width: 100%;
    }
    .btn-reset:hover { background: rgba(100,116,139,0.3); }
    .btn-delete {
      background: rgba(239,68,68,0.15);
      color: #f87171;
      border: 1px solid rgba(239,68,68,0.3);
      margin-top: 6px;
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      font-size: 13px;
      font-family: "Science Gothic", sans-serif;
    }
    .btn-delete:hover { background: rgba(239,68,68,0.25); }
    .btn-close {
      background: none;
      border: 1px solid rgba(255,255,255,0.08);
      color: #94a3b8;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
      width: 100%;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: "Science Gothic", sans-serif;
    }
    .btn-close:hover { background: rgba(255,255,255,0.05); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .admin-hero h1 { font-size: 20px; }
      .user-card { padding: 10px 12px; gap: 10px; }
      .user-avatar { width: 38px; height: 38px; font-size: 15px; }
      .user-points { font-size: 14px; }
    }
  </style>
</head>
<body data-bottom-nav="home">
  <div id="top-nav-root"></div>

  <!-- Main -->
  <div class="admin-page">
    <div class="admin-hero">
      <h1>🛡️ <span>Admin</span> Panel</h1>
      <div class="badge">Quản trị viên</div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-number" id="totalUsers">0</div>
        <div class="stat-label">👥 Người dùng</div>
      </div>
      <div class="stat-card gold">
        <div class="stat-number" id="totalPoints">0</div>
        <div class="stat-label">⭐ Tổng điểm</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="topUser">—</div>
        <div class="stat-label">🏆 Top giàu nhất</div>
      </div>
    </div>

    <div class="search-wrap">
      <input class="search-box" id="searchInput" placeholder="🔍 Tìm kiếm người dùng theo tên hoặc email..." oninput="filterUsers()" />
    </div>

    <div class="user-grid" id="userGrid">
      <div class="empty-state">
        <div class="icon">⏳</div>
        <div class="text">Đang tải danh sách...</div>
        <div class="sub">Vui lòng đợi</div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="userModal" onclick="if(event.target===this)closeModal()">
    <div class="modal-card">
      <div class="modal-avatar" id="modalAvatar">?</div>
      <div class="modal-name" id="modalName">—</div>
      <div class="modal-email" id="modalEmail"></div>
      <div class="modal-points-label">ĐIỂM HIỆN TẠI</div>
      <div class="modal-points" id="modalPoints">0</div>
      <div class="input-group">
        <input type="number" id="modalPointsAmount" placeholder="Nhập số điểm" min="1" />
      </div>
      <div class="btn-row">
        <button class="btn btn-add" onclick="adjustPoints(1)">➕ Cộng</button>
        <button class="btn btn-sub" onclick="adjustPoints(-1)">➖ Trừ</button>
      </div>
      <button class="btn btn-reset" onclick="resetPoints()">↺ Reset về 0</button>
      <button class="btn btn-delete" onclick="deleteUser()">🗑️ Xoá người dùng</button>
      <button class="btn-close" onclick="closeModal()">✕ Đóng</button>
    </div>
  </div>

  <script src="../top-nav.js"></script>
  <script src="../bottom-nav.js"></script>

  <script>
    function closeModal() {
      document.getElementById('userModal').classList.remove('open');
    }
  </script>

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
      }
    }
  </script>

  <script type="module">
    import { initializeApp } from "firebase/app";
    import { getAuth, onAuthStateChanged } from "firebase/auth";
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, deleteDoc, serverTimestamp, addDoc } from "firebase/firestore";

    const firebaseConfig = {
      apiKey: "AIzaSyBupVBUTEJnBSBTShXKm8qnIJ8dGl4hQoY",
      authDomain: "lienquan-fake.firebaseapp.com",
      projectId: "lienquan-fake",
      storageBucket: "lienquan-fake.firebasestorage.app",
      messagingSenderId: "782694799992",
      appId: "1:782694799992:web:2d8e4a28626c3bbae8ab8d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_EMAIL = 'thang@game.com';
    let allUsers = [];
    let filteredUsers = [];
    window._selectedUserId = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '../index.html';
        return;
      }
      const userEmail = (user.email || '').trim().toLowerCase();
      if (userEmail !== ADMIN_EMAIL.trim().toLowerCase()) {
        alert('⚠️ Bạn không có quyền truy cập Admin!');
        window.location.href = '../index.html';
        return;
      }
      await loadUserList();
    });

    async function loadUserList() {
      const grid = document.getElementById('userGrid');
      grid.innerHTML = `<div class="empty-state"><div class="icon">⏳</div><div class="text">Đang tải...</div></div>`;
      try {
        const snap = await getDocs(collection(db, 'users'));
        allUsers = [];
        let totalPts = 0;
        snap.forEach(d => {
          const data = d.data();
          allUsers.push({ uid: d.id, ...data });
          totalPts += (data.points || 0);
        });
        allUsers.sort((a, b) => (b.points || 0) - (a.points || 0));
        filteredUsers = [...allUsers];

        document.getElementById('totalUsers').textContent = allUsers.length;
        document.getElementById('totalPoints').textContent = totalPts.toLocaleString();
        if (allUsers.length > 0) {
          const top = allUsers[0];
          const topName = top.nickname || top.displayName || (top.email ? top.email.split('@')[0] : 'Unknown');
          document.getElementById('topUser').textContent = topName;
        }

        renderUsers();
      } catch (e) {
        grid.innerHTML = `<div class="empty-state"><div class="icon">❌</div><div class="text error">Lỗi: ${e.message}</div></div>`;
      }
    }

    function renderUsers() {
      const grid = document.getElementById('userGrid');
      if (!filteredUsers.length) {
        grid.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><div class="text">Không tìm thấy</div></div>`;
        return;
      }
      grid.innerHTML = filteredUsers.map(u => {
        const name = u.nickname || u.displayName || (u.email ? u.email.split('@')[0] : 'Unknown');
        const avatarChar = name.charAt(0).toUpperCase();
        const avatarUrl = u.avatarUrl || '';
        const pts = (u.points || 0).toLocaleString();
        return `
          <div class="user-card" data-uid="${u.uid}">
            <div class="user-avatar" style="${avatarUrl ? `background-image:url(${avatarUrl});background-size:cover;` : ''}">${avatarUrl ? '' : avatarChar}</div>
            <div class="user-info">
              <div class="user-name">${name}</div>
              <div class="user-email">${u.email || 'Không có email'}</div>
            </div>
            <div class="user-points">${pts}</div>
          </div>
        `;
      }).join('');
      document.querySelectorAll('.user-card').forEach(el => {
        el.addEventListener('click', () => openUserPopup(el.dataset.uid));
      });
    }

    window.filterUsers = function() {
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!keyword) { filteredUsers = [...allUsers]; } else {
        filteredUsers = allUsers.filter(u => {
          const name = u.nickname || u.displayName || (u.email ? u.email.split('@')[0] : '');
          return name.toLowerCase().includes(keyword) || (u.email && u.email.toLowerCase().includes(keyword));
        });
      }
      renderUsers();
    };

    async function openUserPopup(uid) {
      window._selectedUserId = uid;
      document.querySelectorAll('.user-card').forEach(el => {
        el.style.borderColor = el.dataset.uid === uid ? 'rgba(56,189,248,0.5)' : 'rgba(56,189,248,0.08)';
        el.style.background = el.dataset.uid === uid ? 'rgba(56,189,248,0.08)' : 'rgba(255,255,255,0.03)';
      });
      try {
        const snap = await getDoc(doc(db, 'users', uid));
        if (!snap.exists()) return;
        const data = snap.data();
        const name = data.nickname || data.displayName || (data.email ? data.email.split('@')[0] : 'Unknown');
        const avatarEl = document.getElementById('modalAvatar');
        avatarEl.textContent = name.charAt(0).toUpperCase();
        if (data.avatarUrl) {
          avatarEl.style.backgroundImage = `url(${data.avatarUrl})`;
          avatarEl.style.backgroundSize = 'cover';
          avatarEl.textContent = '';
        } else {
          avatarEl.style.backgroundImage = '';
        }
        document.getElementById('modalName').textContent = name;
        document.getElementById('modalEmail').textContent = data.email || 'Không có email';
        document.getElementById('modalPoints').textContent = (data.points || 0).toLocaleString();
        document.getElementById('modalPointsAmount').value = '';
        document.getElementById('userModal').classList.add('open');
      } catch(e) { alert('Lỗi: ' + e.message); }
    }

    window.adjustPoints = async function(multiplier) {
      if (!window._selectedUserId) return alert('Chưa chọn user!');
      const amt = parseInt(document.getElementById('modalPointsAmount').value);
      if (isNaN(amt) || amt <= 0) return alert('Nhập số điểm hợp lệ!');
      try {
        const userRef = doc(db, 'users', window._selectedUserId);
        const snap = await getDoc(userRef);
        let current = snap.exists() ? (snap.data().points || 0) : 0;
        let newTotal = current + (amt * multiplier);
        if (newTotal < 0) newTotal = 0;
        await updateDoc(userRef, { points: newTotal, lastAdminUpdate: serverTimestamp() });
        document.getElementById('modalPoints').textContent = newTotal.toLocaleString();
        const card = document.querySelector(`.user-card[data-uid="${window._selectedUserId}"] .user-points`);
        if (card) card.textContent = newTotal.toLocaleString();
        // update stats
        const idx = allUsers.findIndex(u => u.uid === window._selectedUserId);
        if (idx !== -1) allUsers[idx].points = newTotal;
        allUsers.sort((a, b) => (b.points || 0) - (a.points || 0));
        const totalPts = allUsers.reduce((sum, u) => sum + (u.points || 0), 0);
        document.getElementById('totalPoints').textContent = totalPts.toLocaleString();
        if (allUsers.length) {
          const top = allUsers[0];
          const topName = top.nickname || top.displayName || (top.email ? top.email.split('@')[0] : 'Unknown');
          document.getElementById('topUser').textContent = topName;
        }
        document.getElementById('modalPointsAmount').value = '';
      } catch(e) { alert('Lỗi: ' + e.message); }
    };

    window.resetPoints = async function() {
      if (!window._selectedUserId) return;
      if (!confirm('Reset điểm về 0?')) return;
      try {
        await updateDoc(doc(db, 'users', window._selectedUserId), { points: 0 });
        document.getElementById('modalPoints').textContent = '0';
        const card = document.querySelector(`.user-card[data-uid="${window._selectedUserId}"] .user-points`);
        if (card) card.textContent = '0';
        const idx = allUsers.findIndex(u => u.uid === window._selectedUserId);
        if (idx !== -1) allUsers[idx].points = 0;
        allUsers.sort((a, b) => (b.points || 0) - (a.points || 0));
        const totalPts = allUsers.reduce((sum, u) => sum + (u.points || 0), 0);
        document.getElementById('totalPoints').textContent = totalPts.toLocaleString();
        if (allUsers.length) {
          const top = allUsers[0];
          const topName = top.nickname || top.displayName || (top.email ? top.email.split('@')[0] : 'Unknown');
          document.getElementById('topUser').textContent = topName;
        }
      } catch(e) { alert('Lỗi: ' + e.message); }
    };

    window.deleteUser = async function() {
      if (!window._selectedUserId) return;
      const idx0 = allUsers.findIndex(u => u.uid === window._selectedUserId);
      const target = idx0 !== -1 ? allUsers[idx0] : null;
      const targetName = target ? (target.nickname || target.displayName || (target.email ? target.email.split('@')[0] : 'người dùng này')) : 'người dùng này';
      if (!confirm(`Xoá vĩnh viễn "${targetName}"? Hành động này không thể hoàn tác.`)) return;
      try {
        await deleteDoc(doc(db, 'users', window._selectedUserId));
        if (idx0 !== -1) allUsers.splice(idx0, 1);
        filteredUsers = filteredUsers.filter(u => u.uid !== window._selectedUserId);
        closeModal();
        renderUsers();
        document.getElementById('totalUsers').textContent = allUsers.length;
        const totalPts = allUsers.reduce((sum, u) => sum + (u.points || 0), 0);
        document.getElementById('totalPoints').textContent = totalPts.toLocaleString();
        if (allUsers.length) {
          const top = allUsers[0];
          const topName = top.nickname || top.displayName || (top.email ? top.email.split('@')[0] : 'Unknown');
          document.getElementById('topUser').textContent = topName;
        } else {
          document.getElementById('topUser').textContent = '—';
        }
        window._selectedUserId = null;
      } catch(e) { alert('Lỗi xoá: ' + e.message); }
    };

    window.closeModal = closeModal;

  </script>
</body>
</html>
