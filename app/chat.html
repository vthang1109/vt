<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"/>
  <title>VTWorld – Chat</title>
  <link rel="stylesheet" href="../style.css"/>
  <link rel="stylesheet" href="chat.css"/>
  <link rel="stylesheet" href="../quests.css"/>
  <script type="module" src="../quests.js"></script>
  <script type="module" src="../avatar.js"></script>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<!-- Toast -->
<div id="toastContainer"></div>


<!-- Layout chính -->
<div class="chat-layout" id="chatLayout">

  <!-- SIDEBAR -->
  <div class="chat-sidebar" id="chatSidebar">
    <!-- Tab bar -->
    <div class="sidebar-tabs">
      <button class="stab active" data-tab="chat" onclick="sidebarTab('chat')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="18" height="18" fill="currentColor"><path d="M0 240c0 54.4 19.3 104.6 51.9 144.9L3.1 474.3c-2 3.7-3.1 7.9-3.1 12.2 0 14.1 11.4 25.5 25.5 25.5 4 0 7.8-.6 11.5-2.1L153.4 460c31.4 12.9 66.1 20 102.6 20 141.4 0 256-107.5 256-240S397.4 0 256 0 0 107.5 0 240zM94 407.9c9.3-17.1 7.4-38.1-4.8-53.2-26.1-32.3-41.2-71.9-41.2-114.7 0-103.2 90.2-192 208-192s208 88.8 208 192-90.2 192-208 192c-30.2 0-58.7-5.9-84.3-16.4-11.9-4.9-25.3-4.8-37.1 .3L76 440.9 94 407.9zM144 272a32 32 0 1 0 0-64 32 32 0 1 0 0 64zm144-32a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zm80 32a32 32 0 1 0 0-64 32 32 0 1 0 0 64z"/></svg> Chat</button>
      <button class="stab" data-tab="friends" onclick="sidebarTab('friends')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" width="18" height="18" fill="currentColor"><path d="M64 128a112 112 0 1 1 224 0 112 112 0 1 1 -224 0zM0 464c0-97.2 78.8-176 176-176s176 78.8 176 176l0 6c0 23.2-18.8 42-42 42L42 512c-23.2 0-42-18.8-42-42l0-6zM432 64a96 96 0 1 1 0 192 96 96 0 1 1 0-192zm0 240c79.5 0 144 64.5 144 144l0 22.4c0 23-18.6 41.6-41.6 41.6l-144.8 0c6.6-12.5 10.4-26.8 10.4-42l0-6c0-51.5-17.4-98.9-46.5-136.7 22.6-14.7 49.6-23.3 78.5-23.3z"/></svg> Bạn bè</button>
      <button class="stab" data-tab="explore" onclick="sidebarTab('explore')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="18" height="18" fill="currentColor"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376C296.3 401.1 253.9 416 208 416 93.1 416 0 322.9 0 208S93.1 0 208 0 416 93.1 416 208zM208 112c-13.3 0-24 10.7-24 24l0 48-48 0c-13.3 0-24 10.7-24 24s10.7 24 24 24l48 0 0 48c0 13.3 10.7 24 24 24s24-10.7 24-24l0-48 48 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-48 0 0-48c0-13.3-10.7-24-24-24z"/></svg> Khám phá</button>
      <button class="stab" data-tab="announce" onclick="sidebarTab('announce')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="18" height="18" fill="currentColor"><path d="M224 0c-13.3 0-24 10.7-24 24l0 9.7C118.6 45.3 56 115.4 56 200l0 14.5c0 37.7-10 74.7-29 107.3L5.1 359.2C1.8 365 0 371.5 0 378.2 0 399.1 16.9 416 37.8 416l372.4 0c20.9 0 37.8-16.9 37.8-37.8 0-6.7-1.8-13.3-5.1-19L421 321.7c-19-32.6-29-69.6-29-107.3l0-14.5c0-84.6-62.6-154.7-144-166.3l0-9.7c0-13.3-10.7-24-24-24zM392.4 368l-336.9 0 12.9-22.1C91.7 306 104 260.6 104 214.5l0-14.5c0-66.3 53.7-120 120-120s120 53.7 120 120l0 14.5c0 46.2 12.3 91.5 35.5 131.4L392.4 368zM156.1 464c9.9 28 36.6 48 67.9 48s58-20 67.9-48l-135.8 0z"/></svg> Thông báo</button>
    </div>

    <!-- Panel: Chat -->
    <div class="sidebar-panel active" id="panel-chat">
      <div class="search-wrap">
        <input class="search-input" id="chatSearchInput" placeholder="🔍 Tìm..." oninput="filterContacts()"/>
      </div>
      <div class="contact-list" id="chatContactList">
        <div class="chat-contact" id="contact-__server__" onclick="openConvo('server','Chat toàn server',null,'server')">
          <div class="contact-av" style="background:linear-gradient(135deg,#0288D1,#0ea5e9)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="18" height="18" fill="#fff"><path d="M55.7 199.7l30.9 30.9c6 6 14.1 9.4 22.6 9.4l21.5 0c8.5 0 16.6 3.4 22.6 9.4l29.3 29.3c6 6 9.4 14.1 9.4 22.6l0 37.5c0 8.5 3.4 16.6 9.4 22.6l13.3 13.3c6 6 9.4 14.1 9.4 22.6l0 18.7c0 17.7 14.3 32 32 32s32-14.3 32-32l0-2.7c0-8.5 3.4-16.6 9.4-22.6l45.3-45.3c6-6 9.4-14.1 9.4-22.6l0-34.7c0-17.7-14.3-32-32-32l-82.7 0c-8.5 0-16.6-3.4-22.6-9.4l-16-16c-4.2-4.2-6.6-10-6.6-16 0-12.5 10.1-22.6 22.6-22.6l34.7 0c12.5 0 22.6-10.1 22.6-22.6 0-6-2.4-11.8-6.6-16l-19.7-19.7C242 130 240 125.1 240 120s2-10 5.7-13.7l17.3-17.3c5.8-5.8 9.1-13.7 9.1-21.9 0-7.2-2.4-13.7-6.4-18.9-3.2-.1-6.4-.2-9.6-.2-95.4 0-175.7 64.2-200.3 151.7zM464 256c0-34.6-8.4-67.2-23.4-95.8-6.4 .9-12.7 3.9-17.9 9.1l-13.4 13.4c-6 6-9.4 14.1-9.4 22.6l0 34.7c0 17.7 14.3 32 32 32l24.1 0c2.5 0 5-.3 7.3-.8 .4-5 .5-10.1 .5-15.2zM0 256a256 256 0 1 1 512 0 256 256 0 1 1 -512 0z"/></svg></div>
          <div class="contact-info">
            <span class="contact-name">Chat toàn server</span>
            <span class="contact-preview">Mọi người đều thấy</span>
          </div>
        </div>
        <div id="friendsInChat"></div>
      </div>
    </div>

    <!-- Panel: Bạn bè -->
    <div class="sidebar-panel" id="panel-friends">
      <div class="section-label warn">📨 Lời mời kết bạn</div>
      <div id="friendRequestsList" class="friend-list-scroll"></div>
      <div class="section-label ok">✅ Bạn bè của bạn</div>
      <div id="myFriendsList" class="friend-list-scroll flex1"></div>
    </div>

    <!-- Panel: Khám phá -->
    <div class="sidebar-panel" id="panel-explore">
      <div class="search-wrap">
        <input class="search-input" id="exploreInput" placeholder="🔍 Tìm người mới..." oninput="filterExplore()"/>
      </div>
      <div class="contact-list" id="allUsersInChat"></div>
    </div>

    <!-- Panel: Thông báo -->
    <div class="sidebar-panel" id="panel-announce">
      <div class="announce-panel-header">
        <span class="announce-panel-title">📢 Thông báo từ Admin</span>
      </div>
      <!-- Admin send announcement form (chỉ hiện nếu là admin) -->
      <div id="announceAdminForm" class="announce-admin-form" style="display:none">
        <textarea class="announce-admin-textarea" id="announceAdminText" placeholder="Nhập nội dung thông báo..." maxlength="500" oninput="previewChatAnnounce()"></textarea>
        <div class="announce-admin-preview" id="announceAdminPreview">
          <div class="announce-card-badge">📢 XEM TRƯỚC</div>
          <div class="announce-admin-preview-text" id="announceAdminPreviewText"></div>
        </div>
        <button class="announce-admin-btn" id="announceAdminBtn">📢 Gửi thông báo</button>
        <div class="announce-admin-status" id="announceAdminStatus"></div>
      </div>
      <div class="announce-list" id="announceList">
        <div class="announce-empty">Đang tải thông báo...</div>
      </div>
    </div>
  </div>

  <!-- CỬA SỔ CHAT -->
  <div class="chat-window" id="chatWindow">
    <!-- Header -->
    <div class="cw-header">
      <button class="cw-back" id="cwBack" onclick="backToSidebar()">←</button>
      <div class="cw-av" id="chatWinAvatar" onclick="viewCurrentProfile()" title="Xem hồ sơ" style="cursor:pointer"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="18" height="18" fill="#fff"><path d="M55.7 199.7l30.9 30.9c6 6 14.1 9.4 22.6 9.4l21.5 0c8.5 0 16.6 3.4 22.6 9.4l29.3 29.3c6 6 9.4 14.1 9.4 22.6l0 37.5c0 8.5 3.4 16.6 9.4 22.6l13.3 13.3c6 6 9.4 14.1 9.4 22.6l0 18.7c0 17.7 14.3 32 32 32s32-14.3 32-32l0-2.7c0-8.5 3.4-16.6 9.4-22.6l45.3-45.3c6-6 9.4-14.1 9.4-22.6l0-34.7c0-17.7-14.3-32-32-32l-82.7 0c-8.5 0-16.6-3.4-22.6-9.4l-16-16c-4.2-4.2-6.6-10-6.6-16 0-12.5 10.1-22.6 22.6-22.6l34.7 0c12.5 0 22.6-10.1 22.6-22.6 0-6-2.4-11.8-6.6-16l-19.7-19.7C242 130 240 125.1 240 120s2-10 5.7-13.7l17.3-17.3c5.8-5.8 9.1-13.7 9.1-21.9 0-7.2-2.4-13.7-6.4-18.9-3.2-.1-6.4-.2-9.6-.2-95.4 0-175.7 64.2-200.3 151.7zM464 256c0-34.6-8.4-67.2-23.4-95.8-6.4 .9-12.7 3.9-17.9 9.1l-13.4 13.4c-6 6-9.4 14.1-9.4 22.6l0 34.7c0 17.7 14.3 32 32 32l24.1 0c2.5 0 5-.3 7.3-.8 .4-5 .5-10.1 .5-15.2zM0 256a256 256 0 1 1 512 0 256 256 0 1 1 -512 0z"/></svg></div>
      <div class="cw-info" onclick="viewCurrentProfile()" title="Xem hồ sơ" style="cursor:pointer">
        <span class="cw-name" id="chatWinName">Chat toàn server</span>
        <span class="cw-status">● Online</span>
      </div>
      <!-- Settings gear (theme + xoá + gửi điểm) -->
      <div style="position:relative; flex-shrink:0;">
        <button id="settingsBtn" class="settings-btn" onclick="toggleSettingsDropdown()" title="Cài đặt">⚙️</button>
        <div id="settingsDropdown" class="settings-dropdown">
          <button class="sd-option" id="sd-theme-btn" onclick="openThemePopup()">🎨 Giao diện</button>
          <div class="sd-divider"></div>
          <button class="sd-option danger" id="sd-clear-msgs" onclick="clearCurrentMessages()">🗑 Xoá tin nhắn</button>
          <button class="sd-option" id="sd-hide-convo" onclick="hideCurrentConversation()">🙈 Ẩn đoạn chat</button>
          <button class="sd-option gold" id="sd-send-points" onclick="sendPointsToCurrent()">💸 Gửi điểm</button>
          <button class="sd-option gold" id="sd-gift-tag" onclick="giftTagToCurrent()" style="display:none">🎁 Tặng Tag</button>
        </div>
      </div>
    </div>

    <!-- Messages -->
    <div class="cw-messages" id="chatWindowMessages">
      <div class="msg-system">👋 Chọn cuộc trò chuyện để bắt đầu</div>
    </div>

    <!-- Input -->
    <div class="cw-input-row">
      <input class="cw-input" id="chatWindowInput" placeholder="Nhắn tin..." onkeydown="if(event.key==='Enter')sendWindowChat()"/>
      <button class="cw-send" onclick="sendWindowChat()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- THEME POPUP MODAL -->
  <div id="themePopupOverlay" class="tp-overlay" onclick="closeThemePopup()">
    <div class="tp-modal" onclick="event.stopPropagation()">
      <div class="tp-header">
        <span class="tp-title">🎨 Chọn giao diện</span>
        <button class="tp-close" onclick="closeThemePopup()">✕</button>
      </div>
      <div class="tp-grid">
        <button class="tp-theme" data-theme-val="blue" onclick="setChatTheme('blue')">
          <span class="tp-dot tp-dot-blue"></span>
          <span class="tp-name">Neon Xanh</span>
        </button>
        <button class="tp-theme" data-theme-val="pink" onclick="setChatTheme('pink')">
          <span class="tp-dot tp-dot-pink"></span>
          <span class="tp-name">Hồng Ngọc</span>
        </button>
        <button class="tp-theme" data-theme-val="purple" onclick="setChatTheme('purple')">
          <span class="tp-dot tp-dot-purple"></span>
          <span class="tp-name">Tím Huyền</span>
        </button>
        <button class="tp-theme" data-theme-val="green" onclick="setChatTheme('green')">
          <span class="tp-dot tp-dot-green"></span>
          <span class="tp-name">Xanh Lá</span>
        </button>
        <button class="tp-theme" data-theme-val="orange" onclick="setChatTheme('orange')">
          <span class="tp-dot tp-dot-orange"></span>
          <span class="tp-name">Cam Lửa</span>
        </button>
        <button class="tp-theme" data-theme-val="dark" onclick="setChatTheme('dark')">
          <span class="tp-dot tp-dot-dark"></span>
          <span class="tp-name">Tối Đen</span>
        </button>
      </div>
    </div>
  </div>

</div><!-- end chat-layout -->
<!-- Scripts -->  <script src="../profile-card.js"></script>
<script type="module" src="chat.js"></script>
<script type="module" src="../send-points.js"></script>  <script>
    // ===== SETTINGS DROPDOWN =====
    window.toggleSettingsDropdown = function() {
      document.getElementById('settingsDropdown').classList.toggle('open');
      document.getElementById('settingsBtn').classList.toggle('open');
    };

    // ===== THEME POPUP =====
    window.openThemePopup = function() {
      document.getElementById('themePopupOverlay').classList.add('open');
      document.getElementById('settingsDropdown').classList.remove('open');
      document.getElementById('settingsBtn').classList.remove('open');
      // Cập nhật active state trong popup
      const active = localStorage.getItem('vt_chat_theme') || 'blue';
      document.querySelectorAll('#themePopupOverlay .tp-theme').forEach(o => {
        o.classList.toggle('active', o.dataset.themeVal === active);
      });
    };
    window.closeThemePopup = function() {
      document.getElementById('themePopupOverlay').classList.remove('open');
    };
    // Đóng popup bằng Escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        const ov = document.getElementById('themePopupOverlay');
        if (ov && ov.classList.contains('open')) ov.classList.remove('open');
      }
    });

    window.setChatTheme = function(themeId) {
      // Lưu vào localStorage
      localStorage.setItem('vt_chat_theme', themeId);
      // Áp dụng theme cho CHAT WINDOW — không ảnh hưởng sidebar/tabs
      const cw = document.getElementById('chatWindow');
      if (cw) {
        ['blue','pink','purple','green','orange','dark'].forEach(t => cw.classList.remove('cw-theme-' + t));
        cw.classList.add('cw-theme-' + themeId);
      }
      // Đóng dropdown & popup
      document.getElementById('settingsDropdown')?.classList.remove('open');
      document.getElementById('settingsBtn')?.classList.remove('open');
      document.getElementById('themePopupOverlay')?.classList.remove('open');
      // Cập nhật active state trong popup
      document.querySelectorAll('#themePopupOverlay .tp-theme').forEach(o => {
        o.classList.toggle('active', o.dataset.themeVal === themeId);
      });
      // Đổi màu particles
      const colors = {
        blue:   { p: 'rgba(56,189,248,0.5)', lRgb: '56,189,248', lAlpha: 0.07 },
        pink:   { p: 'rgba(232,67,147,0.4)', lRgb: '232,67,147', lAlpha: 0.06 },
        purple: { p: 'rgba(167,139,250,0.4)', lRgb: '167,139,250', lAlpha: 0.06 },
        green:  { p: 'rgba(16,185,129,0.4)', lRgb: '16,185,129', lAlpha: 0.06 },
        orange: { p: 'rgba(249,115,22,0.4)', lRgb: '249,115,22', lAlpha: 0.06 },
        dark:   { p: 'rgba(148,163,184,0.3)', lRgb: '148,163,184', lAlpha: 0.04 }
      };
      if (!window.__vtParticleColors) {
        window.__vtParticleColors = {};
      }
      const c = colors[themeId] || colors.blue;
      window.__vtParticleColors.p = c.p;
      window.__vtParticleColors.lRgb = c.lRgb;
      window.__vtParticleColors.lAlpha = c.lAlpha;
      // Lưu lên Firestore (đồng bộ giữa các thiết bị)
      if (window.saveChatThemeToFirestore) {
        window.saveChatThemeToFirestore(themeId);
      }
    };
    // Đóng dropdown khi click ra ngoài
    document.addEventListener('click', function(e) {
      const dd = document.getElementById('settingsDropdown');
      const btn = document.getElementById('settingsBtn');
      if (dd && btn && !dd.contains(e.target) && !btn.contains(e.target)) {
        dd.classList.remove('open');
        btn.classList.remove('open');
      }
    });

    // Khôi phục theme đã lưu (dùng setChatTheme để đồng bộ cả particles + chat window)
    (function initTheme() {
      const saved = localStorage.getItem('vt_chat_theme') || 'blue';
      if (typeof window.setChatTheme === 'function') {
        window.setChatTheme(saved);
      } else {
        // Fallback: apply lớp theme trực tiếp lên chat window
        const cw = document.getElementById('chatWindow');
        if (cw) cw.classList.add('cw-theme-' + saved);
        setTimeout(() => {
          if (typeof window.setChatTheme === 'function') window.setChatTheme(saved);
        }, 200);
      }
    })();

    // Sidebar tab switch
    window.sidebarTab = function(tab) {
    document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.sidebar-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
    if (tab === 'friends') {
      window._renderFriendRequestsList && window._renderFriendRequestsList();
      window._renderMyFriendsList && window._renderMyFriendsList();
    }
    if (tab === 'announce') {
      window._renderAnnouncements && window._renderAnnouncements();
    }
  };

  // Mobile: back về sidebar
  window.backToSidebar = function() {
    document.getElementById('chatSidebar').classList.remove('sb-hidden');
    document.getElementById('chatWindow').classList.remove('cw-active');
    document.getElementById('cwBack').style.display = 'none';
  };

  // Explore filter
  window.filterExplore = function() {
    const q = (document.getElementById('exploreInput')?.value || '').toLowerCase();
    document.querySelectorAll('#allUsersInChat .chat-contact').forEach(el => {
      const name = el.querySelector('.contact-name')?.textContent.toLowerCase() || '';
      el.style.display = name.includes(q) ? '' : 'none';
    });
  };

  // Filter contacts
  window.filterContacts = function() {
    const q = document.getElementById('chatSearchInput').value.toLowerCase();
    document.querySelectorAll('#chatContactList .chat-contact').forEach(c => {
      const nm = c.querySelector('.contact-name');
      c.style.display = nm && nm.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  };

  // Profile nav
  window.goToProfile = function() {
    if (window.currentConvoUid) location.href = 'profile.html?uid=' + window.currentConvoUid;
  };

  // Gửi điểm
  window.sendPointsToCurrent = function() {
    const uid  = window.currentConvoUid;
    const name = window.currentConvoName || 'Người nhận';
    if (!uid) { window.showToast && window.showToast('⚠️ Chỉ gửi điểm khi chat riêng!', 'warn'); return; }
    window.openSendPointsModal && window.openSendPointsModal(uid, name);
  };

  // Patch openConvo → mobile slide + show/hide settings options
  (function() {
    const tryPatch = setInterval(() => {
      if (typeof window.openConvo === 'function' && !window.openConvo.__patched) {
        const orig = window.openConvo;
        window.openConvo = function(uid, name, av, type) {
          const r = orig.apply(this, arguments);
          window.currentConvoUid  = type === 'server' ? null : uid;
          window.currentConvoName = name;
          // Mobile: hiện chat window
          if (window.innerWidth <= 640) {
            document.getElementById('chatSidebar').classList.add('sb-hidden');
            document.getElementById('chatWindow').classList.add('cw-active');
            document.getElementById('cwBack').style.display = 'flex';
          }
          // Show/hide options trong settings dropdown
          const sdClear = document.getElementById('sd-clear-msgs');
          const sdPoints = document.getElementById('sd-send-points');
          const sdHide = document.getElementById('sd-hide-convo');
          const sdGift = document.getElementById('sd-gift-tag');
          const isDm = !!window.currentConvoUid;
          if (sdClear) sdClear.classList.toggle('hidden', !isDm);
          if (sdPoints) sdPoints.classList.toggle('hidden', !isDm);
          if (sdHide) sdHide.style.display = isDm ? '' : 'none';
          if (sdGift) sdGift.style.display = (window._isAdminChat && isDm) ? '' : 'none';
          return r;
        };
        window.openConvo.__patched = true;
        clearInterval(tryPatch);
      }
    }, 100);
  })();
</script>

<script src="../top-nav.js"></script>
<script src="../bottom-nav.js"></script>
<script>
  TopNav.init();
  BottomNav.init({ active: 'chat' });
</script>
</body>
</html>
