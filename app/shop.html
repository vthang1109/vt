<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VTWorld — Cửa Hàng</title>
  <link rel="stylesheet" href="../style.css"/>
  <link rel="stylesheet" href="shop.css"/>
  <link rel="stylesheet" href="../titles.css">
  <script src="../top-nav.js"></script>
  <script src="../bottom-nav.js"></script>
</head>
<body data-bottom-nav="shop">

  <div id="top-nav-root"></div>
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="shop-wrap">

    <!-- TAB TRÊN CÙNG: SHOP / BAG -->
    <div class="page-top-tabs">
      <a class="page-top-tab active" href="shop.html">Shop</a>
      <a class="page-top-tab" href="bag.html">Túi đồ</a>
    </div>

    <!-- HERO -->
    <div class="shop-hero">
      <div class="shop-hero-icon">🏪</div>
      <h1>VTWorld <span>Cửa Hàng</span></h1>
    </div>

    <!-- TAB BAR: Gacha | Danh hiệu -->
    <div class="shop-tab-bar">
      <button class="shop-tab-btn active" data-tab="gacha" id="tabGacha">
        <span class="tab-icon">🐾</span>
        <span class="tab-label">Gacha</span>
      </button>
      <button class="shop-tab-btn" data-tab="title" id="tabTitle">
        <span class="tab-icon">🏅</span>
        <span class="tab-label">Danh Hiệu</span>
      </button>
    </div>

    <!-- CONTENT PANELS -->
    <div class="shop-panel active" data-panel="gacha">
      <div class="shop-grid" id="shopGrid"></div>
    </div>

    <div class="shop-panel" data-panel="title">
      <div class="title-tier-tabs" id="titleTierTabs"></div>
      <div class="shop-grid" id="titleGrid"></div>
    </div>

  </div>

  <!-- RESULT OVERLAY -->
  <div class="result-overlay" id="resultOverlay">
    <div class="result-box">
      <div class="result-title" id="resultTitle">Kết quả Gacha</div>
      <div class="result-grid" id="resultGrid"></div>
      <button class="result-close" onclick="document.getElementById('resultOverlay').classList.remove('active')">✕ Đóng</button>
    </div>
  </div>

  <script type="module">
    import './shop.js';
  </script>

  <script>
    // Background particles
    (function(){
      const c=document.getElementById('bg-canvas');
      if(!c)return;
      const ctx=c.getContext('2d');let p=[];
      function r(){c.width=innerWidth;c.height=innerHeight;}r();
      window.addEventListener('resize',r);
      for(let i=0;i<40;i++)p.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
      function d(){ctx.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;if(q.x<0)q.x=c.width;if(q.x>c.width)q.x=0;if(q.y<0)q.y=c.height;if(q.y>c.height)q.y=0;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fillStyle='rgba(56,189,248,0.5)';ctx.fill();});requestAnimationFrame(d);}d();
    })();
  </script>
</body>
</html>
