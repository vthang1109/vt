<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VTWorld — Túi Đồ</title>
  <link rel="stylesheet" href="../style.css"/>
  <link rel="stylesheet" href="shop.css"/>
  <link rel="stylesheet" href="bag.css"/>
  <link rel="stylesheet" href="../titles.css">
  <script src="../top-nav.js"></script>
  <script src="../bottom-nav.js"></script>
</head>
<body data-bottom-nav="shop">

  <div id="top-nav-root"></div>
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="shop-wrap">

    <!-- TAB TRÊN CÙNG: SHOP / TÚI ĐỒ -->
    <div class="page-top-tabs">
      <a class="page-top-tab" href="shop.html">Shop</a>
      <a class="page-top-tab active" href="bag.html">Túi đồ</a>
    </div>

    <!-- TAB: THÚ CƯNG / VẬT PHẨM / DANH HIỆU -->
    <div class="shop-tabs" id="bagTabs">
      <button class="shop-tab active" data-tab="pet">🐾 Thú cưng</button>
      <button class="shop-tab" data-tab="item">📦 Vật phẩm</button>
      <button class="shop-tab" data-tab="title">🏅 Danh hiệu</button>
    </div>

    <!-- PANEL PET -->
    <div id="pet-panel" class="bag-panel active-panel">
      <div id="bag-shard-bar"></div>
      <div class="shop-grid" id="bag-grid"></div>
    </div>

    <!-- PANEL VẬT PHẨM -->
    <div id="item-panel" class="bag-panel">
      <div id="outfit-shard-bar"></div>
      <div class="bag-stats" id="item-stats"></div>
      <div class="shop-grid" id="item-grid"></div>
    </div>

    <!-- PANEL DANH HIỆU -->
    <div id="title-panel" class="bag-panel">
      <div class="shop-grid" id="title-grid"></div>
    </div>

  </div>

  <!-- POPUP ĐỔI PET -->
  <div id="petRedeemModal" class="modal-overlay" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="modal-box">
      <div class="modal-header">
        <span>🧩 Đổi mảnh lấy pet</span>
        <button class="modal-close" onclick="document.getElementById('petRedeemModal').classList.remove('open')">✕</button>
      </div>
      <div id="petRedeemList" class="shop-grid" style="max-height:300px;overflow-y:auto;"></div>
      <button class="bag-btn" style="width:100%;margin-top:12px;background:rgba(56,189,248,0.15);padding:10px;font-size:13px;" onclick="document.getElementById('petRedeemModal').classList.remove('open')">Đóng</button>
    </div>
  </div>

  <!-- POPUP ĐỔI OUTFIT -->
  <div id="outfitRedeemModal" class="modal-overlay" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="modal-box">
      <div class="modal-header">
        <span>🧩 Đổi mảnh nhân vật lấy trang bị</span>
        <button class="modal-close" onclick="document.getElementById('outfitRedeemModal').classList.remove('open')">✕</button>
      </div>
      <div id="outfitRedeemSystemSwitch" style="display:flex;gap:8px;margin-bottom:12px;"></div>
      <div id="outfitRedeemSlotTabs" class="shop-tabs" style="margin-bottom:12px;"></div>
      <div id="outfitRedeemItems" class="shop-grid" style="max-height:240px;overflow-y:auto;"></div>
      <button class="bag-btn" style="width:100%;margin-top:12px;background:rgba(56,189,248,0.15);padding:10px;font-size:13px;" onclick="document.getElementById('outfitRedeemModal').classList.remove('open')">Đóng</button>
    </div>
  </div>

  <script>
    // Tab Thú cưng / Vật phẩm — bind sau DOM ready, scope trong #bagTabs
    document.getElementById('bagTabs').addEventListener('click', e => {
      const btn = e.target.closest('.shop-tab');
      if (!btn) return;
      document.querySelectorAll('#bagTabs .shop-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      const target = btn.dataset.tab;
      document.querySelectorAll('.bag-panel').forEach(p => p.classList.remove('active-panel'));
      if (target === 'pet') {
        document.getElementById('pet-panel').classList.add('active-panel');
        if (window._bagRenderBag) window._bagRenderBag();
      } else if (target === 'item') {
        document.getElementById('item-panel').classList.add('active-panel');
        if (window._bagRenderItems) window._bagRenderItems();
      } else if (target === 'title') {
        document.getElementById('title-panel').classList.add('active-panel');
        if (window._bagRenderTitles) window._bagRenderTitles();
      }
    });

    // Background particles
    (function(){
      const c = document.getElementById('bg-canvas');
      if (!c) return;
      const ctx = c.getContext('2d'); let p = [];
      function r(){ c.width = innerWidth; c.height = innerHeight; } r();
      window.addEventListener('resize', r);
      for (let i = 0; i < 40; i++) p.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
      function d(){ ctx.clearRect(0,0,c.width,c.height); p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;if(q.x<0)q.x=c.width;if(q.x>c.width)q.x=0;if(q.y<0)q.y=c.height;if(q.y>c.height)q.y=0;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fillStyle='rgba(56,189,248,0.5)';ctx.fill();}); requestAnimationFrame(d); } d();
    })();
  </script>

  <script type="module" src="bag.js"></script>
</body>
</html>
