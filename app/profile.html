<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VTWorld — Hồ Sơ</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="profile.css" />
  <link rel="stylesheet" href="../titles.css">
  <link rel="stylesheet" href="../pet.css" />

  <!-- Nav mới -->
  <script src="../top-nav.js"></script>
  <script src="../bottom-nav.js"></script>
</head>
<body data-bottom-nav="profile">

  <!-- TopNav sẽ render vào đây -->
  <div id="top-nav-root"></div>

  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="pro-wrap">
    <!-- ẢNH BÌA + TÊN -->
    <div class="pro-cover" id="pro-cover">
      <div class="pro-cover-bg" id="pro-cover-bg"></div>
      <img class="pro-cover-img" id="pro-cover-img" style="display:none" />

      <div class="pro-cover-rank" id="pro-cover-rank"></div>

      <div class="pro-name-cover">
        <h1 class="pro-name" id="pro-name" style="cursor:default">Đang tải...</h1>
        <label class="pro-name-color-btn" id="pro-name-color-btn" title="Đổi màu tên" style="display:none">
          🎨
          <input type="color" id="pro-name-color-input" value="#ffffff" style="display:none" />
        </label>
      </div>

      <label class="pro-cover-upload" id="pro-cover-upload-btn" title="Đổi ảnh bìa">
        📷
        <input type="file" id="pro-cover-input" accept="image/*" style="display:none" />
      </label>
    </div>

    <!-- HÀNG: AVATAR + ĐIỂM -->
    <div class="pro-header-row">
      <div class="pro-avatar-wrap">
        <div class="pro-avatar-ring">
          <div class="pro-avatar" id="pro-avatar">?</div>
        </div>
        <label class="pro-avatar-upload" id="pro-avatar-upload-btn" title="Đổi ảnh">
          📷
          <input type="file" id="pro-avatar-input" accept="image/*" style="display:none" />
        </label>
      </div>
      <div class="pro-points-wrap">
        <div class="pro-points-box">
          <span class="pro-points-icon">⭐</span>
          <span class="pro-points-val" id="pro-points">0</span>
          <span class="pro-points-label">điểm</span>
        </div>
      </div>
    </div>

    <!-- GRID -->
    <div class="pro-grid">

      <!-- Ảnh cá nhân -->
      <div class="pro-card pro-card-character" id="pro-photo-card">
        <div class="pro-photo-frame" id="pro-photo-frame">
          <div class="pro-photo-placeholder" id="pro-photo-placeholder">
            <span style="font-size:36px;opacity:0.4">🖼️</span>
            <span style="font-size:12px;color:#4a7a9b;font-weight:700;margin-top:6px">Ảnh cá nhân</span>
          </div>
          <img id="pro-photo-img" style="display:none;width:100%;height:100%;object-fit:cover;border-radius:14px" />
          <label class="pro-photo-upload-btn" id="pro-photo-upload-btn" style="display:none" title="Đổi ảnh cá nhân">
            📷
            <input type="file" id="pro-photo-input" accept="image/*" style="display:none" />
          </label>
        </div>
        <div class="pro-card-sub" id="pro-photo-sub">Ảnh cá nhân</div>
      </div>

      <!-- Thú cưng -->
      <div class="pro-card pro-card-pet" id="pro-pet-card" style="cursor:pointer">
        <div class="pro-pet-frame" id="pro-pet-frame">
          <div class="pro-pet-placeholder">
            <span class="pro-pet-emoji">🥚</span>
            <span class="pro-coming-soon">Bấm để gacha</span>
          </div>
        </div>
        <div class="pro-card-sub" id="pro-card-pet-sub">Chưa có thú cưng</div>
      </div>

      <div class="pro-card pro-card-vehicle">
        <div class="pro-card-label">🚗 Xe</div>
        <div class="pro-card-sub" id="pro-card-vehicle-sub">Chưa có xe</div>
      </div>

      <div class="pro-card pro-card-title" id="pro-title-card">
        
        <div class="pro-titles-list" id="pro-titles-list"></div>
      </div>
    </div>

    <div class="pro-stats-row">
      <div class="pro-stat">
        <span class="pro-stat-val" id="pro-stat-friends">—</span>
        <span class="pro-stat-label">Bạn bè</span>
      </div>
      <div class="pro-stat">
        <span class="pro-stat-val pro-stat-rank" id="pro-stat-rank">—</span>
        <span class="pro-stat-label">Xếp hạng</span>
      </div>
      <div class="pro-stat">
        <span class="pro-stat-val" id="pro-stat-joined">—</span>
        <span class="pro-stat-label">Tham gia</span>
      </div>
    </div>
  </div>

  <!-- POPUP THAY ĐỒ -->
  <div class="pet-modal-overlay" id="outfitModalOverlay" onclick="if(event.target===this)document.getElementById('outfitModalOverlay').classList.remove('open')">
    <div class="pet-modal">
      <div class="pet-modal-header">
        <span class="pet-modal-title">✨ PHÒNG THAY ĐỒ</span>
        <button class="pet-modal-close" onclick="document.getElementById('outfitModalOverlay').classList.remove('open')">✕</button>
      </div>
      <div class="pet-tab-content active" style="padding:16px;overflow-y:auto;max-height:70vh;">
        <div id="modalSystemSwitch" style="display:flex;gap:8px;margin-bottom:12px;"></div>
        <div id="modalCharPreview" style="width:100%;height:200px;background:rgba(56,189,248,0.05);border:2px solid rgba(56,189,248,0.25);border-radius:16px;margin-bottom:12px;position:relative;overflow:hidden;"></div>
        <div id="modalWardrobeTabs" style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;"></div>
        <div id="modalWardrobeItems" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:300px;overflow-y:auto;"></div>
        <button id="modalSaveBtn" style="width:100%;padding:12px;border-radius:12px;border:none;background:#22c55e;color:#fff;font-family:'Science Gothic';font-weight:500;font-size:14px;cursor:pointer;">💾 LƯU</button>
      </div>
    </div>
  </div>

  <!-- ===== SCRIPT ===== -->
  <script type="module">
    import './profile.js';
    import '../pet-ui.js';

    // Khởi tạo nav
    document.addEventListener('DOMContentLoaded', () => {
      if (window.TopNav) TopNav.init();
      if (window.BottomNav) BottomNav.init({ active: 'profile' });
    });

    // Pet card
    const petCard = document.getElementById('pro-pet-card');
    if (petCard) {
      petCard.addEventListener('click', async () => {
        try {
          if (typeof window.openPetModal === 'function') { await window.openPetModal(); return; }
          const petUI = await import('../pet-ui.js');
          if (typeof petUI.openPetModal === 'function') {
            window.openPetModal = petUI.openPetModal;
            await petUI.openPetModal();
          }
        } catch (e) {
          console.warn('Lỗi mở pet:', e);
          alert('🐾 Chức năng thú cưng đang được phát triển');
        }
      });
    }

    // ===== XẾP HẠNG =====
    window.updateRankDisplay = function(rankNumber) {
      const rankEl = document.getElementById('pro-stat-rank');
      if (!rankEl) return;
      rankEl.className = 'pro-stat-val pro-stat-rank';
      const bannerEl = document.getElementById('pro-cover');
      if (bannerEl) bannerEl.className = 'pro-cover';
      rankEl.innerHTML = '';
      const badge = document.createElement('span');
      badge.className = 'rank-badge';
      badge.textContent = rankNumber;

      const coverRankEl = document.getElementById('pro-cover-rank');
      if (coverRankEl) {
        let icon = '', cls = '', label = `#${rankNumber}`;
        if (rankNumber === 1)      { icon = '👑'; cls = 'rank-1'; label = '#1'; }
        else if (rankNumber === 2) { icon = '🥈'; cls = 'rank-2'; label = '#2'; }
        else if (rankNumber === 3) { icon = '🥉'; cls = 'rank-3'; label = '#3'; }
        coverRankEl.innerHTML = `<span class="rank-cover-badge ${cls}">${icon} ${label}</span>`;
      }

      if (rankNumber === 1) {
        rankEl.classList.add('rank-1'); if (bannerEl) bannerEl.classList.add('rank-1');
        badge.style.cssText = 'background:linear-gradient(135deg,#fbbf24,#f59e0b)!important;border-color:#fbbf24!important;box-shadow:0 0 20px rgba(251,191,36,.5)!important;color:#0f172a!important;';
        rankEl.appendChild(badge); const c=document.createElement('span'); c.className='rank-icon'; c.textContent='👑'; rankEl.appendChild(c);
      } else if (rankNumber === 2) {
        rankEl.classList.add('rank-2'); if (bannerEl) bannerEl.classList.add('rank-2');
        badge.style.cssText = 'background:linear-gradient(135deg,#e2e8f0,#94a3b8)!important;border-color:#e2e8f0!important;box-shadow:0 0 15px rgba(226,232,240,.4)!important;color:#0f172a!important;';
        rankEl.appendChild(badge); const m=document.createElement('span'); m.className='rank-icon'; m.textContent='🥈'; rankEl.appendChild(m);
      } else if (rankNumber === 3) {
        rankEl.classList.add('rank-3'); if (bannerEl) bannerEl.classList.add('rank-3');
        badge.style.cssText = 'background:linear-gradient(135deg,#d97706,#92400e)!important;border-color:#d97706!important;box-shadow:0 0 15px rgba(217,119,6,.4)!important;color:#fff!important;';
        rankEl.appendChild(badge); const m=document.createElement('span'); m.className='rank-icon'; m.textContent='🥉'; rankEl.appendChild(m);
      } else {
        rankEl.classList.add('rank-normal');
        badge.style.cssText = 'background:rgba(74,122,155,.2)!important;border-color:rgba(74,122,155,.3)!important;color:#4a7a9b!important;box-shadow:none!important;';
        rankEl.appendChild(badge);
        const n=document.createElement('span'); n.textContent=' #'+rankNumber; n.style.fontSize='14px'; n.style.color='#4a7a9b'; rankEl.appendChild(n);
      }
    };

    // ===== MÀU TÊN =====
    (function() {
      const btn = document.getElementById('pro-name-color-btn');
      const inp = document.getElementById('pro-name-color-input');
      const nm  = document.getElementById('pro-name');
      if (!btn || !inp || !nm) return;
      const saved = localStorage.getItem('vtNameColor');
      if (saved) nm.style.color = saved;
      inp.addEventListener('input',  () => nm.style.color = inp.value);
      inp.addEventListener('change', () => localStorage.setItem('vtNameColor', inp.value));
      btn.addEventListener('click',  () => inp.click());
    })();

    setTimeout(() => { if (window.VTPanelQuests) window.VTPanelQuests.refresh(); }, 1000);
    console.log('✅ Profile page loaded');
  </script>

  <!-- Background particles -->
  <script>
    (function() {
      const canvas = document.getElementById('bg-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let particles = [];
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      resize(); window.addEventListener('resize', resize);
      for (let i = 0; i < 40; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx:(Math.random()-.5)*.4, vy:(Math.random()-.5)*.4, r:Math.random()*1.5+.5 });
      function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; if(p.x<0)p.x=canvas.width; if(p.x>canvas.width)p.x=0; if(p.y<0)p.y=canvas.height; if(p.y>canvas.height)p.y=0; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle='rgba(56,189,248,0.5)'; ctx.fill(); });
        for(let i=0;i<particles.length;i++) for(let j=i+1;j<particles.length;j++) { const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,d=Math.sqrt(dx*dx+dy*dy); if(d<100){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=`rgba(56,189,248,${.07*(1-d/100)})`;ctx.lineWidth=.5;ctx.stroke();} }
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>
</html>
