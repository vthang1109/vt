<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>VTWorld — TicTacToe Multiplayer</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="caro.css"/>
  <style>
    /* ===== TICTACTOE MP SPECIFIC ===== */
    .mp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid rgba(56, 189, 248, 0.15);
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .mp-header .mp-room-code {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 13px;
      color: #7dd3fc;
      background: rgba(0,0,0,0.3);
      padding: 4px 12px;
      border-radius: 8px;
    }
    .mp-header .mp-room-name {
      font-weight: 800;
      font-size: 14px;
      color: #e0f2fe;
    }
    .mp-header .mp-leave-btn {
      background: none;
      border: 1px solid rgba(248,113,113,0.3);
      color: #f87171;
      padding: 6px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: all 0.2s;
    }
    .mp-header .mp-leave-btn:hover {
      background: rgba(248,113,113,0.15);
      border-color: #f87171;
    }

    .mp-status {
      text-align: center;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 13px;
      background: rgba(56, 189, 248, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.1);
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mp-status .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(56,189,248,0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .mp-players-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(56, 189, 248, 0.1);
      margin-bottom: 12px;
      gap: 6px;
    }
    .mp-player-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 12px;
      color: #e0f2fe;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all 0.3s;
      flex: 1;
    }
    .mp-player-tag.active {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.08);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);
    }
    .mp-player-tag .symbol {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 18px;
    }
    .mp-player-tag .symbol.x { color: #38bdf8; }
    .mp-player-tag .symbol.o { color: #f87171; }
    .mp-player-tag .name { flex: 1; font-size: 13px; }
    .mp-player-tag .ready-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(52,211,153,0.2);
      color: #34d399;
    }
    .mp-player-tag .wait-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(251,191,36,0.15);
      color: #fbbf24;
    }
    .mp-vs {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 11px;
      color: #4a7a9b;
      flex-shrink: 0;
    }

    .mp-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .mp-actions button {
      padding: 10px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      transition: all 0.2s;
    }
    .mp-actions button:hover { transform: translateY(-2px); }
    .mp-actions button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-ready-mp {
      background: linear-gradient(135deg, #34d399, #10b981);
      color: #fff;
    }
    .btn-ready-mp.on {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
    }
    .btn-start-mp {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #fff;
    }
    .btn-start-mp:disabled {
      opacity: 0.4;
    }

    .mp-waiting-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .mp-waiting-overlay.hidden { display: none; }
    .mp-waiting-overlay .big-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56,189,248,0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .mp-waiting-overlay .wait-text {
      color: #e0f2fe;
      font-weight: 700;
      font-size: 16px;
      font-family: 'Nunito', sans-serif;
    }

    /* Board 3x3 */
    #ttt-canvas {
      border-radius: 14px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      background: rgba(4, 20, 40, 0.85);
      cursor: pointer;
      touch-action: none;
      max-width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      width: 300px;
      height: 300px;
    }

    .result-box .mp-result-sub {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
    }

    @media (max-width: 420px) {
      .mp-player-tag { font-size: 11px; padding: 3px 6px; }
      .mp-player-tag .symbol { font-size: 15px; }
      .mp-header .mp-room-name { font-size: 12px; }
      #ttt-canvas { width: 280px; height: 280px; }
    }
  </style>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div id="top-nav-root"></div>
  <script src="top-nav.js"></script>

  <div class="caro-wrap" id="mp-app">
    <!-- HEADER -->
    <div class="mp-header">
      <span class="mp-room-name" id="mp-room-name">Phòng TicTacToe</span>
      <span class="mp-room-code" id="mp-room-code">#------</span>
      <button class="mp-leave-btn" onclick="leaveMpRoom()">✕ Rời</button>
    </div>

    <!-- STATUS -->
    <div class="mp-status" id="mp-status">
      <div style="display:flex;justify-content:space-between;align-items:center;width:100%;">
        <span>⏳ Đang kết nối...</span>
        <span style="color:#fbbf24;font-weight:700;">🪙 100</span>
      </div>
    </div>

    <!-- PLAYERS -->
    <div class="mp-players-row" id="mp-players-row">
      <div class="mp-player-tag" id="mp-p1">
        <span class="symbol x">✕</span>
        <span class="name">...</span>
        <span class="ready-badge" id="mp-p1-ready">✅</span>
      </div>
      <div class="mp-vs">VS</div>
      <div class="mp-player-tag" id="mp-p2">
        <span class="symbol o">○</span>
        <span class="name">...</span>
        <span class="wait-badge" id="mp-p2-ready">⏳</span>
      </div>
    </div>

    <!-- BOARD -->
    <div class="caro-board-wrap">
      <canvas id="ttt-canvas"></canvas>
    </div>

    <!-- ACTIONS -->
    <div class="mp-actions">
      <button class="btn-ready-mp" id="btn-ready-mp" onclick="toggleMpReady()">✅ Sẵn sàng</button>
      <button class="btn-start-mp" id="btn-start-mp" onclick="startMpGame()" disabled>🚀 Bắt đầu</button>
    </div>
  </div>

  <!-- RESULT MODAL -->
  <div id="result-modal" class="result-modal hidden">
    <div class="result-box">
      <div class="result-emoji" id="result-emoji">🏆</div>
      <div class="result-title" id="result-title">Bạn thắng!</div>
      <div class="result-pts" id="result-pts"></div>
      <div class="mp-result-sub" id="result-sub"></div>
      <div class="caro-actions" style="justify-content:center">
        <button class="btn-restart" onclick="closeResultAndContinue()">🔄 Tiếp tục</button>
        <button class="btn-home"    onclick="leaveMpRoom()">🚪 Rời phòng</button>
      </div>
    </div>
  </div>

  <!-- WAITING OVERLAY -->
  <div class="mp-waiting-overlay hidden" id="mp-waiting-overlay">
    <div class="big-spinner"></div>
    <div class="wait-text">⏳ Đang chờ người chơi thứ 2...</div>
    <button onclick="leaveMpRoom()" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 20px;border-radius:10px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;font-size:13px;">Rời phòng</button>
  </div>

  <!-- TOAST -->
  <div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none"></div>

  <!-- BACKGROUND PARTICLES -->
  <script>
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let particles = [];
    function resizeBg() { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
    resizeBg(); window.addEventListener('resize', resizeBg);
    for (let i = 0; i < 30; i++) particles.push({ x: Math.random()*bgCanvas.width, y: Math.random()*bgCanvas.height, vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.4, r:Math.random()*1.5+0.5 });
    function drawBg() {
      bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
      particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; if(p.x<0)p.x=bgCanvas.width; if(p.x>bgCanvas.width)p.x=0; if(p.y<0)p.y=bgCanvas.height; if(p.y>bgCanvas.height)p.y=0; bgCtx.beginPath(); bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2); bgCtx.fillStyle='rgba(56,189,248,0.4)'; bgCtx.fill(); });
      requestAnimationFrame(drawBg);
    }
    drawBg();
  </script>

  <script src="bottom-nav.js"></script>
  <script type="module" src="tictactoe-mp.js"></script>
</body>
</html>
