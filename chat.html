<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"/>
  <title>VTWorld – Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="chat.css"/>
  <link rel="stylesheet" href="quests.css"/>
  <script type="module" src="quests.js"></script>
  <script type="module" src="avatar.js"></script>
  <script src="top-nav.js"></script>
  <script src="bottom-nav.js"></script>
</head>
<body data-bottom-nav="chat">
  <div id="errBox" style="position:fixed;top:60px;left:0;right:0;z-index:99999;background:#7f1d1d;color:#fff;font-size:12px;padding:8px;white-space:pre-wrap;display:none"></div>
  <script>
    window.onerror = function(msg, src, line, col) {
      const b = document.getElementById('errBox');
      b.style.display = 'block';
      b.textContent += `[JS] ${msg} (${src}:${line}:${col})\n`;
    };
    window.addEventListener('unhandledrejection', e => {
      const b = document.getElementById('errBox');
      b.style.display = 'block';
      b.textContent += `[Promise] ${e.reason}\n`;
    });
  </script>

  <div id="top-nav-root"></div>
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div id="toastContainer" style="position:fixed;top:66px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none"></div>

  <!-- MODAL XEM PROFILE -->
  <div id="viewProfileModal" class="modal-overlay" onclick="closeViewProfile(event)">
    <div class="modal-box" style="max-width:380px;padding:0;overflow:hidden">
      <div style="background:linear-gradient(135deg,rgba(56,189,248,0.15),rgba(124,58,237,0.2));padding:24px 20px 16px;text-align:center;border-bottom:1px solid rgba(56,189,248,0.1)">
        <div id="vp-character-frame" style="width:80px;height:80px;border-radius:50%;margin:0 auto 12px;border:3px solid rgba(56,189,248,0.4);background:linear-gradient(135deg,#a78bfa,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:#fff;position:relative">
          <span id="vp-avatar">?</span>
          <div style="position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:#0f172a;border:2px solid rgba(56,189,248,0.3);display:flex;align-items:center;justify-content:center;font-size:11px">🎮</div>
        </div>
        <div id="vp-name" style="font-weight:900;font-size:20px;color:#e0f2fe;margin-bottom:4px"></div>
        <div id="vp-email" style="font-size:11px;color:#4a7a9b"></div>
      </div>
      <div style="display:flex;border-bottom:1px solid rgba(56,189,248,0.08)">
        <div style="flex:1;padding:14px;text-align:center;border-right:1px solid rgba(56,189,248,0.08)">
          <div id="vp-points" style="font-family:'Orbitron',monospace;font-size:18px;font-weight:900;color:#fbbf24">—</div>
          <div style="font-size:11px;color:#4a7a9b;font-weight:700;margin-top:3px">⭐ Điểm</div>
        </div>
        <div style="flex:1;padding:14px;text-align:center">
          <div id="vp-friends-count" style="font-family:'Orbitron',monospace;font-size:18px;font-weight:900;color:#34d399">—</div>
          <div style="font-size:11px;color:#4a7a9b;font-weight:700;margin-top:3px">👥 Bạn bè</div>
        </div>
      </div>
      <div style="padding:16px">
        <div id="vp-action-area"></div>
        <button onclick="closeViewProfile()" style="margin-top:10px;width:100%;padding:9px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#7dd3fc;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700">Đóng</button>
      </div>
    </div>
  </div>

  <!-- CHAT PAGE -->
  <div class="chat-page-wrap">

    <!-- SIDEBAR (chỉ hiện khi tab Friends / Explore) -->
    <div class="chat-sidebar" id="chatSidebar">

      <!-- TAB BAR -->
      <div class="cs-tabs">
        <button class="cs-tab" data-tab="world"   onclick="switchChatTab('world')">🌐 Thế giới</button>
        <button class="cs-tab" data-tab="friends" onclick="switchChatTab('friends')">👥 Bạn bè</button>
        <button class="cs-tab" data-tab="explore" onclick="switchChatTab('explore')">🔍 Khám phá</button>
        <div class="cs-tab-indicator" id="csTabIndicator"></div>
      </div>

      <!-- PANEL: BẠN BÈ -->
      <div class="cs-panel active" id="panel-friends">
        <div class="friends-section-label friends-section-label--requests">📨 Lời mời kết bạn</div>
        <div id="friendRequestsList" style="padding:0 8px 4px;overflow-y:auto;scrollbar-width:thin;max-height:200px;flex-shrink:0"></div>
        <div class="friends-section-label friends-section-label--friends">✅ Bạn bè của bạn</div>
        <div id="myFriendsList" style="padding:0 8px;flex:1;overflow-y:auto;scrollbar-width:thin"></div>
        <!-- DM list (ẩn, dùng để JS render, openConvo vẫn hoạt động) -->
        <div id="friendsInChat" style="display:none"></div>
      </div>

      <!-- PANEL: KHÁM PHÁ -->
      <div class="cs-panel" id="panel-explore">
        <div class="chat-search-wrap">
          <input class="chat-search-input" id="exploreSearchInput" placeholder="🔍 Tìm người mới..." oninput="filterExplore()"/>
        </div>
        <div class="explore-hint">Những người chưa kết bạn với bạn</div>
        <div class="chat-contact-list" id="allUsersInChat" style="flex:1;overflow-y:auto"></div>
      </div>

    </div>

    <!-- CỬA SỔ CHAT (luôn hiện; trên mobile thì trượt ra) -->
    <div class="chat-window active" id="chatWindow">
      <div class="chat-window-header">
        <button class="chat-win-back" id="chatWinBack" onclick="backToSidebar()" style="display:none">←</button>
        <div class="chat-win-avatar" id="chatWinAvatar"
             style="background:linear-gradient(135deg,#38bdf8,#0ea5e9);font-size:18px;cursor:pointer"
             onclick="goToProfile()">🌐</div>
        <div class="chat-win-info" style="cursor:pointer;flex:1" onclick="goToProfile()">
          <span class="chat-win-name" id="chatWinName">Chat toàn server</span>
          <span class="chat-win-status">● Online</span>
        </div>
        <button id="sendPointsBtn" onclick="sendPointsToCurrent()" class="send-points-btn" style="display:none">
          💸 Gửi điểm
        </button>
      </div>

      <!-- Tab bar TRONG chat window (hiện khi đang ở world/dm) -->
      <div class="cw-tabs">
        <button class="cs-tab" data-tab="world"   onclick="switchChatTab('world')">🌐 Thế giới</button>
        <button class="cs-tab" data-tab="friends" onclick="switchChatTab('friends')">👥 Bạn bè</button>
        <button class="cs-tab" data-tab="explore" onclick="switchChatTab('explore')">🔍 Khám phá</button>
        <div class="cs-tab-indicator" id="cwTabIndicator"></div>
      </div>

      <div class="chat-window-messages" id="chatWindowMessages">
        <div class="cwm-msg system-msg">👋 Đang tải chat...</div>
      </div>
      <div class="chat-window-input-row">
        <input class="chat-window-input" id="chatWindowInput"
               placeholder="Nhập tin nhắn..."
               onkeydown="if(event.key==='Enter')sendWindowChat()"/>
        <button class="chat-window-send" onclick="sendWindowChat()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <script type="module" src="chat.js"></script>
  <script type="module" src="send-points.js"></script>

  <script>
    // ===== TAB MODE =====
    // world / dm  → ẩn sidebar, hiện chat window full width
    // friends / explore → hiện sidebar bên trái, chat window thu hẹp (hoặc ẩn trên mobile)

    let _activeTab = 'world';

    window.switchChatTab = function(tab) {
      _activeTab = tab;

      // Cập nhật cả 2 tab bar (sidebar + chat window)
      document.querySelectorAll('.cs-tab[data-tab]').forEach(b =>
        b.classList.toggle('active', b.dataset.tab === tab));

      // Slide indicator cho cả 2
      ['csTabIndicator', 'cwTabIndicator'].forEach(id => {
        const ind = document.getElementById(id);
        const parent = ind?.parentElement;
        if (!ind || !parent) return;
        const activeBtn = parent.querySelector('.cs-tab.active');
        if (activeBtn) {
          ind.style.left  = activeBtn.offsetLeft + 'px';
          ind.style.width = activeBtn.offsetWidth + 'px';
        }
      });

      const sidebar   = document.getElementById('chatSidebar');
      const chatWin   = document.getElementById('chatWindow');
      const winBack   = document.getElementById('chatWinBack');

      if (tab === 'world') {
        // Ẩn sidebar, chat window full width
        sidebar.classList.add('cs-hidden');
        chatWin.classList.remove('cs-behind');
        if (winBack) winBack.style.display = 'none';
        // Mở chat server
        const tryOpen = setInterval(() => {
          if (typeof window.openConvo === 'function') {
            clearInterval(tryOpen);
            window.openConvo('server', '🌐 Chat toàn server', null, 'server');
          }
        }, 80);

      } else {
        // Hiện sidebar, show panel tương ứng
        sidebar.classList.remove('cs-hidden');
        document.querySelectorAll('.cs-panel').forEach(p =>
          p.classList.toggle('active', p.id === 'panel-' + tab));

        // Mobile: ẩn chat window khi sidebar hiện
        if (window.innerWidth <= 640) {
          chatWin.classList.add('cs-behind');
          if (winBack) winBack.style.display = 'block';
        } else {
          chatWin.classList.remove('cs-behind');
          if (winBack) winBack.style.display = 'none';
        }

        if (tab === 'friends') {
          setTimeout(() => {
            window._renderFriendRequestsList && window._renderFriendRequestsList();
            window._renderMyFriendsList      && window._renderMyFriendsList();
          }, 50);
        }
      }
    };

    // Mobile: back về sidebar
    window.backToSidebar = function() {
      const chatWin = document.getElementById('chatWindow');
      chatWin.classList.add('cs-behind');
    };

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      // Bắt đầu ở tab world
      setTimeout(() => switchChatTab('world'), 80);
    });

    // Explore filter
    window.filterExplore = function() {
      const q = (document.getElementById('exploreSearchInput')?.value || '').toLowerCase();
      document.querySelectorAll('#allUsersInChat .chat-contact').forEach(el => {
        const name = el.querySelector('.chat-contact-name')?.textContent.toLowerCase() || '';
        el.style.display = name.includes(q) ? '' : 'none';
      });
    };

    // Profile navigation
    window.goToProfile = function() {
      const uid = window.currentConvoUid;
      if (!uid) return;
      location.href = 'profile.html?uid=' + uid;
    };

    // Patch openConvo → nút Gửi điểm
    (function () {
      function refreshBtn() {
        const btn = document.getElementById('sendPointsBtn');
        if (!btn) return;
        const uid = window.currentConvoUid;
        const me  = window._currentUser;
        btn.style.display = (uid && (!me || uid !== me.uid)) ? 'inline-flex' : 'none';
      }
      const tryPatch = setInterval(() => {
        if (typeof window.openConvo === 'function' && !window.openConvo.__patched) {
          const orig = window.openConvo;
          window.openConvo = function(uid, name, avatarChar, type) {
            const r = orig.apply(this, arguments);
            window.currentConvoUid  = (type === 'server') ? null : uid;
            window.currentConvoName = name;
            refreshBtn();
            // Khi mở DM → về tab world nhưng không mở lại server
            return r;
          };
          window.openConvo.__patched = true;
          clearInterval(tryPatch);
        }
      }, 150);
    })();

    window.sendPointsToCurrent = function() {
      const uid  = window.currentConvoUid;
      const name = window.currentConvoName || 'Người nhận';
      if (!uid) { window.showToast && window.showToast('⚠️ Chỉ gửi điểm khi chat riêng!', 'warn'); return; }
      window.openSendPointsModal && window.openSendPointsModal(uid, name);
    };
  </script>

</body>
</html>
