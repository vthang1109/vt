<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"/>
  <title>VTWorld – Chat</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="chat.css"/>
  <link rel="stylesheet" href="quests.css"/>
  <script type="module" src="quests.js"></script>
  <script type="module" src="avatar.js"></script>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<!-- Toast -->
<div id="toastContainer"></div>


<!-- Layout chính -->
<div class="chat-layout" id="chatLayout">

  <!-- SIDEBAR -->
  <div class="chat-sidebar" id="chatSidebar">
    <!-- Tab bar -->
    <div class="sidebar-tabs">
      <button class="stab active" data-tab="chat" onclick="sidebarTab('chat')">💬 Chat</button>
      <button class="stab" data-tab="friends" onclick="sidebarTab('friends')">👥 Bạn bè</button>
      <button class="stab" data-tab="explore" onclick="sidebarTab('explore')">🔍 Khám phá</button>
    </div>

    <!-- Panel: Chat -->
    <div class="sidebar-panel active" id="panel-chat">
      <div class="search-wrap">
        <input class="search-input" id="chatSearchInput" placeholder="🔍 Tìm..." oninput="filterContacts()"/>
      </div>
      <div class="contact-list" id="chatContactList">
        <div class="chat-contact" id="contact-__server__" onclick="openConvo('server','🌐 Chat toàn server',null,'server')">
          <div class="contact-av" style="background:linear-gradient(135deg,#0288D1,#0ea5e9)">🌐</div>
          <div class="contact-info">
            <span class="contact-name">Chat toàn server</span>
            <span class="contact-preview">Mọi người đều thấy</span>
          </div>
        </div>
        <div id="friendsInChat"></div>
      </div>
    </div>

    <!-- Panel: Bạn bè -->
    <div class="sidebar-panel" id="panel-friends">
      <div class="section-label warn">📨 Lời mời kết bạn</div>
      <div id="friendRequestsList" class="friend-list-scroll"></div>
      <div class="section-label ok">✅ Bạn bè của bạn</div>
      <div id="myFriendsList" class="friend-list-scroll flex1"></div>
    </div>

    <!-- Panel: Khám phá -->
    <div class="sidebar-panel" id="panel-explore">
      <div class="search-wrap">
        <input class="search-input" id="exploreInput" placeholder="🔍 Tìm người mới..." oninput="filterExplore()"/>
      </div>
      <div class="contact-list" id="allUsersInChat"></div>
    </div>
  </div>

  <!-- CỬA SỔ CHAT -->
  <div class="chat-window" id="chatWindow">
    <!-- Header -->
    <div class="cw-header">
      <button class="cw-back" id="cwBack" onclick="backToSidebar()">←</button>
      <div class="cw-av" id="chatWinAvatar" onclick="viewCurrentProfile()" title="Xem hồ sơ" style="cursor:pointer">🌐</div>
      <div class="cw-info" onclick="viewCurrentProfile()" title="Xem hồ sơ" style="cursor:pointer">
        <span class="cw-name" id="chatWinName">Chat toàn server</span>
        <span class="cw-status">● Online</span>
      </div>
      <!-- Thêm nút xoá tất cả tin nhắn -->
      <button id="clearMessagesBtn" class="cw-clear-btn" style="display:none; background:none; border:none; color:#f87171; cursor:pointer; font-size:18px; padding:0 6px;" title="Xoá tất cả tin nhắn">🗑</button>
      <button id="sendPointsBtn" class="cw-pts-btn" onclick="sendPointsToCurrent()" style="display:none">💸 Gửi điểm</button>
    </div>

    <!-- Messages -->
    <div class="cw-messages" id="chatWindowMessages">
      <div class="msg-system">👋 Chọn cuộc trò chuyện để bắt đầu</div>
    </div>

    <!-- Input -->
    <div class="cw-input-row">
      <input class="cw-input" id="chatWindowInput" placeholder="Nhắn tin..." onkeydown="if(event.key==='Enter')sendWindowChat()"/>
      <button class="cw-send" onclick="sendWindowChat()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

</div><!-- end chat-layout -->
<!-- Scripts -->
<script type="module" src="chat.js"></script>
<script type="module" src="send-points.js"></script>
<script>
  // Sidebar tab switch
  window.sidebarTab = function(tab) {
    document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.sidebar-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
    if (tab === 'friends') {
      window._renderFriendRequestsList && window._renderFriendRequestsList();
      window._renderMyFriendsList && window._renderMyFriendsList();
    }
  };

  // Mobile: back về sidebar
  window.backToSidebar = function() {
    document.getElementById('chatSidebar').classList.remove('sb-hidden');
    document.getElementById('chatWindow').classList.remove('cw-active');
    document.getElementById('cwBack').style.display = 'none';
  };

  // Explore filter
  window.filterExplore = function() {
    const q = (document.getElementById('exploreInput')?.value || '').toLowerCase();
    document.querySelectorAll('#allUsersInChat .chat-contact').forEach(el => {
      const name = el.querySelector('.contact-name')?.textContent.toLowerCase() || '';
      el.style.display = name.includes(q) ? '' : 'none';
    });
  };

  // Filter contacts
  window.filterContacts = function() {
    const q = document.getElementById('chatSearchInput').value.toLowerCase();
    document.querySelectorAll('#chatContactList .chat-contact').forEach(c => {
      const nm = c.querySelector('.contact-name');
      c.style.display = nm && nm.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  };

  // Profile nav
  window.goToProfile = function() {
    if (window.currentConvoUid) location.href = 'profile.html?uid=' + window.currentConvoUid;
  };

  // Gửi điểm
  window.sendPointsToCurrent = function() {
    const uid  = window.currentConvoUid;
    const name = window.currentConvoName || 'Người nhận';
    if (!uid) { window.showToast && window.showToast('⚠️ Chỉ gửi điểm khi chat riêng!', 'warn'); return; }
    window.openSendPointsModal && window.openSendPointsModal(uid, name);
  };

  // Patch openConvo → mobile slide + nút gửi điểm
  (function() {
    const tryPatch = setInterval(() => {
      if (typeof window.openConvo === 'function' && !window.openConvo.__patched) {
        const orig = window.openConvo;
        window.openConvo = function(uid, name, av, type) {
          const r = orig.apply(this, arguments);
          window.currentConvoUid  = type === 'server' ? null : uid;
          window.currentConvoName = name;
          // Mobile: hiện chat window
          if (window.innerWidth <= 640) {
            document.getElementById('chatSidebar').classList.add('sb-hidden');
            document.getElementById('chatWindow').classList.add('cw-active');
            document.getElementById('cwBack').style.display = 'flex';
          }
          // Nút gửi điểm và xoá tin nhắn
          const btn = document.getElementById('sendPointsBtn');
          const clearBtn = document.getElementById('clearMessagesBtn');
          if (btn) btn.style.display = window.currentConvoUid ? 'inline-flex' : 'none';
          if (clearBtn) clearBtn.style.display = window.currentConvoUid ? 'inline-block' : 'none';
          return r;
        };
        window.openConvo.__patched = true;
        clearInterval(tryPatch);
      }
    }, 100);
  })();
</script>

<script src="top-nav.js"></script>
<script src="bottom-nav.js"></script>
<script>
  TopNav.init();
  BottomNav.init({ active: 'chat' });
</script>
</body>
</html>
