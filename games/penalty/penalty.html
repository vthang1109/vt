<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>VTWorld — Penalty Shootout</title>
  <link rel="stylesheet" href="../../style.css"/>
  <link rel="stylesheet" href="../../status-bar.css"/>
  <link rel="stylesheet" href="penalty.css"/>
  <link rel="stylesheet" href="../../quests.css"/>
  <script src="../../top-nav.js"></script>
  <script src="../../bottom-nav.js"></script>
  <script src="../../fullscreen.js"></script>
  <script type="module" src="../../quests.js"></script>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div id="top-nav-root"></div>

  <div class="pt-wrap">

    <!-- ===== MENU / LOBBY SCREEN ===== -->
    <div id="pt-menu" class="pt-screen active">
      <div class="pt-menu-glow"></div>
      <div class="pt-logo"><img src="../../assets/icons/wc.png" alt="" style="width:64px;height:auto;vertical-align:middle"/></div>
      <h1 class="pt-title">Football Cup</h1>
      <!-- Continue saved progress: League + Cup riêng, cùng hàng -->
      <div class="pt-continue-row" id="pt-continue-row">
        <div class="pt-continue-card" id="pt-continue-card-league" style="display:none">
          <div class="pt-continue-info">
            <span class="pt-continue-label">📊 League ...</span>
            <span class="pt-continue-desc" id="pt-continue-desc-league"></span>
          </div>
          <div class="pt-continue-btns">
            <button class="pt-continue-btn" id="pt-continue-btn-league">▶ Tiếp tục</button>
            <button class="pt-discard-btn" id="pt-discard-btn-league" title="Xóa tiến trình">✕</button>
          </div>
        </div>
        <div class="pt-continue-card" id="pt-continue-card-cup" style="display:none">
          <div class="pt-continue-info">
            <span class="pt-continue-label">🏆 Cúp ...</span>
            <span class="pt-continue-desc" id="pt-continue-desc-cup"></span>
          </div>
          <div class="pt-continue-btns">
            <button class="pt-continue-btn" id="pt-continue-btn-cup">▶️ Tiếp tục</button>
            <button class="pt-discard-btn" id="pt-discard-btn-cup" title="Xóa tiến trình">✕</button>
          </div>
        </div>
      </div>

      <!-- Mode selection (3 nút riêng, không chung khung) -->
      <div class="pt-mode-row" id="pt-mode-row"></div>

      <!-- Tournament selection (chỉ cho Cup) -->
      <div class="pt-panel" id="pt-tournament-panel" style="display:none">
        <div class="pt-panel-label">🏆 Chọn giải đấu</div>
        <div class="pt-tournament-row" id="pt-tournament-row"></div>
      </div>

      <!-- League selection (chỉ cho League) -->
      <div class="pt-panel" id="pt-league-panel" style="display:none">
        <div class="pt-panel-label">📊 Chọn giải League</div>
        <div class="pt-tournament-row" id="pt-league-row"></div>
      </div>

      <!-- Tùy chỉnh: đội tuyển + 2 người chơi -->
      <div class="pt-panel">
        <div class="pt-panel-label">⚙️ Tùy chỉnh</div>

        <!-- Country selection (chỉ hiển thị quốc gia hiện tại, bấm vào mở popup) -->
        <div class="pt-country-picker" id="pt-country-picker" onclick="penaltyGame.openCountryPopup()">
          <span class="pt-country-flag" id="pt-country-flag">
            <img src="https://flagcdn.com/vn.svg" class="pt-flag-svg" style="width:32px;height:auto;vertical-align:middle"/>
          </span>
          <span class="pt-country-name" id="pt-country-name">Việt Nam</span>
          <svg class="pt-country-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>

      <button class="pt-play-btn" id="pt-play-btn">
        <svg class="pt-play-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span>Đá Penalty!</span>
      </button>
    </div>

    <!-- ===== LEAGUE / BRACKET BETWEEN MATCHES ===== -->
    <div id="pt-league-view" class="pt-screen" style="display:none">
      <div class="pt-overview-header" id="pt-overview-header"></div>
      <div id="pt-league-table"></div>
      <div class="pt-actions">
        <button class="pt-btn-start" id="pt-league-next">⚽ Đá trận tiếp</button>
        <button class="pt-btn-quit" onclick="penaltyGame.quitToMenu()">🚪 Rời</button>
      </div>
    </div>

    <!-- ===== CUP GROUP VIEW ===== -->
    <div id="pt-cup-group-view" class="pt-screen" style="display:none">
      <div id="pt-group-view-content"></div>
      <div class="pt-actions">
        <button class="pt-btn-start" id="pt-group-next">⚽ Đá trận tiếp</button>
        <button class="pt-btn-quit" onclick="penaltyGame.quitToMenu()">🚪 Rời</button>
      </div>
    </div>

    <!-- ===== CUP TRANSITION (group→knockout) ===== -->
    <div id="pt-cup-transition" class="pt-screen" style="display:none">
      <div id="pt-transition-content"></div>
      <div class="pt-actions">
        <button class="pt-btn-start" id="pt-transition-next">⚡ Vào vòng knock-out</button>
        <button class="pt-btn-quit" onclick="penaltyGame.quitToMenu()">🚪 Rời</button>
      </div>
    </div>

    <!-- ===== CUP BRACKET ===== -->
    <div id="pt-cup-knockout-view" class="pt-screen" style="display:none">
      <div class="pt-overview-header" id="pt-knockout-header"></div>
      <div id="pt-knockout-bracket"></div>
      <div class="pt-actions">
        <button class="pt-btn-start" id="pt-knockout-next">⚽ Đá trận tiếp</button>
        <button class="pt-btn-quit" onclick="penaltyGame.quitToMenu()">🚪 Rời</button>
      </div>
    </div>

    <!-- ===== GAME SCREEN ===== -->
    <div id="pt-game" class="pt-screen" style="display:none">

      <!-- Match info bar -->
      <div class="pt-match-info" id="pt-match-info" style="display:none">
        <span id="pt-match-label"></span>
      </div>

      <!-- NEW: Status bar with 5-shot circles + score -->
      <div class="pt-statusbar bc-status" id="pt-statusbar">
        <!-- Player side -->
        <div class="pt-sb-team" id="pt-sb-player">
          <div class="pt-sb-top">
            <span class="pt-sb-flag" id="pt-sb-pflag"></span>
            <span class="pt-sb-name" id="pt-sb-pname">Bạn</span>
          </div>
          <div class="pt-sb-dots" id="pt-sb-pdots"></div>
        </div>
        <!-- Score in middle -->
        <div class="pt-sb-score">
          <span class="pt-sb-num" id="pt-sb-you">0</span>
          <span class="pt-sb-colon">:</span>
          <span class="pt-sb-num" id="pt-sb-ai">0</span>
        </div>
        <!-- AI side -->
        <div class="pt-sb-team pt-sb-right" id="pt-sb-ai">
          <div class="pt-sb-top">
            <span class="pt-sb-flag" id="pt-sb-aflag"></span>
            <span class="pt-sb-name" id="pt-sb-aname">AI</span>
          </div>
          <div class="pt-sb-dots" id="pt-sb-adots"></div>
        </div>
      </div>

      <!-- Pitch / Goal with football scene -->
      <div class="pt-pitch" id="pt-pitch">

        <!-- Khán đài (crowd) -->
        <div class="pt-stands" id="pt-stands">
          <div class="pt-stands-crowd"></div>
          <div class="pt-stands-shade"></div>
        </div>
        <!-- Biển quảng cáo -->
        <div class="pt-billboard-strip" id="pt-billboard-strip">
          <div class="pt-billboard pt-bb-1">VTWORLD</div>
          <div class="pt-billboard pt-bb-2">PENALTY CUP</div>
          <div class="pt-billboard pt-bb-3">⚽ LEAGUE 〄</div>
        </div>

        <!-- Turn tag / Kết quả — chữ to giữa sân -->
        <div class="pt-turn-box shoot-turn" id="pt-turn-box">SÚT!!!</div>

        <!-- Grass markings -->
        <div class="pt-pitch-markings">
          <div class="pt-touchline-top"></div>
          <div class="pt-box-lines"></div>
          <div class="pt-box-arc"></div>
          <div class="pt-arc-left"></div>
          <div class="pt-arc-right"></div>
          <div class="pt-center-circle"></div>
          <div class="pt-penalty-spot"></div>
        </div>

        <div class="pt-goal-area">
          <div class="pt-goal-frame" id="pt-goal-frame">
            <div class="pt-goal-net" id="pt-goal-net"></div>
            <div class="pt-goal-grid" id="pt-goal-grid">
              <div class="pt-zone" data-zone="top-left"></div>
              <div class="pt-zone" data-zone="top-center"></div>
              <div class="pt-zone" data-zone="top-right"></div>
              <div class="pt-zone" data-zone="mid-left"></div>
              <div class="pt-zone" data-zone="mid-center"></div>
              <div class="pt-zone" data-zone="mid-right"></div>
              <div class="pt-zone" data-zone="bot-left"></div>
              <div class="pt-zone" data-zone="bot-center"></div>
              <div class="pt-zone" data-zone="bot-right"></div>
            </div>
            <div class="pt-keeper" id="pt-keeper">
              <div class="pt-keeper-hand pt-keeper-hand-left">🧤</div>
              <div class="pt-keeper-hand pt-keeper-hand-right">🧤</div>
            </div>
            <div class="pt-goal-posts" id="pt-goal-posts">
              <div class="pt-post-left"></div>
              <div class="pt-post-right"></div>
              <div class="pt-crossbar"></div>
            </div>
          </div>
        </div>

        <!-- Football on the penalty spot -->
        <div class="pt-ball" id="pt-ball">⚽</div>

      </div>
      <!-- END pt-pitch -->

      <!-- Actions -->
      <div class="pt-actions" id="pt-actions" style="display:none">
        <button class="pt-btn-start" id="pt-match-done-btn" style="display:none">✅ Kết thúc trận</button>
        <button class="pt-btn-quit" onclick="penaltyGame.quitToMenu()">🚪 Rời</button>
      </div>

      <!-- Result — chỉ còn 2 nút hành động, kết quả đã hiện ở banner giữa sân -->
      <div class="pt-result-overlay" id="pt-result-overlay" style="display:none">
        <div class="pt-actions" id="pt-result-actions">
          <button class="pt-btn-start" onclick="penaltyGame.onMatchDone()">Hoàn thành</button>
          <button class="pt-btn-quit" onclick="penaltyGame.quitToMenu()">Về menu</button>
        </div>
      </div>

      <!-- Debug buttons -->
      <div class="pt-debug-actions" id="pt-debug-actions" style="display:none">
        <button class="pt-btn-debug-win" onclick="penaltyGame.debugWin()">🏆 Thắng luôn</button>
        <button class="pt-btn-debug-lose" onclick="penaltyGame.debugLose()">💀 Thua luôn</button>
      </div>
    </div>

  </div>

  <!-- Country popup modal -->
  <div class="pt-modal-overlay" id="pt-country-modal">
    <div class="pt-modal-box">
      <div class="pt-modal-header">
        <h3>Chọn quốc gia</h3>
        <button class="pt-modal-close" id="pt-country-modal-close">✕</button>
      </div>
      <input type="text" class="pt-country-search" id="pt-country-search" placeholder="🔍 Tìm tên quốc gia..." autocomplete="off"/>
      <div class="pt-flag-grid" id="pt-flag-grid"></div>
    </div>
  </div>

  <div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999"></div>

  <script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
    resize(); addEventListener('resize', resize);
    for(let i=0;i<25;i++) particles.push({
      x:Math.random()*canvas.width, y:Math.random()*canvas.height,
      vx:(Math.random()-.5)*.4, vy:(Math.random()-.5)*.4,
      r:Math.random()*1.5+.5
    });
    (function loop(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p=>{
        p.x+=p.vx; p.y+=p.vy;
        if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;
        if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle='rgba(74,222,128,0.4)'; ctx.fill();
      });
      requestAnimationFrame(loop);
    })();

    window.showToast = function(msg, type='info'){
      const colors = {info:'#38bdf8',success:'#4ade80',warn:'#fbbf24',error:'#f87171'};
      const t = document.createElement('div');
      t.style.cssText = `pointer-events:all;padding:11px 16px;border-radius:12px;background:rgba(4,20,40,0.97);border:1px solid ${colors[type]};color:#e0f2fe;font-size:13px;font-family:"Science Gothic",sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.5);max-width:280px;margin-bottom:8px`;
      t.innerHTML = msg;
      document.getElementById('toastContainer').appendChild(t);
      setTimeout(()=>t.remove(), 3000);
    };
  </script>
  <script type="module" src="penalty.js"></script>
</body>
</html>
