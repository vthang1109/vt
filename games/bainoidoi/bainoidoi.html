<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>VTWorld — Bài Nói Dối</title>
  <link rel="stylesheet" href="../../style.css"/>
  <link rel="stylesheet" href="../../cards.css"/>
  <link rel="stylesheet" href="../../status-bar.css"/>
  <link rel="stylesheet" href="bainoidoi.css"/>
  <link rel="stylesheet" href="../../quests.css"/>
  <script src="../../top-nav.js"></script>
  <script src="../../bottom-nav.js"></script>
  <script src="../../fullscreen.js"></script>
  <script type="module" src="../../quests.js"></script>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div><div class="orb orb2"></div>
  <div id="top-nav-root"></div>

  <div class="tl-wrap">

    <!-- ===== MENU SCREEN ===== -->
    <div id="bnd-menu" class="tl-screen active">
      <div class="tl-menu-glow"></div>
      <div class="tl-floating-card tl-fc-1">🃏</div>
      <div class="tl-floating-card tl-fc-2">🂠</div>
      <div class="tl-floating-card tl-fc-3">🎭</div>

      <div class="tl-logo"><img src="../../assets/icons/bainoidoi.png" alt="Bài Nói Dối" class="tl-logo-img"/></div>
      <h1 class="tl-title" style="color:#f87171">Bài Nói Dối</h1>
      <p class="tl-sub">Kẻ yếu sẽ chọn thật thà, Kẻ khôn ngoan chọn cáo già thắng ngay!</p>

      <div class="tl-menu-card">
        <div class="tl-menu-bet-row">
          <input type="number" id="bnd-bet-input" value="100" min="50" step="50"/>
          <button class="tl-play-btn" id="bnd-play-btn">
            <span class="tl-play-icon">▶</span>
            Chơi Ngay
          </button>
        </div>
      </div>
    </div>

    <!-- STATUS BAR -->
    <div class="bc-status" id="bc-status" style="display:none">
      <span class="stat-bet" id="bc-bet-stat">0</span>
      <div class="stat-score-wrap">
        <span class="stat-score" id="bc-status-msg">--</span>
        <span class="stat-score-sub" id="bc-score-sub"></span>
      </div>
      <span class="stat-profit zero" id="bc-profit-stat">+0</span>
    </div>

    <!-- GAME SCREEN -->
    <div id="bnd-game-screen" class="tl-screen" style="display:none">

      <!-- BET ROW -->
      <div class="xd-bet-row" id="bc-bet-row">
        <input id="bc-bet-input" type="number" min="50" step="50" value="100"/>
        <button id="btn-place-bet">✅ Đặt cược</button>
      </div>

      <!-- BOMB OVERLAY (nổ) -->
      <div class="bnd-bomb-overlay" id="bnd-bomb-overlay" style="display:none"></div>

      <!-- POPUP CẮT DÂY -->
      <div class="bnd-wire-popup" id="bnd-wire-popup" style="display:none"></div>

      <!-- SPINNER CHỌN NGƯỜI ĐI ĐẦU -->
      <div class="bnd-spinner-overlay" id="bnd-spinner-overlay" style="display:none">
        <div class="bnd-spinner-card">
          <div class="bnd-spinner-wheel-wrap">
            <div class="bnd-spinner-wheel" id="bnd-spinner-wheel">
              <div class="bnd-spinner-center"><span>🎲</span></div>
            </div>
            <div class="bnd-spinner-pointer">▼</div>
          </div>
        </div>
      </div>

      <!-- ===== TABLE AREA ===== -->
      <div class="table-area">
        <div class="seat seat-top" id="seat-2">
          <div class="seat-ring">
            <svg class="seat-timer" viewBox="0 0 40 40"><circle class="seat-timer-bg" cx="20" cy="20" r="18"/><circle class="seat-timer-fg" cx="20" cy="20" r="18"/></svg>
            <div class="seat-badge">
              <div class="seat-name">Hoa</div>
              <div class="seat-count">13 lá</div>
            </div>
          </div>
          <div class="seat-status" id="bnd-status-2"></div>
          <div class="seat-wires" id="wires-2"></div>
        </div>
        <div class="seat seat-left" id="seat-1">
          <div class="seat-ring">
            <svg class="seat-timer" viewBox="0 0 40 40"><circle class="seat-timer-bg" cx="20" cy="20" r="18"/><circle class="seat-timer-fg" cx="20" cy="20" r="18"/></svg>
            <div class="seat-badge">
              <div class="seat-name">Minh</div>
              <div class="seat-count">13 lá</div>
            </div>
          </div>
          <div class="seat-status" id="bnd-status-1"></div>
          <div class="seat-wires" id="wires-1"></div>
        </div>
        <div class="seat seat-right" id="seat-3">
          <div class="seat-ring">
            <svg class="seat-timer" viewBox="0 0 40 40"><circle class="seat-timer-bg" cx="20" cy="20" r="18"/><circle class="seat-timer-fg" cx="20" cy="20" r="18"/></svg>
            <div class="seat-badge">
              <div class="seat-name">Tuấn</div>
              <div class="seat-count">13 lá</div>
            </div>
          </div>
          <div class="seat-status" id="bnd-status-3"></div>
          <div class="seat-wires" id="wires-3"></div>
        </div>

        <div class="center-board">
          <div id="table-combo" class="table-combo">
            <div class="table-empty">— Đang chia bài —</div>
          </div>
          <div id="result-box" class="result-box" style="display:none"></div>
          <div class="tl-round-info" id="bnd-round-info">Vòng 1</div>
        </div>
      </div>

      <!-- ===== PLAYER AREA ===== -->
      <div class="my-area">
        <div class="seat seat-me" id="seat-0">
          <div class="seat-ring">
            <svg class="seat-timer" viewBox="0 0 40 40"><circle class="seat-timer-bg" cx="20" cy="20" r="18"/><circle class="seat-timer-fg" cx="20" cy="20" r="18"/></svg>
            <div class="seat-badge">
              <div class="seat-name">Bạn</div>
              <div class="seat-count">13 lá</div>
            </div>
          </div>
          <div class="seat-status" id="bnd-status-0"></div>
        </div>
        <div class="seat-wires player-seat-wires" id="wires-0"></div>
        <div class="hand-wrap">
          <div id="my-hand" class="my-hand"></div>
        </div>
        <!-- Declare suit picker -->
        <div id="bnd-declare" class="bnd-declare" style="display:none">
          <span class="bnd-declare-label">Chọn chất bạn NÓI DỐI:</span>
          <div class="bnd-declare-options" id="bnd-declare-options"></div>
        </div>
      </div>

      <!-- Actions outside my-area -->
      <div class="xd-actions" id="bnd-actions" style="display:none">
        <button id="bnd-play-cards-btn" class="btn-deal">Đánh</button>
        <button id="bnd-call-btn" class="btn-call-bluff">Tố cáo!</button>
        <button id="bnd-new-round-btn" class="btn-new-round">🔄 Ván mới</button>
      </div>

    </div>
  </div>

  <div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999"></div>

  <script>
    const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d'); let particles = [];
    function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
    for(let i=0;i<25;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
    (function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(239,68,68,0.4)';ctx.fill()});requestAnimationFrame(loop)})();
    window.showToast=function(msg,type='info'){const c={info:'#38bdf8',success:'#34d399',warn:'#fbbf24',error:'#f87171'};const t=document.createElement('div');t.style.cssText=`pointer-events:all;padding:11px 16px;border-radius:12px;background:rgba(4,20,40,0.97);border:1px solid ${c[type]};color:#e0f2fe;font-size:13px;font-weight:400;font-family:\\"Science Gothic\\",sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.5);max-width:280px;margin-bottom:8px`;t.innerHTML=msg;toastContainer.appendChild(t);setTimeout(()=>t.remove(),3000)};
  </script>
  <script type="module" src="bainoidoi.js"></script>
</body>
</html>
