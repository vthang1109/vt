<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VTWorld — Pick Số Online</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../style.css"/>
  <link rel="stylesheet" href="../../quests.css"/>
  <script type="module" src="../../quests.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:linear-gradient(135deg,#020c1b 0%,#041428 60%,#071e34 100%);font-family:'Nunito',sans-serif;color:#e0f2fe;overflow-x:hidden}
    canvas#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
    .orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.18;z-index:0;pointer-events:none}
    .orb1{width:420px;height:420px;background:radial-gradient(circle,#38bdf8,transparent);top:-80px;left:-80px}
    .orb2{width:340px;height:340px;background:radial-gradient(circle,#818cf8,transparent);bottom:-60px;right:-60px}
    .ps-wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 12px 60px}

    /* HEAD */
    .ps-head{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 10px}
    .logo{font-family:'Orbitron',sans-serif;font-size:20px;cursor:pointer}
    .logo-vt{color:#38bdf8}.logo-world{color:#fff}
    .ps-room{font-family:'Orbitron',sans-serif;font-size:13px;color:#64748b;letter-spacing:2px}
    .nav-right-menu{position:relative}
    .nav-hamburger{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#e0f2fe;border-radius:10px;padding:7px 13px;font-size:18px;cursor:pointer}
    .nav-dropdown{display:none;position:absolute;right:0;top:calc(100% + 6px);background:rgba(4,20,40,.97);border:1px solid #1e3a5f;border-radius:14px;min-width:170px;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.5)}
    .nav-dropdown.open{display:block}
    .nav-dropdown-item{display:flex;align-items:center;gap:9px;padding:11px 16px;color:#e0f2fe;text-decoration:none;font-size:14px;font-weight:700;border-radius:10px;transition:background .15s}
    .nav-dropdown-item:hover{background:rgba(56,189,248,.1)}
    .dd-icon{font-size:16px}

    /* BANK */
    .ps-bank{display:flex;justify-content:space-between;align-items:center;background:rgba(255,193,7,.07);border:1px solid rgba(255,193,7,.25);border-radius:14px;padding:10px 16px;margin-bottom:10px}
    .ps-bank-l{font-size:14px;font-weight:700;color:#fbbf24}
    .ps-bank-r{font-size:16px;font-weight:800;color:#fbbf24}

    /* PHASE */
    .ps-phase{text-align:center;font-size:15px;font-weight:800;color:#38bdf8;background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.18);border-radius:12px;padding:10px 16px;margin-bottom:10px}

    /* BET */
    .ps-bet-row{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
    .ps-bet-row label{font-size:13px;font-weight:700;color:#94a3b8}
    .ps-bet-row input{width:110px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:8px 10px;font-size:14px;font-family:'Nunito',sans-serif;outline:none}
    .ps-bet-row button{background:linear-gradient(135deg,#34d399,#059669);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:14px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif}

    /* SCOREBOARD */
    .ps-scores{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;justify-content:center}
    .ps-score-card{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 14px;min-width:110px;text-align:center;transition:border-color .2s}
    .ps-score-card.my-turn{border-color:#38bdf8;box-shadow:0 0 16px rgba(56,189,248,.3)}
    .ps-score-card.winner{border-color:#fbbf24;box-shadow:0 0 18px rgba(251,191,36,.35)}
    .ps-score-card .sc-name{font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px}
    .ps-score-card .sc-count{font-size:24px;font-weight:900;color:#38bdf8}
    .ps-score-card .sc-bet{font-size:11px;color:#64748b;margin-top:2px}
    .ps-score-card .sc-tag{font-size:11px;font-weight:700;margin-top:3px}

    /* GRID */
    .ps-grid-wrap{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px;margin-bottom:12px}
    .ps-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
    .ps-cell{aspect-ratio:1;border-radius:8px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;color:#94a3b8;user-select:none}
    .ps-cell:hover:not(.taken){border-color:#38bdf8;background:rgba(56,189,248,.15);color:#38bdf8;transform:scale(1.08)}
    .ps-cell.taken{cursor:default;border-color:transparent;opacity:.92}
    .ps-cell.mine{background:rgba(56,189,248,.25);border-color:#38bdf8;color:#e0f2fe}
    .ps-cell.disabled{cursor:not-allowed;opacity:.5}

    /* ACTIONS */
    .ps-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
    .ps-actions button{border:none;border-radius:12px;padding:11px 24px;font-size:14px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;transition:opacity .15s}
    .ps-actions button:hover{opacity:.85}
    .btn-ps-next{background:linear-gradient(135deg,#38bdf8,#0284c7);color:#fff}
    .btn-ps-start{background:linear-gradient(135deg,#34d399,#059669);color:#fff}

    /* RESULT */
    .ps-result{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-radius:14px;padding:14px 16px;margin-bottom:12px;text-align:center}
    .ps-result h3{font-size:17px;font-weight:900;color:#fbbf24;margin-bottom:8px}
    .ps-result-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05)}
    .ps-result-row:last-child{border:none}
    .res-win{color:#34d399;font-weight:800}
    .res-lose{color:#f87171;font-weight:800}
    .res-draw{color:#94a3b8;font-weight:800}

    /* TURN INDICATOR */
    .ps-turn-bar{text-align:center;font-size:13px;color:#64748b;margin-bottom:8px}
    .ps-turn-bar span{color:#38bdf8;font-weight:800}

    /* LEGEND */
    .ps-legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:10px;font-size:12px;color:#64748b}
    .ps-legend-item{display:flex;align-items:center;gap:5px}
    .ps-legend-dot{width:14px;height:14px;border-radius:4px;flex-shrink:0}

    @media(max-width:400px){.ps-cell{font-size:10px}.ps-grid{gap:3px}}
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="ps-wrap">
    <!-- HEAD -->
    <div class="ps-head">
      <div class="logo" onclick="location.href='index.html'">
        <span class="logo-vt">VT</span><span class="logo-world">World</span>
      </div>
      <span class="ps-room" id="ps-room">#------</span>
      <div class="nav-right-menu">
        <button class="nav-hamburger" onclick="toggleMenu()">☰</button>
        <div class="nav-dropdown" id="navDropdown">
          <a class="nav-dropdown-item" href="#" onclick="quitGame();return false;"><span class="dd-icon">🚪</span> Rời phòng</a>
          <a class="nav-dropdown-item" href="index.html"><span class="dd-icon">🏠</span> Trang chủ</a>
        </div>
      </div>
    </div>

    <!-- BANK -->
    <div class="ps-bank">
      <span class="ps-bank-l">💰 Số dư của bạn</span>
      <span class="ps-bank-r" id="ps-balance">0 đ</span>
    </div>

    <!-- PHASE -->
    <div class="ps-phase" id="ps-phase">Đang tải...</div>

    <!-- BET ROW -->
    <div class="ps-bet-row" id="ps-bet-row" style="display:none">
      <label>Đặt cược:</label>
      <input id="ps-bet-input" type="number" min="50" step="50" value="100"/>
      <button onclick="placeBet()">✅ Đặt cược</button>
    </div>

    <!-- SCOREBOARD -->
    <div class="ps-scores" id="ps-scores"></div>

    <!-- TURN BAR -->
    <div class="ps-turn-bar" id="ps-turn-bar" style="display:none"></div>

    <!-- LEGEND -->
    <div class="ps-legend" id="ps-legend" style="display:none"></div>

    <!-- GRID -->
    <div class="ps-grid-wrap" id="ps-grid-wrap" style="display:none">
      <div class="ps-grid" id="ps-grid"></div>
    </div>

    <!-- RESULT -->
    <div class="ps-result" id="ps-result" style="display:none"></div>

    <!-- ACTIONS -->
    <div class="ps-actions" id="ps-actions"></div>
  </div>

  <div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none"></div>

  <script>
    // Canvas particles
    const canvas=document.getElementById('bg-canvas'),ctx=canvas.getContext('2d');let pts=[];
    function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
    for(let i=0;i<25;i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
    (function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(52,211,153,0.4)';ctx.fill()});requestAnimationFrame(loop)})();

    window.showToast=function(msg,type='info'){
      const c={info:'#38bdf8',success:'#34d399',warn:'#fbbf24',error:'#f87171'};
      const t=document.createElement('div');
      t.style.cssText=`pointer-events:all;padding:11px 16px;border-radius:12px;background:rgba(4,20,40,0.97);border:1px solid ${c[type]};color:#e0f2fe;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.5);max-width:280px`;
      t.innerHTML=msg;toastContainer.appendChild(t);setTimeout(()=>t.remove(),3500);
    };
    function toggleMenu(){document.getElementById('navDropdown').classList.toggle('open')}
    document.addEventListener('click',e=>{if(!e.target.closest('.nav-right-menu'))document.getElementById('navDropdown')?.classList.remove('open')});
  </script>

  <script type="module" src="pickso-mp.js"></script>
</body>
</html>
