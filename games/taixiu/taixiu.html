<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VTWorld — Tài Xỉu</title>
    <link rel="stylesheet" href="../../status-bar.css">
    <link rel="stylesheet" href="taixiu.css">
    <link rel="stylesheet" href="xucxac.css">
    <link rel="stylesheet" href="../../quests.css">
    <script src="xucxac.js"></script>
    <script src="../../top-nav.js"></script>
    <script src="../../bottom-nav.js"></script>
    <script src="../../fullscreen.js"></script>
    <script type="module" src="../../quests.js"></script>
</head>
<body data-bottom-nav="games">
    <canvas id="bg-canvas"></canvas>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <div id="top-nav-root"></div>

    <div class="game-container">
        <!-- STATUS BAR: cược | tổng điểm | lời/tiền -->
        <div class="bc-status" id="bc-status">
            <span class="stat-bet" id="tx-bet">0</span>
            <div class="stat-score-wrap">
                <span class="stat-score" id="total-score">--</span>
                <span class="stat-score-sub" id="tx-side-detail"></span>
            </div>
            <span class="stat-profit zero" id="tx-profit">+0</span>
        </div>

        <!-- Bát lắc -->
        <div class="bowl-wrap">
            <div id="bowl" class="bowl">
                <div id="bowl-lid" class="bowl-lid"></div>
                <div id="dice-container" class="dices">
                    <xuc-xac id="dice-0" value="1"></xuc-xac>
                    <div class="dice-row">
                        <xuc-xac id="dice-1" value="1"></xuc-xac>
                        <xuc-xac id="dice-2" value="1"></xuc-xac>
                    </div>
                </div>
            </div>
            <div class="bowl-hint">👆 Nhấn vào bát để lắc</div>
        </div>

        <!-- Bàn cược -->
        <div class="bet-board">
            <div class="bet-card tai" data-id="tai">
                <span class="bet-label">TÀI</span>
                <span class="emoji">🔴</span>
                <div class="bet-info">11 – 18</div>
                <div class="my-bet" id="bet-tai">0</div>
            </div>
            <div class="bet-card xiu" data-id="xiu">
                <span class="bet-label">XỈU</span>
                <span class="emoji">🔵</span>
                <div class="bet-info">3 – 10</div>
                <div class="my-bet" id="bet-xiu">0</div>
            </div>
        </div>

        <!-- Chips + Xoá cùng hàng -->
        <div class="chip-row">
            <button class="chip" data-amt="100">100</button>
            <button class="chip" data-amt="500">500</button>
            <button class="chip active" data-amt="1000">1k</button>
            <button class="chip" data-amt="5000">5k</button>
            <button id="btn-clear" class="chip-clear">🗑️</button>
        </div>


    </div>

    <div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none"></div>

    <script>
        const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d'); let particles = [];
        function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
        for(let i=0;i<25;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
        (function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(251,191,36,0.4)';ctx.fill()});requestAnimationFrame(loop)})();

        window.showToast=function(msg,type='info'){const c={info:'#38bdf8',success:'#34d399',warn:'#fbbf24',error:'#f87171'};const t=document.createElement('div');t.style.cssText=`pointer-events:all;padding:11px 16px;border-radius:12px;background:rgba(4,20,40,0.97);border:1px solid ${c[type]};color:#e0f2fe;font-size:13px;font-weight:400;font-family:'Science Gothic', sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.5);max-width:280px`;t.innerHTML=msg;toastContainer.appendChild(t);setTimeout(()=>t.remove(),3500)};
    </script>

    <script type="module" src="taixiu.js"></script>
</body>
</html>
