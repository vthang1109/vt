<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VTWorld — Uống Đi</title>
  <link rel="stylesheet" href="../../style.css"/>
  <link rel="stylesheet" href="../../status-bar.css"/>
  <link rel="stylesheet" href="uongdi.css"/>
  <script src="../../top-nav.js"></script>
  <script src="../../bottom-nav.js"></script>
  <script src="../../fullscreen.js"></script>
  <script src="../../admin-toggle.js"></script>
</head>
<body data-bottom-nav="games" data-hide-points="true">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div id="top-nav-root"></div>

  <div class="ud-wrap">

    <!-- STATUS BAR -->
    <div class="bc-status" id="ud-status">
      <span class="stat-bet" id="ud-drawn">0</span>
      <div class="stat-score-wrap">
        <span class="stat-score" id="ud-type">--</span>
        <span class="stat-score-sub" id="ud-cat-label"></span>
      </div>
      <span class="stat-profit zero" id="ud-remaining">0 lá</span>
    </div>

    <!-- CARD TABLE -->
    <div class="ud-table" id="ud-table">
      <div class="ud-card" id="ud-card">
        <div class="ud-card-inner">
          <div class="ud-card-face ud-card-back">
            <div class="ud-logo">UỐNG ĐI</div>
            <div class="ud-logo-sub">Ấn vào lá</div>
          </div>
          <div class="ud-card-face ud-card-front">
            <div class="ud-card-type" id="ud-card-type"></div>
            <div class="ud-card-text" id="ud-card-text"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="ud-progress-text" id="ud-progress-text"></div>

    <!-- LỊCH SỬ LÁ ĐÃ RÚT -->
    <div class="ud-history" id="udHistory" style="display:none;">
      <div class="ud-history-header" id="udHistoryHeader">
        <span>📜 Lịch sử đã rút</span>
        <button class="ud-history-clear" id="udHistoryClear">✕ Xóa</button>
      </div>
      <div class="ud-history-list" id="udHistoryList">
        <div class="ud-history-empty">Chưa có lá nào được rút</div>
      </div>
    </div>

  </div>

  <!-- SETTINGS MODAL -->
  <div class="ud-modal-overlay" id="udSettingsOverlay">
    <div class="ud-modal">
      <div class="ud-modal-head">
        <span>⚙️ Setting Game</span>
        <button class="ud-modal-close" id="udSettingsClose">✕</button>
      </div>

      <div class="ud-modal-body">
        <div class="ud-set-group">
          <label class="ud-set-toggle">
            <input type="checkbox" id="udSetNoRepeat" checked/>
            Không lặp lại lá đã rút
          </label>
        </div>

        <div class="ud-set-group">
          <button class="ud-set-btn danger" id="udSetResetDeck">🗑️ Reset toàn bộ</button>
        </div>

        <div class="ud-set-group ud-admin-group" id="udAdminGroup" style="display:none">
          <div class="ud-set-divider"></div>
          <label class="ud-set-label">🔑 Admin — Thêm lá mới</label>
          <select id="udAdminCat"></select>
          <textarea id="udAdminText" placeholder="Nội dung lá bài..." rows="2"></textarea>
          <button class="ud-set-btn primary" id="udAdminAdd">➕ Thêm lá</button>
          <div class="ud-admin-list" id="udAdminList"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" style="display:none"></div>

  <script>
    const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d'); let particles = [];
    function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
    for(let i=0;i<25;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
    (function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(251,191,36,0.35)';ctx.fill()});requestAnimationFrame(loop)})();
    window.showToast = window.showToast || function(){};
  </script>

  <script type="module" src="uongdi.js"></script>
</body>
</html>
