<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>VTWorld — Sudoku</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../style.css"/>
  <link rel="stylesheet" href="../../status-bar.css"/>
  <link rel="stylesheet" href="sudoku.css"/>
  <link rel="stylesheet" href="../../quests.css"/>
  <script src="../../top-nav.js"></script>
  <script src="../../bottom-nav.js"></script>
  <script type="module" src="../../quests.js"></script>
  <script src="../../fullscreen.js"></script>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div><div class="orb orb2"></div>

  <div id="top-nav-root"></div>

  <div class="sudoku-container">

    <!-- STATUS BAR (dùng chung) -->
    <div class="bc-status" id="bc-status" style="display:none">
      <span class="stat-bet" id="sdk-status-left">Dê</span>
      <div class="stat-score-wrap">
        <span class="stat-score" id="sdk-status-center">00:00</span>
      </div>
      <span class="stat-profit zero" id="sdk-status-right">♥♥♥</span>
    </div>

    <!-- ===== DIFFICULTY SELECT ===== -->
    <div id="screen-diff" class="sdk-screen">
      <div class="sdk-logo">9×9</div>
      <h1 class="sdk-title">Sudoku</h1>
      <p class="sdk-sub">Điền số 1–9 vào mỗi hàng, cột và ô 3×3 — không trùng lặp</p>

      <div class="diff-grid">
        <div class="diff-card" onclick="Sdk.start('easy')">
          <div>
            <span class="diff-name">Dễ</span>
            <span class="diff-desc">36 ô trống</span>
          </div>
          <span class="diff-pts">300〄</span>
        </div>
        <div class="diff-card" onclick="Sdk.start('medium')">
          <div>
            <span class="diff-name">Trung bình</span>
            <span class="diff-desc">46 ô trống</span>
          </div>
          <span class="diff-pts">600〄</span>
        </div>
        <div class="diff-card" onclick="Sdk.start('hard')">
          <div>
            <span class="diff-name">Khó</span>
            <span class="diff-desc">52 ô trống</span>
          </div>
          <span class="diff-pts">1.000〄</span>
        </div>
      </div>

      <div class="sdk-stats">
        <div class="stat-item">
          <span class="stat-val" id="stat-played">0</span>
          <span class="stat-lbl">Đã chơi</span>
        </div>
        <div class="stat-item">
          <span class="stat-val" id="stat-won">0</span>
          <span class="stat-lbl">Thắng</span>
        </div>
      </div>
    </div>

    <!-- ===== GAME SCREEN ===== -->
    <div id="screen-game" class="sdk-screen hidden">
      <div class="sdk-board-wrap">
        <table class="sdk-board" id="sdk-board"></table>
      </div>

      <div class="sdk-numpad">
        <button class="num-btn" onclick="Sdk.input(1)">1</button>
        <button class="num-btn" onclick="Sdk.input(2)">2</button>
        <button class="num-btn" onclick="Sdk.input(3)">3</button>
        <button class="num-btn" onclick="Sdk.input(4)">4</button>
        <button class="num-btn" onclick="Sdk.input(5)">5</button>
        <button class="num-btn" onclick="Sdk.input(6)">6</button>
        <button class="num-btn" onclick="Sdk.input(7)">7</button>
        <button class="num-btn" onclick="Sdk.input(8)">8</button>
        <button class="num-btn" onclick="Sdk.input(9)">9</button>
        <button class="num-btn erase" onclick="Sdk.input(0)">⌫</button>
        <button class="num-btn hint-btn" onclick="Sdk.hint()" id="hint-btn">Gợi ý</button>
        <button class="num-btn note-btn" onclick="Sdk.toggleNote()" id="note-btn">Nháp</button>
      </div>

      <div class="sdk-controls">
        <button class="caro-btn" onclick="Sdk.backToMenu()">Thoát</button>
        <button class="caro-btn" onclick="Sdk.restart()">Ván mới</button>
      </div>
    </div>

  </div>

  <!-- ===== RESULT MODAL ===== -->
  <div id="result-modal" class="result-modal hidden">
    <div class="result-box">
      <div class="result-emoji" id="result-emoji"></div>
      <div class="result-title" id="result-title">Hoàn thành!</div>
      <div class="result-time" id="result-time"></div>
      <div class="result-rewards" id="result-rewards"></div>
      <button class="caro-btn green" onclick="Sdk.restart()">Chơi lại</button>
      <button class="caro-btn" onclick="Sdk.backToMenu()">Chọn độ khó</button>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="caro-toast"></div>

  <div id="toastContainer" style="display:none"></div>

  <script>
    const canvas = document.getElementById('bg-canvas');
    if (canvas) {
      const ctx = canvas.getContext('2d');
      let particles = [];
      function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
      for(let i=0;i<30;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
      (function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(56,189,248,0.4)';ctx.fill()});requestAnimationFrame(loop)})();
    }
    window.showToast = window.showToast || function(){};
  </script>

  <script type="module" src="sudoku.js"></script>
</body>
</html>
