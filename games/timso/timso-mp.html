<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>VTWorld — Tìm Số Multiplayer</title>
  <link rel="stylesheet" href="../../style.css"/>
  <link rel="stylesheet" href="../../status-bar.css"/>
  <link rel="stylesheet" href="../../games/caro/caro.css"/>
  <link rel="stylesheet" href="timso.css"/>
  <style>
    /* ===== TIMSO MP OVERRIDES ===== */
    .tsmp-wrap {
      min-height: 100vh;
      padding: 14px 12px 60px;
      max-width: 560px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .mp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid rgba(56, 189, 248, 0.15);
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .mp-header .mp-room-code {
      font-family: 'Science Gothic', sans-serif;
      font-weight: 400;
      font-size: 13px;
      color: #7dd3fc;
      background: rgba(0,0,0,0.3);
      padding: 4px 12px;
      border-radius: 8px;
    }
    .mp-header .mp-room-name {
      font-weight: 800;
      font-size: 14px;
      color: #e0f2fe;
    }
    .mp-header .mp-leave-btn {
      background: none;
      border: 1px solid rgba(248,113,113,0.3);
      color: #f87171;
      padding: 6px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Science Gothic', sans-serif;
      transition: all 0.2s;
    }
    .mp-header .mp-leave-btn:hover {
      background: rgba(248,113,113,0.15);
      border-color: #f87171;
    }

    .mp-status {
      text-align: center;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      font-weight: 700;
      font-size: 13px;
      background: rgba(56, 189, 248, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.1);
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mp-players-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(56, 189, 248, 0.1);
      margin-bottom: 10px;
      gap: 6px;
    }
    .mp-player-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 12px;
      color: #e0f2fe;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all 0.3s;
      flex: 1;
    }
    .mp-player-tag.active {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.08);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);
    }
    .mp-player-tag .name { flex: 1; font-size: 13px; }
    .mp-player-tag .score-tag {
      font-size: 14px;
      font-weight: 800;
      font-family: 'Science Gothic', sans-serif;
    }
    .mp-player-tag .score-tag.p1 { color: #34d399; }
    .mp-player-tag .score-tag.p2 { color: #60a5fa; }
    .mp-player-tag .ready-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(52,211,153,0.2);
      color: #34d399;
    }
    .mp-player-tag .wait-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(251,191,36,0.15);
      color: #fbbf24;
    }
    .mp-vs {
      font-family: 'Science Gothic', sans-serif;
      font-weight: 400;
      font-size: 11px;
      color: #4a7a9b;
      flex-shrink: 0;
    }

    .mp-score-summary {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(56, 189, 248, 0.08);
      margin-bottom: 10px;
      font-size: 13px;
    }
    .mp-score-summary .ss-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mp-score-summary .ss-val {
      font-weight: 800;
      font-family: 'Science Gothic', sans-serif;
    }
    .ss-p1 { color: #34d399; }
    .ss-p2 { color: #60a5fa; }
    .ss-target {
      color: #fbbf24;
      font-size: 14px;
    }

    .mp-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .mp-actions button {
      padding: 10px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 400;
      font-family: 'Science Gothic', sans-serif;
      font-size: 12px;
      transition: all 0.2s;
    }
    .mp-actions button:hover { transform: translateY(-2px); }
    .mp-actions button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-ready-mp {
      background: linear-gradient(135deg, #34d399, #10b981);
      color: #fff;
    }
    .btn-ready-mp.on {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
    }
    .btn-start-mp {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #fff;
    }
    .btn-start-mp:disabled { opacity: 0.4; }

    .mp-waiting-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .mp-waiting-overlay.hidden { display: none; }
    .mp-waiting-overlay .big-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56,189,248,0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mp-waiting-overlay .wait-text {
      color: #e0f2fe;
      font-weight: 400;
      font-size: 16px;
      font-family: 'Science Gothic', sans-serif;
    }

    .ts-board.mp-clickable .ts-cell:not(:disabled) {
      cursor: pointer;
    }
    .ts-board.mp-disabled .ts-cell {
      cursor: default !important;
      opacity: 0.6;
    }
    .tsmp-turn-timer {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Science Gothic', sans-serif;
      padding: 6px 0;
      margin-bottom: 6px;
    }
    .tsmp-turn-timer .tt-active {
      color: #38bdf8;
    }
    .tsmp-turn-timer .tt-warn {
      color: #ef4444;
      animation: pulse 0.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .tsmp-turn-timer .tt-wait {
      color: #94a3b8;
    }

    .result-box .mp-result-sub {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
    }
  </style>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div id="top-nav-root"></div>
  <script src="../../top-nav.js"></script>

  <div class="tsmp-wrap" id="mp-app">
    <!-- HEADER -->
    <div class="mp-header">
      <span class="mp-room-name" id="mp-room-name">Phòng Tìm Số</span>
      <span class="mp-room-code" id="mp-room-code">#------</span>
      <button class="mp-leave-btn" onclick="leaveMpRoom()">✕ Rời</button>
    </div>

    <!-- STATUS -->
    <div class="mp-status" id="mp-status">
      <div style="display:flex;justify-content:space-between;align-items:center;width:100%;">
        <span>⏳ Đang kết nối...</span>
      </div>
    </div>

    <!-- PLAYERS -->
    <div class="mp-players-row" id="mp-players-row">
      <div class="mp-player-tag" id="mp-p1">
        <span class="name">...</span>
        <span class="score-tag p1" id="mp-score-p1">0</span>
        <span class="ready-badge" id="mp-p1-ready">✅</span>
      </div>
      <div class="mp-vs">VS</div>
      <div class="mp-player-tag" id="mp-p2">
        <span class="name">...</span>
        <span class="score-tag p2" id="mp-score-p2">0</span>
        <span class="wait-badge" id="mp-p2-ready">⏳</span>
      </div>
    </div>

    <!-- TURN TIMER -->
    <div class="tsmp-turn-timer" id="tsmp-turn-timer" style="display:none">
      <span class="tt-wait">Đang chờ...</span>
    </div>

    <!-- TARGET (dùng chung .bc-status) -->
    <div class="bc-status" id="tsmp-status" style="display:none">
      <span class="stat-bet" id="tsmp-target-label">🎯 1</span>
      <div class="stat-score-wrap">
        <span class="stat-score" id="tsmp-remaining">100</span>
        <span class="stat-score-sub" id="tsmp-sub">Số còn lại</span>
      </div>
      <span class="stat-profit zero" id="tsmp-bet-display">0</span>
    </div>

    <!-- BOARD -->
    <div class="ts-board" id="tsmp-board" style="display:none"></div>

    <!-- ACTIONS -->
    <div class="mp-actions" id="mp-actions">
      <button class="btn-ready-mp" id="btn-ready-mp" onclick="toggleMpReady()">✅ Sẵn sàng</button>
      <button class="btn-start-mp" id="btn-start-mp" onclick="startMpGame()" disabled>🚀 Bắt đầu</button>
    </div>
  </div>

  <!-- RESULT MODAL -->
  <div id="result-modal" class="result-modal hidden">
    <div class="result-box">
      <div class="result-emoji" id="result-emoji">🏆</div>
      <div class="result-title" id="result-title">Bạn thắng!</div>
      <div class="result-pts" id="result-pts"></div>
      <div class="mp-result-sub" id="result-sub"></div>
      <div class="caro-actions" style="justify-content:center">
        <button class="btn-restart" onclick="closeResultAndContinue()">🔄 Tiếp tục</button>
        <button class="btn-home"    onclick="leaveMpRoom()">🚪 Rời phòng</button>
      </div>
    </div>
  </div>

  <!-- WAITING OVERLAY -->
  <div class="mp-waiting-overlay hidden" id="mp-waiting-overlay">
    <div class="big-spinner"></div>
    <div class="wait-text">⏳ Đang chờ người chơi thứ 2...</div>
    <button onclick="leaveMpRoom()" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 20px;border-radius:10px;font-weight:400;cursor:pointer;font-family:'Science Gothic', sans-serif;font-size:13px;">Rời phòng</button>
  </div>

  <!-- TOAST -->
  <div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none"></div>

  <!-- BACKGROUND PARTICLES -->
  <script>
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let particles = [];
    function resizeBg() { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
    resizeBg(); window.addEventListener('resize', resizeBg);
    for (let i = 0; i < 30; i++) particles.push({ x: Math.random()*bgCanvas.width, y: Math.random()*bgCanvas.height, vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.4, r:Math.random()*1.5+0.5 });
    function drawBg() {
      bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
      particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; if(p.x<0)p.x=bgCanvas.width; if(p.x>bgCanvas.width)p.x=0; if(p.y<0)p.y=bgCanvas.height; if(p.y>bgCanvas.height)p.y=0; bgCtx.beginPath(); bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2); bgCtx.fillStyle='rgba(56,189,248,0.4)'; bgCtx.fill(); });
      requestAnimationFrame(drawBg);
    }
    drawBg();
  </script>

  <script src="../../bottom-nav.js"></script>
  <script type="module" src="timso-mp.js"></script>
</body>
</html>
