<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Tìm Số MP</title>
  <link rel="stylesheet" href="../../style.css"/>
  <link rel="stylesheet" href="../../status-bar.css"/>
  <link rel="stylesheet" href="timso.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    .material-symbols-outlined { font-size:inherit; line-height:1; vertical-align:middle; }
  </style>
  <style>
    .tsmp-wrap { min-height:100vh; padding:14px 12px 60px; max-width:600px; margin:0 auto; position:relative; z-index:1; }

    /* ===== VÙNG ĐẶT CƯỢC MỚI (giống chess) ===== */
    .ts-bet-zone { margin-bottom:12px; }

    /* Chủ phòng chọn cược */
    .ts-bet-picker {
      padding:16px 18px; border-radius:14px;
      background:linear-gradient(135deg,rgba(255,255,255,0.04),rgba(255,255,255,0.01));
      border:1px solid rgba(251,191,36,0.2);
    }
    .ts-bet-picker-title {
      font-family:"Science Gothic",sans-serif;
      font-weight:400; font-size:11px; color:#94a3b8;
      text-transform:uppercase; letter-spacing:0.8px; margin-bottom:10px;
    }
    .ts-bet-picker-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .ts-bet-picker-row input {
      flex:1; padding:10px 12px; border-radius:10px;
      border:1px solid rgba(251,191,36,0.3);
      background:rgba(0,0,0,0.35); color:#fde68a;
      font-family:"Science Gothic",sans-serif;
      font-weight:500; font-size:16px; text-align:center;
    }
    .ts-bet-quick {
      display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:10px;
    }
    .ts-bet-quick button {
      padding:8px 0; border-radius:8px;
      border:1px solid rgba(255,255,255,0.07);
      background:rgba(255,255,255,0.04);
      color:#cbd5e1; font-family:"Science Gothic",sans-serif;
      font-weight:400; font-size:12px; cursor:pointer; transition:all .15s;
    }
    .ts-bet-quick button:hover { background:rgba(251,191,36,0.12); color:#fbbf24; }
    .ts-bet-quick button:active { transform:scale(0.95); }

    /* Mode & type row */
    .ts-bet-opts { display:flex; gap:8px; margin-bottom:10px; }
    .ts-bet-opt-btn {
      flex:1; padding:8px 6px; border-radius:8px;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.04);
      color:#94a3b8; font-family:"Science Gothic",sans-serif;
      font-weight:500; font-size:11px; cursor:pointer; transition:all .2s;
      text-align:center;
    }
    .ts-bet-opt-btn:hover { border-color:rgba(56,189,248,0.3); color:#e0f2fe; }
    .ts-bet-opt-btn.active { border-color:rgba(56,189,248,0.6); color:#38bdf8; background:rgba(56,189,248,0.08); }

    .ts-bet-confirm-btn {
      width:100%; padding:12px 0; border-radius:10px; border:none; cursor:pointer;
      font-family:"Science Gothic",sans-serif; font-weight:500; font-size:13px;
      background:linear-gradient(135deg,#fbbf24,#f59e0b);
      color:#0a101e; box-shadow:0 4px 16px rgba(251,191,36,0.25);
      transition:all .15s;
    }
    .ts-bet-confirm-btn:hover { box-shadow:0 6px 24px rgba(251,191,36,0.4); }
    .ts-bet-confirm-btn:active { transform:scale(0.97); }
    .ts-bet-confirm-btn:disabled { opacity:.4; cursor:not-allowed; box-shadow:none; transform:none; }

    /* Trạng thái chờ */
    .ts-bet-waiting {
      text-align:center; font-family:"Science Gothic",sans-serif;
      font-weight:400; font-size:13px; color:#94a3b8;
      padding:16px 0;
    }
    .ts-bet-waiting b { color:#fbbf24; }

    /* Thẻ xác nhận cho đối thủ */
    .ts-bet-confirm-card {
      padding:18px 16px; border-radius:14px;
      background:rgba(56,189,248,0.06);
      border:1px solid rgba(56,189,248,0.35); text-align:center;
    }
    .ts-bet-confirm-info {
      font-family:"Science Gothic",sans-serif;
      font-weight:500; font-size:13px; color:#94a3b8; margin-bottom:4px;
    }
    .ts-bet-confirm-info span { color:#38bdf8; }
    .ts-bet-confirm-amt {
      font-family:"Science Gothic",sans-serif;
      font-weight:500; font-size:22px; color:#fbbf24; margin-bottom:8px;
    }
    .ts-bet-confirm-type {
      font-size:12px; color:#94a3b8; margin-bottom:14px;
    }
    .ts-bet-confirm-actions { display:flex; gap:10px; }
    .ts-bet-confirm-actions button {
      flex:1; padding:11px 0; border-radius:10px; border:none; cursor:pointer;
      font-family:"Science Gothic",sans-serif; font-weight:500; font-size:13px;
      transition:all .15s;
    }
    .ts-bet-confirm-actions button:active { transform:scale(0.97); }
    .ts-bet-confirm-actions .decline {
      background:rgba(255,255,255,0.08); color:#cbd5e1;
    }
    .ts-bet-confirm-actions .accept {
      background:linear-gradient(135deg,#4ade80,#22c55e); color:#06240f;
    }
    .ts-bet-confirm-actions .accept:disabled, .ts-bet-confirm-actions .decline:disabled {
      opacity:.4; cursor:not-allowed; transform:none;
    }

    /* Inline result banner */
    .ts-rs-banner {
      display:none; align-items:center; gap:14px; padding:14px 18px; margin:12px 0;
      background:linear-gradient(135deg,rgba(15,23,42,.98),rgba(7,16,32,.98));
      border:1px solid rgba(167,139,250,.25); border-radius:16px;
      text-align:center; justify-content:center; flex-wrap:wrap;
    }
    .ts-rs-emoji { font-size:34px; line-height:1; }
    .ts-rs-title { font-size:17px; font-weight:700; color:#e0f2fe; font-family:"Science Gothic",sans-serif; }
    .ts-rs-sub { font-size:12px; color:#94a3b8; font-weight:600; width:100%; }
    .ts-rs-acts { display:flex; gap:8px; }
    .ts-rs-acts button {
      padding:9px 18px; border-radius:10px; border:none; cursor:pointer;
      font-weight:600; font-size:12px; font-family:"Science Gothic",sans-serif; transition:all .2s;
    }
    .ts-rs-acts button:hover { transform:translateY(-2px); }
    .ts-rs-restart { background:linear-gradient(135deg,#34d399,#10b981); color:#fff; }
    .ts-rs-home { background:rgba(248,113,113,.15); color:#f87171; border:1px solid rgba(248,113,113,.4) !important; }

    .ts-board.mp-clickable .ts-cell:not(:disabled) { cursor:pointer; }
    .ts-board.mp-disabled .ts-cell { cursor:default !important; opacity:0.6; }

    /* Destroy mode indicator */
    .ts-destroy-stat { text-align:center; font-size:12px; color:#94a3b8; margin-bottom:6px; font-weight:600; }
    .ts-destroy-stat span { color:#ef4444; }
  </style>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div id="top-nav-root"></div>
  <script src="../../top-nav.js"></script>

  <div class="tsmp-wrap" id="mp-app">
    <!-- WAITING -->
    <div class="mp-wait" id="mp-wait">
      <div class="e">&#9203;</div>
      <div class="t" id="mp-wait-t">&#272;ang ch&#7901; ng&#432;&#7901;i ch&#417;i...</div>
    </div>

    <!-- VÙNG ĐẶT CƯỢC MỚI (giống chess) -->
    <div class="ts-bet-zone" id="ts-bet-zone" style="display:none"></div>



    <!-- STATUS BAR -->
    <div class="bc-status" id="ts-sbar" style="display:none">
      <span class="stat-bet" id="ts-l">P1: 0</span>
      <div class="stat-score-wrap">
        <span class="stat-score" id="ts-tg">1</span>
        <span class="stat-score-sub" id="ts-sb">10s</span>
      </div>
      <span class="stat-profit zero" id="ts-r">P2: 0</span>
    </div>

    <!-- BOARD -->
    <div class="ts-board" id="ts-bd" style="display:none"></div>

    <!-- INLINE RESULT BANNER -->
    <div class="ts-rs-banner" id="ts-rs-banner">
      <span class="ts-rs-emoji" id="rs-b-em">&#127942;</span>
      <span class="ts-rs-title" id="rs-b-tl">Th&#7855;ng!</span>
      <div class="ts-rs-acts">
        <button class="ts-rs-restart" onclick="closeRs()">Ch&#417;i ti&#7871;p</button>
        <button class="ts-rs-home" onclick="window.quitGame()">R&#7901;i</button>
      </div>
      <div class="ts-rs-sub" id="rs-b-sub"></div>
    </div>
  </div>

  <div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px"></div>

  <script>
    // Particles
    var c=document.getElementById('bg-canvas'),x=c.getContext('2d'),p=[];
    function rs(){c.width=innerWidth;c.height=innerHeight} rs(); addEventListener('resize',rs);
    for(var i=0;i<25;i++)p.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
    function dr(){x.clearRect(0,0,c.width,c.height);p.forEach(function(q){q.x+=q.vx;q.y+=q.vy;if(q.x<0)q.x=c.width;if(q.x>c.width)q.x=0;if(q.y<0)q.y=c.height;if(q.y>c.height)q.y=0;x.beginPath();x.arc(q.x,q.y,q.r,0,Math.PI*2);x.fillStyle='rgba(56,189,248,0.4)';x.fill()});requestAnimationFrame(dr)}
    dr();
    // Toast
    window.showToast=function(m,t){t=t||'info';var cols={info:'#38bdf8',success:'#34d399',warn:'#fbbf24',error:'#f87171'};var e=document.createElement('div');e.style.cssText='pointer-events:all;padding:11px 16px;border-radius:12px;background:rgba(4,20,40,0.97);border:1px solid '+(cols[t]||cols.info)+';color:#e0f2fe;font-size:13px;font-weight:400;font-family:\\\"Science Gothic\\\",sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.5);max-width:280px';e.textContent=m;document.getElementById('toastContainer').appendChild(e);setTimeout(function(){e.remove()},3500);};
    // Close result
    window.closeRs=function(){if(window.gameReset)window.gameReset();};
  </script>

  <script src="../../bottom-nav.js"></script>
  <script src="../../admin-toggle.js"></script>
  <script type="module" src="timso-mp.js"></script>
</body>
</html>
