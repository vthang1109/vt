<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Tìm Số MP</title>
  <link rel="stylesheet" href="../../style.css"/>
  <link rel="stylesheet" href="../../status-bar.css"/>
  <link rel="stylesheet" href="timso.css"/>
  <style>
    .tsmp-wrap { min-height:100vh; padding:14px 12px 60px; max-width:600px; margin:0 auto; position:relative; z-index:1; }

    /* Bet row */
    .mp-bet { display:flex; align-items:center; justify-content:center; gap:10px; padding:14px 12px; margin:20px 0; background:rgba(167,139,250,0.04); border:1px solid rgba(167,139,250,0.15); border-radius:14px; }
    .mp-bet label { color:#fbbf24; font-weight:600; font-size:13px; font-family:"Science Gothic",sans-serif; }
    .mp-bet select { padding:7px 10px; border-radius:8px; border:1px solid rgba(167,139,250,0.3); background:rgba(0,0,0,0.3); color:#e0f2fe; font-size:14px; font-family:"Science Gothic",sans-serif; font-weight:600; }
    .mp-bet select:focus { outline:none; border-color:rgba(167,139,250,0.6); }
    .mp-bet button { padding:7px 18px; border-radius:8px; border:none; cursor:pointer; font-weight:600; font-size:12px; font-family:"Science Gothic",sans-serif; transition:all .2s; }
    .mp-bet button:hover { transform:translateY(-1px); }
    .btn-bet-go { background:linear-gradient(135deg,#a78bfa,#7c3aed); color:#fff; }
    .btn-bet-go:disabled { opacity:.5; cursor:not-allowed; transform:none; }
    .btn-bet-yes { background:linear-gradient(135deg,#34d399,#10b981); color:#fff; }
    .btn-bet-yes.on { background:linear-gradient(135deg,#fbbf24,#f59e0b); }
    .mp-bet-info { text-align:center; color:#94a3b8; font-size:12px; font-weight:600; margin-bottom:8px; }

    /* Waiting */
    .mp-wait { text-align:center; padding:50px 20px; color:#94a3b8; }
    .mp-wait .e { font-size:48px; }
    .mp-wait .t { font-size:18px; font-weight:700; color:#e0f2fe; margin:10px 0 4px; font-family:"Science Gothic",sans-serif; }

    /* Result modal */
    .result-modal { position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; background:rgba(2,6,23,0.7); backdrop-filter:blur(4px); padding:16px; }
    .result-modal.hidden { display:none; }
    .result-box { background:linear-gradient(160deg,rgba(15,23,42,.98),rgba(7,16,32,.98)); border:1px solid rgba(167,139,250,.25); border-radius:22px; padding:24px 28px; max-width:340px; width:100%; text-align:center; }
    .result-emoji { font-size:48px; margin-bottom:8px; }
    .result-title { font-size:20px; font-weight:700; color:#e0f2fe; margin-bottom:6px; font-family:"Science Gothic",sans-serif; }
    .result-pts { font-size:24px; font-weight:800; font-family:"Science Gothic",sans-serif; color:#fbbf24; margin-bottom:4px; }
    .result-sub { font-size:13px; color:#94a3b8; font-weight:600; margin-bottom:16px; }
    .result-box .acts { display:flex; gap:10px; justify-content:center; }
    .result-box .acts button { padding:10px 18px; border-radius:12px; border:none; cursor:pointer; font-weight:500; font-size:13px; font-family:"Science Gothic",sans-serif; }
    .result-box .acts button:hover { transform:translateY(-2px); }
    .btn-restart { background:linear-gradient(135deg,#34d399,#10b981); color:#fff; }
    .btn-home { background:rgba(248,113,113,.15); color:#f87171; border:1px solid rgba(248,113,113,.4) !important; }
    .ts-board.mp-clickable .ts-cell:not(:disabled) { cursor:pointer; }
    .ts-board.mp-disabled .ts-cell { cursor:default !important; opacity:0.6; }
  </style>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div id="top-nav-root"></div>
  <script src="../../top-nav.js"></script>

  <div class="tsmp-wrap" id="mp-app">
    <!-- WAITING -->
    <div class="mp-wait" id="mp-wait">
      <div class="e">&#9203;</div>
      <div class="t" id="mp-wait-t">&#272;ang ch&#7901; ng&#432;&#7901;i ch&#417;i...</div>
    </div>

    <!-- BET ROW -->
    <div class="mp-bet" id="mp-bet" style="display:none">
      <label>C&#432;&#7903;c:</label>
      <select id="mp-bet-sel">
        <option value="100">100</option>
        <option value="200">200</option>
        <option value="500">500</option>
        <option value="1000">1.000</option>
        <option value="2000">2.000</option>
        <option value="5000">5.000</option>
      </select>
      <button class="btn-bet-go" id="btn-bet-host" onclick="betAction()">X&#225;c nh&#7853;n c&#432;&#7903;c</button>
      <button class="btn-bet-yes" id="btn-bet-player" onclick="betAction()" style="display:none">X&#225;c nh&#7853;n</button>
      <select id="mp-mode-sel" style="margin-left:6px">
        <option value="shuffle">&#127922; &#272;&#7843;o s&#7889;</option>
        <option value="fixed">&#128204; C&#7889; &#273;&#7883;nh</option>
      </select>
    </div>
    <div class="mp-bet-info" id="mp-bet-info"></div>

    <!-- STATUS BAR -->
    <div class="bc-status" id="ts-sbar" style="display:none">
      <span class="stat-bet" id="ts-l">P1: 0</span>
      <div class="stat-score-wrap">
        <span class="stat-score" id="ts-tg">1</span>
        <span class="stat-score-sub" id="ts-sb">10s</span>
      </div>
      <span class="stat-profit zero" id="ts-r">P2: 0</span>
    </div>

    <!-- BOARD -->
    <div class="ts-board" id="ts-bd" style="display:none"></div>
  </div>

  <!-- RESULT MODAL -->
  <div id="rs-modal" class="result-modal hidden">
    <div class="result-box">
      <div class="result-emoji" id="rs-em">&#127942;</div>
      <div class="result-title" id="rs-tl">Th&#7855;ng!</div>
      <div class="result-pts" id="rs-pt"></div>
      <div class="result-sub" id="rs-sb"></div>
      <div class="acts">
        <button class="btn-restart" onclick="closeRs()">Ch&#417;i ti&#7871;p</button>
        <button class="btn-home" onclick="window.quitGame()">R&#7901;i</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px"></div>

  <script>
    // Particles
    var c=document.getElementById('bg-canvas'),x=c.getContext('2d'),p=[];
    function rs(){c.width=innerWidth;c.height=innerHeight} rs(); addEventListener('resize',rs);
    for(var i=0;i<25;i++)p.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
    function dr(){x.clearRect(0,0,c.width,c.height);p.forEach(function(q){q.x+=q.vx;q.y+=q.vy;if(q.x<0)q.x=c.width;if(q.x>c.width)q.x=0;if(q.y<0)q.y=c.height;if(q.y>c.height)q.y=0;x.beginPath();x.arc(q.x,q.y,q.r,0,Math.PI*2);x.fillStyle='rgba(56,189,248,0.4)';x.fill()});requestAnimationFrame(dr)}
    dr();
    // Toast
    window.showToast=function(m,t){t=t||'info';var cols={info:'#38bdf8',success:'#34d399',warn:'#fbbf24',error:'#f87171'};var e=document.createElement('div');e.style.cssText='pointer-events:all;padding:11px 16px;border-radius:12px;background:rgba(4,20,40,0.97);border:1px solid '+(cols[t]||cols.info)+';color:#e0f2fe;font-size:13px;font-weight:400;font-family:\"Science Gothic\",sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.5);max-width:280px';e.textContent=m;document.getElementById('toastContainer').appendChild(e);setTimeout(function(){e.remove()},3500);};
    // Close result
    window.closeRs=function(){var m=document.getElementById('rs-modal');if(m)m.classList.add('hidden');if(window.gameReset)window.gameReset();};
  </script>

  <script src="../../bottom-nav.js"></script>
  <script type="module" src="timso-mp.js"></script>
</body>
</html>
