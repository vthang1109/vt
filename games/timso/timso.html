<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VTWorld — Tìm Số</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin/>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin/>
  <link rel="stylesheet" href="../../style.css"/>
  <link rel="stylesheet" href="../../status-bar.css"/>
  <link rel="stylesheet" href="timso.css"/>
  <script src="../../top-nav.js" defer></script>
  <script src="../../bottom-nav.js" defer></script>
  <script src="../../fullscreen.js"></script>
  <script src="../../admin-toggle.js"></script>
</head>
<body data-bottom-nav="games" class="ts-loading">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div id="top-nav-root"></div>
  <div class="ts-wrap">

    <!-- MÀN CHỌN CHẾ ĐỘ -->
    <div class="ts-mode-select" id="ts-mode-select">
      <div class="ts-shuffle-toggle" id="ts-shuffle-toggle">
        <button class="ts-toggle-btn active" data-mode="fixed" onclick="window.game?.setShuffleMode('fixed')">Cố định</button>
        <button class="ts-toggle-btn" data-mode="shuffle" onclick="window.game?.setShuffleMode('shuffle')">Đảo số</button>
        <button class="ts-lb-open-btn" onclick="window.game?.openLeaderboard()">🏆 Top 10</button>
      </div>
      <h2 class="ts-title">🔢 Tìm Số 1-100</h2>
      <p class="ts-desc">Chọn chế độ chơi</p>
      <div class="ts-mode-cards">
        <button class="ts-mode-card" onclick="window.game?.selectMode('solo')">
          <span class="ts-mode-badge ready">Chơi ngay</span>
          <span class="ts-mode-emoji">⏱️</span>
          <span class="ts-mode-name">Tính Giờ</span>
          <span class="ts-mode-sub">Tìm 1→100 nhanh nhất</span>
        </button>
        <button class="ts-mode-card" onclick="window.game?.selectMode('duo')">
          <span class="ts-mode-badge">2 Người</span>
          <span class="ts-mode-emoji">⚔️</span>
          <span class="ts-mode-name">Đối Kháng</span>
          <span class="ts-mode-sub">10s/lượt · Ai nhiều hơn thắng</span>
        </button>
        <button class="ts-mode-card" onclick="window.game?.selectMode('destroy')">
          <span class="ts-mode-badge hot">Hot</span>
          <span class="ts-mode-emoji">💥</span>
          <span class="ts-mode-name">Huỷ Diệt</span>
          <span class="ts-mode-sub">10s/số · Tìm bao nhiêu thưởng bấy nhiêu</span>
        </button>
      </div>
    </div>

    <!-- STATUS BAR đồng bộ (dùng chung .bc-status) -->
    <div class="bc-status" id="ts-status" style="display:none">
      <span class="stat-bet" id="ts-left">--</span>
      <div class="stat-score-wrap">
        <span class="stat-score" id="ts-target">1</span>
        <span class="stat-score-sub" id="ts-sub"></span>
      </div>
      <span class="stat-profit zero" id="ts-timer">0.0s</span>
    </div>

    <!-- BẢNG SỐ -->
    <div class="ts-board" id="ts-board" style="display:none"></div>
  </div>

  <!-- NÚT TẠM DỪNG (tròn, SVG thuần, góc dưới trái) -->
  <button class="ts-pause-btn" id="ts-pause-btn" style="display:none" title="Tạm dừng" onclick="window.game?.togglePause()">
    <svg id="ts-pause-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
      <rect x="6" y="5" width="4" height="14" rx="1"></rect>
      <rect x="14" y="5" width="4" height="14" rx="1"></rect>
    </svg>
  </button>

  <!-- BẢNG XẾP HẠNG -->
  <div class="ts-lb-modal" id="ts-lb-modal">
    <div class="ts-lb-panel">
      <div class="ts-lb-header">
        <h3>🏆 Bảng Xếp Hạng — Tìm Số</h3>
        <div class="ts-lb-header-actions">
          <button class="ts-lb-refresh" onclick="window.game?.refreshLeaderboard()" title="Tải lại">🔄</button>
          <button class="ts-lb-close" onclick="window.game?.closeLeaderboard()">✕</button>
        </div>
      </div>
      <div class="ts-lb-tabs">
        <button class="ts-lb-tab-btn active" data-tab="solo" onclick="window.game?.switchLBTab('solo')">⏱️ Tính Giờ</button>
        <button class="ts-lb-tab-btn" data-tab="destroy" onclick="window.game?.switchLBTab('destroy')">💥 Huỷ Diệt</button>
      </div>
      <div class="ts-lb-list" id="ts-lb-list"></div>
    </div>
  </div>

  <div id="toastContainer" style="display:none"></div>

  <script>
    // Particle nền (đồng bộ xidach)
    const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d'); let particles = [];
    function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
    for(let i=0;i<25;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
    (function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(52,211,153,0.4)';ctx.fill()});requestAnimationFrame(loop)})();
    window.showToast = window.showToast || function(){};
  </script>

  <script>
    window.__tsReadyTimeout = setTimeout(() => {
      if (window.game) return; // module đã chạy xong bình thường
      document.body.classList.remove('ts-loading');
      const sel = document.getElementById('ts-mode-select');
      if (sel && !document.getElementById('ts-load-warn')) {
        const warn = document.createElement('div');
        warn.id = 'ts-load-warn';
        warn.className = 'ts-load-warn';
        warn.innerHTML = '⚠️ Không tải được game, vui lòng <button onclick="location.reload()">tải lại trang</button>';
        sel.prepend(warn);
      }
    }, 6000);
  </script>

  <script type="module" src="timso.js"></script>
</body>
</html>
