<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>VTWorld — Caro Multiplayer</title>
  <link rel="stylesheet" href="../../style.css"/>
  <link rel="stylesheet" href="../../status-bar.css"/>
  <link rel="stylesheet" href="caro.css"/>
  <style>
    /* ===== VÙNG ĐẶT CƯỢC (giống chess-mp: chủ phòng chọn mức, đối thủ xác nhận) ===== */
    .caro-bet-zone { margin-top: 10px; }

    .caro-bet-picker {
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(251, 191, 36, 0.25);
    }
    .caro-bet-picker-label {
      font-family: 'Science Gothic', sans-serif;
      font-weight: 400;
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .caro-bet-picker-row { display: flex; align-items: center; gap: 8px; }
    .caro-bet-picker-row input {
      flex: 1;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid rgba(251, 191, 36, 0.3);
      background: rgba(0, 0, 0, 0.3);
      color: #fde68a;
      font-family: 'Science Gothic', sans-serif;
      font-weight: 500;
      font-size: 14px;
      text-align: center;
    }
    .caro-bet-quick { display: flex; gap: 6px; margin-top: 8px; }
    .caro-bet-quick button {
      flex: 1;
      padding: 7px 0;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: #cbd5e1;
      font-family: 'Science Gothic', sans-serif;
      font-weight: 400;
      font-size: 11.5px;
      cursor: pointer;
    }
    .caro-bet-quick button:active { transform: scale(0.95); }
    .caro-bet-confirm-btn {
      width: 100%;
      margin-top: 10px;
      padding: 11px 0;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-family: 'Science Gothic', sans-serif;
      font-weight: 500;
      font-size: 13px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0a101e;
      box-shadow: 0 4px 16px rgba(251, 191, 36, 0.3);
      transition: transform 0.15s;
    }
    .caro-bet-confirm-btn:active { transform: scale(0.97); }

    .caro-bet-waiting {
      text-align: center;
      font-family: 'Science Gothic', sans-serif;
      font-weight: 400;
      font-size: 13px;
      color: #94a3b8;
      padding: 14px 0;
    }
    .caro-bet-waiting b { color: #fbbf24; }

    .caro-bet-confirm-card {
      padding: 16px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.35);
      text-align: center;
    }
    .caro-bet-confirm-title {
      font-family: 'Science Gothic', sans-serif;
      font-weight: 500;
      font-size: 14px;
      color: #fff;
      margin-bottom: 4px;
    }
    .caro-bet-confirm-amt {
      font-family: 'Science Gothic', sans-serif;
      font-weight: 500;
      font-size: 20px;
      color: #fbbf24;
      margin-bottom: 12px;
    }
    .caro-bet-confirm-actions { display: flex; gap: 10px; }
    .caro-bet-confirm-actions button {
      flex: 1;
      padding: 10px 0;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-family: 'Science Gothic', sans-serif;
      font-weight: 500;
      font-size: 13px;
    }
    .caro-bet-confirm-actions .decline { background: rgba(255,255,255,0.08); color: #cbd5e1; }
    .caro-bet-confirm-actions .accept {
      background: linear-gradient(135deg, #4ade80, #22c55e);
      color: #06240f;
    }

    @media (max-width: 420px) {
      .caro-bet-picker-row { flex-wrap: wrap; }
    }

    .mp-waiting-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .mp-waiting-overlay.hidden { display: none; }
    .mp-waiting-overlay .big-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56,189,248,0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mp-waiting-overlay .wait-text {
      color: #e0f2fe;
      font-weight: 400;
      font-size: 16px;
      font-family: "Science Gothic", sans-serif;
    }

    /* result modal override */
    .result-box .mp-result-sub {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
    }

    @media (max-width: 420px) {
      .caro-player-tag { font-size: 11px; padding: 3px 6px; }
    }

    /* Nút Đầu hàng / Ván mới: hiện NGAY DƯỚI bàn cờ theo dòng chảy trang bình thường,
       không phải popup/overlay che màn hình. */
    #result-modal.result-modal {
      position: static;
      display: flex;
      justify-content: center;
      width: 100%;
      margin-top: 14px;
    }
    #result-modal.result-modal.hidden { display: none; }

    /* Nút Đầu hàng THƯỜNG TRỰC trong lúc đang chơi — hiện xuyên suốt ván đấu,
       không chờ đến khi ván kết thúc mới có (khác với khu vực Ván mới ở result-modal). */
    .caro-ingame-actions {
      display: flex;
      justify-content: center;
      width: 100%;
      margin-top: 10px;
    }
    .caro-ingame-actions.hidden { display: none; }
    .caro-ingame-actions .btn-resign {
      padding: 9px 20px;
      border-radius: 10px;
      border: 1px solid rgba(248, 113, 113, 0.35);
      background: rgba(248, 113, 113, 0.1);
      color: #fca5a5;
      font-family: 'Science Gothic', sans-serif;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
    }
    .caro-ingame-actions .btn-resign:active { transform: scale(0.97); }
  </style>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div id="top-nav-root"></div>
  <script src="../../top-nav.js"></script>

  <div class="caro-wrap" id="mp-app">

    <!-- STATUS BAR (dùng chung: y hệt caro.html) -->
    <div class="bc-status" id="caro-status-bar">
      <div class="stat-bet">
        <div class="caro-player-tag" id="player1-tag">
          <span id="player1-name">Bạn</span>
          <span class="caro-player-score" id="score-p1">0</span>
        </div>
      </div>
      <div class="stat-score-wrap">
        <span class="stat-score" id="caro-status"></span>
      </div>
      <div class="stat-profit">
        <span class="stat-profit zero" id="caro-profit"></span>
        <div class="caro-player-tag right" id="player2-tag">
          <span class="caro-player-score" id="score-p2">0</span>
          <span id="player2-name">Đối thủ</span>
        </div>
      </div>
    </div>

    <!-- VÙNG ĐẶT CƯỢC: chủ phòng chọn mức, đối thủ xác nhận (render động, giống chess-mp) -->
    <div class="caro-bet-zone" id="caro-bet-zone"></div>

<!-- BOARD -->
    <div class="caro-board-wrap" style="position:relative; flex-direction:column; align-items:center;">
      <canvas id="caro-canvas"></canvas>

      <!-- KHU VỰC ĐẦU HÀNG / VÁN MỚI: nằm trong dòng chảy trang, ngay dưới bàn cờ (không phải popup) -->
      <div id="result-modal" class="result-modal hidden">
        <div class="result-box">
          <div class="caro-actions" style="justify-content:center">
            <button class="btn-home"    onclick="leaveMpRoom()">🚪 Rời phòng</button>
            <button class="btn-restart" onclick="closeResultAndContinue()">🔄 Ván mới</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ĐẦU HÀNG THƯỜNG TRỰC: hiện xuyên suốt trong lúc đang chơi, không chờ ván kết thúc -->
    <div class="caro-ingame-actions hidden" id="caro-ingame-actions">
      <button class="btn-resign" onclick="surrenderMatch()">🏳️ Đầu hàng</button>
    </div>
  </div>

  <!-- WAITING OVERLAY -->
  <div class="mp-waiting-overlay hidden" id="mp-waiting-overlay">
    <div class="big-spinner"></div>
    <div class="wait-text">⏳ Đang chờ người chơi khác...</div>
    <button onclick="leaveMpRoom()" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 20px;border-radius:10px;font-weight:400;cursor:pointer;font-family:'Science Gothic', sans-serif;font-size:13px;">Rời phòng</button>
  </div>

  <!-- TOAST -->
  <div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none"></div>

  <script>
    const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d'); let particles = [];
    function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
    for(let i=0;i<25;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
    (function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(52,211,153,0.4)';ctx.fill()});requestAnimationFrame(loop)})();
  </script>

  <script src="../../bottom-nav.js"></script>
  <script type="module" src="caro-mp.js"></script>
</body>
</html>
