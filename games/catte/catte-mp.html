<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>VTWorld — Cát Tê Online</title>
  <link rel="stylesheet" href="../../style.css"/>
  <link rel="stylesheet" href="../../cards.css"/>
  <link rel="stylesheet" href="../../status-bar.css"/>
  <link rel="stylesheet" href="../../games/caro/caro.css"/>
  <link rel="stylesheet" href="catte.css"/>
  <style>
    /* ===== CATTÉ MP SPECIFIC ===== */
    .ctmp-wrap {
      min-height: 100vh;
      padding: 14px 12px 60px;
      max-width: 560px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .mp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid rgba(56, 189, 248, 0.15);
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .mp-header .mp-room-code {
      font-family: 'Science Gothic', sans-serif;
      font-weight: 400;
      font-size: 13px;
      color: #7dd3fc;
      background: rgba(0,0,0,0.3);
      padding: 4px 12px;
      border-radius: 8px;
    }
    .mp-header .mp-room-name {
      font-weight: 800;
      font-size: 14px;
      color: #e0f2fe;
    }
    .mp-header .mp-leave-btn {
      background: none;
      border: 1px solid rgba(248,113,113,0.3);
      color: #f87171;
      padding: 6px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Science Gothic', sans-serif;
      transition: all 0.2s;
    }
    .mp-header .mp-leave-btn:hover {
      background: rgba(248,113,113,0.15);
      border-color: #f87171;
    }

    .mp-status {
      text-align: center;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      font-weight: 700;
      font-size: 13px;
      background: rgba(56, 189, 248, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.1);
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mp-players-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(56, 189, 248, 0.1);
      margin-bottom: 10px;
      gap: 6px;
    }
    .mp-player-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 12px;
      color: #e0f2fe;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all 0.3s;
      flex: 1;
    }
    .mp-player-tag.active {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.08);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);
    }
    .mp-player-tag .name { flex: 1; font-size: 13px; }
    .mp-player-tag .cards-left {
      font-size: 11px;
      color: #94a3b8;
    }
    .mp-player-tag .ready-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(52,211,153,0.2);
      color: #34d399;
    }
    .mp-player-tag .wait-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(251,191,36,0.15);
      color: #fbbf24;
    }
    .mp-vs {
      font-family: 'Science Gothic', sans-serif;
      font-weight: 400;
      font-size: 11px;
      color: #4a7a9b;
      flex-shrink: 0;
    }

    .mp-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .mp-actions button {
      padding: 10px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 400;
      font-family: 'Science Gothic', sans-serif;
      font-size: 12px;
      transition: all 0.2s;
    }
    .mp-actions button:hover { transform: translateY(-2px); }
    .mp-actions button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-ready-mp {
      background: linear-gradient(135deg, #34d399, #10b981);
      color: #fff;
    }
    .btn-ready-mp.on {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
    }
    .btn-start-mp {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #fff;
    }
    .btn-start-mp:disabled { opacity: 0.4; }

    .mp-waiting-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .mp-waiting-overlay.hidden { display: none; }
    .mp-waiting-overlay .big-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56,189,248,0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mp-waiting-overlay .wait-text {
      color: #e0f2fe;
      font-weight: 400;
      font-size: 16px;
      font-family: 'Science Gothic', sans-serif;
    }

    /* Bet zone */
    .ctmp-bet-zone {
      margin-bottom: 10px;
    }
    .ctmp-bet-picker {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(56,189,248,0.2);
    }
    .ctmp-bet-picker-label {
      font-size: 13px;
      color: #7dd3fc;
      font-weight: 600;
    }
    .ctmp-bet-picker-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .ctmp-bet-picker-row input {
      width: 120px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(56,189,248,0.3);
      background: rgba(0,0,0,0.3);
      color: #e0f2fe;
      font-family: "Science Gothic", sans-serif;
      font-weight: 500;
      text-align: center;
    }
    .ctmp-bet-quick {
      display: flex;
      gap: 6px;
    }
    .ctmp-bet-quick button {
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid rgba(56,189,248,0.2);
      background: rgba(56,189,248,0.08);
      color: #7dd3fc;
      cursor: pointer;
      font-family: 'Science Gothic', sans-serif;
      font-size: 12px;
      transition: background 0.2s;
    }
    .ctmp-bet-quick button:hover { background: rgba(56,189,248,0.2); }
    .ctmp-bet-confirm-btn {
      padding: 9px 24px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      font-family: 'Science Gothic', sans-serif;
      font-size: 13px;
      background: linear-gradient(135deg, #34d399, #059669);
      color: #fff;
    }
    .ctmp-bet-waiting {
      text-align: center;
      padding: 16px;
      font-size: 14px;
      color: #7dd3fc;
    }
    .ctmp-bet-confirm-card {
      text-align: center;
      padding: 16px;
      border-radius: 16px;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(56,189,248,0.2);
    }
    .ctmp-bet-confirm-title {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .ctmp-bet-confirm-amt {
      font-size: 24px;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 12px;
    }
    .ctmp-bet-confirm-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .ctmp-bet-confirm-actions button {
      padding: 9px 24px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-family: 'Science Gothic', sans-serif;
      font-size: 13px;
    }
    .ctmp-bet-confirm-actions .accept {
      background: linear-gradient(135deg, #34d399, #059669);
      color: #fff;
    }
    .ctmp-bet-confirm-actions .decline {
      background: rgba(239,68,68,0.15);
      color: #f87171;
      border: 1px solid rgba(239,68,68,0.3);
    }

    /* Table - adapted from catte */
    .ctmp-table {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 8px 0;
    }
    .ctmp-seat {
      background: rgba(0,0,0,0.25);
      border-radius: 16px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .ctmp-seat.opponent { border-color: rgba(239,68,68,0.15); }
    .ctmp-seat.me { border-color: rgba(56,189,248,0.15); }
    .ctmp-seat-head {
      font-size: 13px;
      font-weight: 700;
      color: #7dd3fc;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ctmp-card-count { color: #fbbf24; font-size: 12px; }
    .ctmp-cards {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 80px;
      align-items: center;
    }

    .ctmp-hand {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 8px;
      max-width: 420px;
      width: 100%;
    }
    .ctmp-hand-card {
      cursor: pointer;
      transition: transform 0.2s;
    }
    .ctmp-hand-card:hover { transform: translateY(-8px); }
    .ctmp-hand-card.selected {
      transform: translateY(-14px);
      filter: drop-shadow(0 0 10px rgba(56,189,248,0.6));
    }
    .ctmp-hand-card.disabled {
      opacity: 0.5;
      cursor: default;
    }
    .ctmp-hand-card.disabled:hover { transform: none; }

    .ctmp-game-actions {
      display: flex;
      gap: 12px;
      margin: 8px 0;
      justify-content: center;
    }
    .ctmp-game-actions button {
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      border: 1px solid rgba(56,189,248,0.2);
      transition: all 0.25s;
    }
    #ctmp-btn-play {
      background: rgba(52,211,153,0.15);
      color: #34d399;
      border-color: rgba(52,211,153,0.3);
    }
    #ctmp-btn-play:hover { background: rgba(52,211,153,0.25); }
    #ctmp-btn-fold {
      background: rgba(239,68,68,0.15);
      color: #f87171;
      border-color: rgba(239,68,68,0.3);
    }
    #ctmp-btn-fold:hover { background: rgba(239,68,68,0.25); }

    .ctmp-info {
      text-align: center;
      font-size: 14px;
      color: #fbbf24;
      margin: 6px 0;
      font-weight: 700;
    }

    .result-box .mp-result-sub {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
    }
  </style>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div id="top-nav-root"></div>
  <script src="../../top-nav.js"></script>

  <div class="ctmp-wrap" id="mp-app">
    <!-- HEADER -->
    <div class="mp-header">
      <span class="mp-room-name" id="mp-room-name">Phòng Cát Tê</span>
      <span class="mp-room-code" id="mp-room-code">#------</span>
      <button class="mp-leave-btn" onclick="leaveMpRoom()">✕ Rời</button>
    </div>

    <!-- STATUS -->
    <div class="mp-status" id="mp-status">
      <div style="display:flex;justify-content:space-between;align-items:center;width:100%;">
        <span>⏳ Đang kết nối...</span>
      </div>
    </div>

    <!-- PLAYERS -->
    <div class="mp-players-row" id="mp-players-row">
      <div class="mp-player-tag" id="mp-p1">
        <span class="name">...</span>
        <span class="cards-left" id="mp-cards-p1">(6 lá)</span>
        <span class="ready-badge" id="mp-p1-ready">✅</span>
      </div>
      <div class="mp-vs">VS</div>
      <div class="mp-player-tag" id="mp-p2">
        <span class="name">...</span>
        <span class="cards-left" id="mp-cards-p2">(6 lá)</span>
        <span class="wait-badge" id="mp-p2-ready">⏳</span>
      </div>
    </div>

    <!-- BET ZONE -->
    <div class="ctmp-bet-zone" id="ctmp-bet-zone"></div>

    <!-- STATUS BAR (dùng chung .bc-status) -->
    <div class="bc-status" id="ctmp-status" style="display:none">
      <span class="stat-bet" id="ctmp-bet-stat"></span>
      <div class="stat-score-wrap">
        <span class="stat-score" id="ctmp-round">Lượt 1</span>
        <span class="stat-score-sub" id="ctmp-sub">Đang chơi</span>
      </div>
      <span class="stat-profit zero" id="ctmp-profit">0</span>
    </div>

    <!-- TABLE (cards played) -->
    <div class="ctmp-table" id="ctmp-table" style="display:none">
      <div class="ctmp-seat opponent" id="ctmp-seat-opp">
        <div class="ctmp-seat-head">Đối thủ · <span class="ctmp-card-count" id="ctmp-opp-count">6 lá</span></div>
        <div class="ctmp-cards" id="ctmp-opp-cards"></div>
      </div>
      <div class="ctmp-seat me">
        <div class="ctmp-seat-head">Bạn · <span class="ctmp-card-count" id="ctmp-my-count">6 lá</span></div>
        <div class="ctmp-cards" id="ctmp-my-cards"></div>
      </div>
    </div>

    <!-- HAND -->
    <div class="ctmp-hand" id="ctmp-hand" style="display:none"></div>

    <!-- INFO -->
    <div class="ctmp-info" id="ctmp-info"></div>

    <!-- GAME ACTIONS -->
    <div class="ctmp-game-actions" id="ctmp-game-actions" style="display:none">
      <button id="ctmp-btn-play" onclick="playSelectedCard()">▶ Đánh bài</button>
      <button id="ctmp-btn-fold" onclick="foldGame()">🏳️ Bỏ bài</button>
    </div>

    <!-- LOBBY ACTIONS -->
    <div class="mp-actions" id="mp-actions">
      <button class="btn-ready-mp" id="btn-ready-mp" onclick="toggleMpReady()">✅ Sẵn sàng</button>
      <button class="btn-start-mp" id="btn-start-mp" onclick="startMpGame()" disabled>🚀 Bắt đầu</button>
    </div>
  </div>

  <!-- RESULT MODAL -->
  <div id="result-modal" class="result-modal hidden">
    <div class="result-box">
      <div class="result-emoji" id="result-emoji">🏆</div>
      <div class="result-title" id="result-title">Bạn thắng!</div>
      <div class="result-pts" id="result-pts"></div>
      <div class="mp-result-sub" id="result-sub"></div>
      <div class="caro-actions" style="justify-content:center">
        <button class="btn-restart" onclick="closeResultAndContinue()">🔄 Tiếp tục</button>
        <button class="btn-home"    onclick="leaveMpRoom()">🚪 Rời phòng</button>
      </div>
    </div>
  </div>

  <!-- WAITING OVERLAY -->
  <div class="mp-waiting-overlay hidden" id="mp-waiting-overlay">
    <div class="big-spinner"></div>
    <div class="wait-text">⏳ Đang chờ người chơi thứ 2...</div>
    <button onclick="leaveMpRoom()" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 20px;border-radius:10px;font-weight:400;cursor:pointer;font-family:'Science Gothic', sans-serif;font-size:13px;">Rời phòng</button>
  </div>

  <!-- TOAST -->
  <div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none"></div>

  <!-- BACKGROUND PARTICLES -->
  <script>
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let particles = [];
    function resizeBg() { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
    resizeBg(); window.addEventListener('resize', resizeBg);
    for (let i = 0; i < 30; i++) particles.push({ x: Math.random()*bgCanvas.width, y: Math.random()*bgCanvas.height, vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.4, r:Math.random()*1.5+0.5 });
    function drawBg() {
      bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
      particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; if(p.x<0)p.x=bgCanvas.width; if(p.x>bgCanvas.width)p.x=0; if(p.y<0)p.y=bgCanvas.height; if(p.y>bgCanvas.height)p.y=0; bgCtx.beginPath(); bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2); bgCtx.fillStyle='rgba(56,189,248,0.4)'; bgCtx.fill(); });
      requestAnimationFrame(drawBg);
    }
    drawBg();
  </script>

  <script src="../../bottom-nav.js"></script>
  <script type="module" src="catte-mp.js"></script>
</body>
</html>
