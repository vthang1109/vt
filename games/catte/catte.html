<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VTWorld — Cát Tê 4 Người</title>
  <link rel="stylesheet" href="../../style.css"/>
  <link rel="stylesheet" href="../../cards.css"/>
  <link rel="stylesheet" href="../../quests.css"/>
  <link rel="stylesheet" href="../../status-bar.css"/>
  <link rel="stylesheet" href="catte.css"/>
  <script src="../../top-nav.js"></script>
  <script src="../../bottom-nav.js"></script>
  <script src="../../fullscreen.js"></script>
  <script src="../../admin-toggle.js"></script>
  <script type="module" src="../../quests.js"></script>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div id="top-nav-root"></div>
  <div class="ct-wrap">

    <!-- ===== SPLASH / MENU ===== -->
    <div id="ct-menu" class="ct-screen active">
      <div class="ct-floating-card ct-fc-1">🂠</div>
      <div class="ct-floating-card ct-fc-2">🂱</div>
      <div class="ct-floating-card ct-fc-3">🃁</div>

      <div class="ct-logo"><img src="../../assets/icons/catte.png" alt="Cát Tê" class="ct-logo-img"/></div>
      <h1 class="ct-title">Cát Tê</h1>
      <p class="ct-sub">6 lá · 6 vòng · Cùng chất lớn hơn hoặc úp bài · Vào tùng</p>

      <div class="ct-menu-card">
        <div class="ct-menu-bet-row">
          <input type="number" id="ct-bet-input-menu" value="100" min="10" step="10"/>
          <button class="ct-play-btn" id="ct-play-btn">
            <span class="ct-play-icon">▶</span>
            Bắt Đầu
          </button>
        </div>
      </div>
    </div>

    <!-- STATUS BAR -->
    <div class="bc-status" id="bc-status" style="display:none">
      <span class="stat-bet" id="ct-bet">0</span>
      <div class="stat-score-wrap">
        <span class="stat-score" id="ct-score">--</span>
        <span class="stat-score-sub" id="ct-score-sub"></span>
      </div>
      <span class="stat-profit zero" id="ct-profit">+0</span>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="ct-screen" style="display:none">
      <div class="table-area">
        <div class="ct-round-display" id="ct-round-display">Vòng <span id="ct-round-num">1</span>/4</div>
        <div class="seat seat-top" id="seat-2">
          <div class="seat-ring">
            <svg class="seat-timer" viewBox="0 0 40 40"><circle class="seat-timer-bg" cx="20" cy="20" r="18"/><circle class="seat-timer-fg" cx="20" cy="20" r="18"/></svg>
            <div class="seat-tung-badge" id="ct-tung-2" style="display:none">Tùng</div>
            <div class="seat-badge">
              <div class="seat-name">Hoa</div>
              <div class="seat-count" id="ct-count-2">6 lá</div>
            </div>
          </div>
          <div class="seat-status" id="ct-status-2"></div>
        </div>
        <div class="seat seat-left" id="seat-1">
          <div class="seat-ring">
            <svg class="seat-timer" viewBox="0 0 40 40"><circle class="seat-timer-bg" cx="20" cy="20" r="18"/><circle class="seat-timer-fg" cx="20" cy="20" r="18"/></svg>
            <div class="seat-tung-badge" id="ct-tung-1" style="display:none">Tùng</div>
            <div class="seat-badge">
              <div class="seat-name">Minh</div>
              <div class="seat-count" id="ct-count-1">6 lá</div>
            </div>
          </div>
          <div class="seat-status" id="ct-status-1"></div>
        </div>
        <div class="seat seat-right" id="seat-3">
          <div class="seat-ring">
            <svg class="seat-timer" viewBox="0 0 40 40"><circle class="seat-timer-bg" cx="20" cy="20" r="18"/><circle class="seat-timer-fg" cx="20" cy="20" r="18"/></svg>
            <div class="seat-tung-badge" id="ct-tung-3" style="display:none">Tùng</div>
            <div class="seat-badge">
              <div class="seat-name">Tuấn</div>
              <div class="seat-count" id="ct-count-3">6 lá</div>
            </div>
          </div>
          <div class="seat-status" id="ct-status-3"></div>
        </div>

        <div class="center-board">
          <div id="table-combo" class="table-combo"></div>
          <div id="result-box" class="result-box" style="display:none"></div>
        </div>
      </div>

      <div class="my-area">
        <div class="seat seat-me" id="seat-0">
          <div class="seat-ring">
            <svg class="seat-timer" viewBox="0 0 40 40"><circle class="seat-timer-bg" cx="20" cy="20" r="18"/><circle class="seat-timer-fg" cx="20" cy="20" r="18"/></svg>
            <div class="seat-badge">
              <div class="seat-name">Bạn</div>
              <div class="seat-count">6 lá</div>
            </div>
          </div>
        </div>
        <div class="ct-my-top">
          <div class="ct-my-tung-badge" id="ct-my-tung-badge" style="display:none"></div>
          <div class="ct-player-info" id="ct-player-info">
            <span id="ct-my-tricks">Thắng: 0</span>
            <span id="ct-my-status"></span>
          </div>
        </div>
        <div class="hand-wrap">
          <div id="my-hand" class="my-hand ct-hand"></div>
        </div>
        <div class="xd-actions">
          <button id="fold-btn" class="btn-hit">Úp bài</button>
          <button id="play-btn" class="btn-deal">Đánh</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" style="display:none"></div>

  <script>
    const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d'); let particles = [];
    function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
    for(let i=0;i<25;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
    (function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(52,211,153,0.4)';ctx.fill()});requestAnimationFrame(loop)})();
    window.showToast=function(msg,type='info'){const c={info:'#38bdf8',success:'#34d399',warn:'#fbbf24',error:'#f87171'};const t=document.createElement('div');t.style.cssText=`pointer-events:all;padding:11px 16px;border-radius:12px;background:rgba(4,20,40,0.97);border:1px solid ${c[type]};color:#e0f2fe;font-size:13px;font-weight:400;font-family:\\\"Science Gothic\\\",sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.5);max-width:280px`;t.innerHTML=msg;toastContainer.appendChild(t);setTimeout(()=>t.remove(),3500)};
  </script>

  <script type="module" src="catte.js"></script>
</body>
</html>
