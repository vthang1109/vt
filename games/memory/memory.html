<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>VTWorld — Memory Card</title>
  <link rel="stylesheet" href="../../style.css"/>
  <link rel="stylesheet" href="../../status-bar.css"/>
  <link rel="stylesheet" href="memory.css"/>
  <link rel="stylesheet" href="../../quests.css"/>
  <script src="../../fullscreen.js"></script>
  <script src="../../admin-toggle.js"></script>
  <script src="../../top-nav.js"></script>
  <script src="../../bottom-nav.js"></script>
  <script type="module" src="../../quests.js"></script>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div><div class="orb orb2"></div>

  <div id="top-nav-root"></div>

  <div class="mem-container">
    <!-- STATUS BAR -->
    <div class="bc-status" id="bc-status" style="display:none">
      <span class="stat-bet" id="mem-left-label">Đơn</span>
      <div class="stat-score-wrap">
        <span class="stat-score" id="mem-matches">0</span>
        <span class="stat-score-sub" id="mem-sub">Cặp tìm được</span>
      </div>
      <span class="stat-profit zero" id="mem-right-label">0s</span>
    </div>

    <!-- MENU SCREEN -->
    <div id="screen-menu" class="mem-screen active">
      <div class="mem-logo">🧠</div>
      <h1 class="mem-title">Memory Card</h1>
      <p class="mem-sub">Lật thẻ tìm cặp giống nhau</p>

      <!-- Grid Size -->
      <div class="mem-option-section">
        <span class="mem-option-label">Kích thước lưới</span>
        <div class="mem-chip-group" id="size-chips">
          <button class="mem-chip" data-size="3">3×3</button>
          <button class="mem-chip active" data-size="4">4×4</button>
          <button class="mem-chip" data-size="5">5×5</button>
          <button class="mem-chip" data-size="6">6×6</button>
        </div>
      </div>

      <!-- Theme -->
      <div class="mem-option-section">
        <span class="mem-option-label">Chủ đề thẻ</span>
        <div class="mem-chip-group" id="theme-chips">
          <button class="mem-chip active" data-theme="animals">🐾 Động vật</button>
          <button class="mem-chip" data-theme="food">🍕 Đồ ăn</button>
          <button class="mem-chip" data-theme="space">🚀 Vũ trụ</button>
        </div>
      </div>

      <!-- Mode Cards -->
      <div class="mem-mode-list">
        <div class="mem-mode-card" onclick="Memory.start('solo')">
          <span class="mem-mode-icon">👤</span>
          <div>
            <div class="mem-mode-name">Chơi đơn</div>
            <div class="mem-mode-desc">1 người · Tìm cặp nhanh nhất</div>
          </div>
          <span class="mem-mode-badge">Chơi ngay</span>
        </div>
        <div class="mem-mode-card" onclick="Memory.start('local')">
          <span class="mem-mode-icon">👥</span>
          <div>
            <div class="mem-mode-name">2 Người</div>
            <div class="mem-mode-desc">Cùng máy · Thay nhau lật · Ai nhiều hơn thắng</div>
          </div>
          <span class="mem-mode-badge">Chơi ngay</span>
        </div>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="screen-game" class="mem-screen">
      <div class="mem-board-wrap">
        <div class="mem-board" id="mem-board"></div>
      </div>

      <div class="mem-controls">
        <button class="mem-back-btn" onclick="Memory.showMenu()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
          Thoát
        </button>
      </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="screen-result" class="mem-screen">
      <div class="mem-res-emoji" id="res-emoji">🏆</div>
      <h2 class="mem-title" id="res-title">Hoàn thành!</h2>
      <div class="mem-res-stats" id="mem-res-stats"></div>
      <div class="mem-res-actions">
        <button class="btn-primary" onclick="Memory.restart()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          Chơi lại
        </button>
        <button class="btn-secondary" onclick="Memory.showMenu()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Menu
        </button>
      </div>
    </div>
  </div>

  <div id="toastContainer" style="display:none"></div>

  <script>
    // Background particles
    const canvas = document.getElementById('bg-canvas');
    if (canvas) {
      const ctx = canvas.getContext('2d');
      let particles = [];
      function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
      for(let i=0;i<30;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
      (function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(56,189,248,0.4)';ctx.fill()});requestAnimationFrame(loop)})();
    }
    window.showToast = window.showToast || function(){};
  </script>

  <script type="module" src="memory.js"></script>
</body>
</html>
