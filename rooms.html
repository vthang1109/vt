<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VTWorld — Phòng chơi</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="rooms.css"/>
  <link rel="stylesheet" href="quests.css"/>
  
  <!-- Sử dụng nav chung -->
  <script src="top-nav.js"></script>
  <script src="bottom-nav.js"></script>
  
  <style>
    /* Fix cứng cho bottom nav */
    .vt-bottom-nav {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      z-index: 99999 !important;
      height: 58px !important;
      background: #0a1020 !important;
      border-top: 2px solid #0288D1 !important;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.8) !important;
    }
    
    /* Đảm bảo content không bị che */
    body {
      padding-bottom: 70px !important;
      padding-top: 60px !important;
    }
    
    /* Override cho top-nav */
    .vt-top-nav {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      z-index: 999 !important;
      height: 56px !important;
      background: rgba(8, 13, 28, 0.97) !important;
      backdrop-filter: blur(16px) !important;
      border-bottom: 1px solid rgba(2, 136, 209, 0.18) !important;
    }
    
    /* Điều chỉnh rooms page */
    .rooms-page {
      min-height: 100vh;
      padding: 20px 16px 60px;
      max-width: 880px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    
    .lobby-page {
      min-height: 100vh;
      padding: 20px 16px 40px;
      max-width: 880px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: flex-start;
    }
    
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Giữ nguyên các style khác từ rooms.css */
    .rooms-hero { text-align: center; margin: 30px 0 26px; animation: fadeUp .6s both; }
    .rooms-hero h1 { font-family:'Orbitron',monospace; font-size: clamp(26px, 6vw, 44px); font-weight:900; color:#e0f2fe; margin-bottom: 6px; }
    .rooms-hero h1 span { color:#a78bfa; text-shadow:0 0 24px rgba(167,139,250,.6); }
    .rooms-hero p { color:#7dd3fc; font-weight:600; font-size:13px; }
    
    .rooms-toolbar { display:flex; gap:12px; justify-content:center; margin-bottom: 36px; flex-wrap:wrap; animation: fadeUp .6s .1s both; }
    .rooms-toolbar button { padding:11px 22px; font-size:14px; }
    
    .rooms-section { animation: fadeUp .6s .15s both; }
    .rs-label { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .rs-name { font-family:'Orbitron',monospace; font-size:12px; font-weight:800; color:#a78bfa; letter-spacing:2px; }
    .rs-line { flex:1; height:1px; background: linear-gradient(90deg, rgba(167,139,250,.35), transparent); }
    
    .rooms-list { display:flex; flex-direction:column; gap:10px; }
    .rm-empty { text-align:center; color:#64748b; padding:36px 12px; font-weight:600; font-size:14px; }
    
    .rm-card { display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:16px; background:rgba(167,139,250,.04); border:1px solid rgba(167,139,250,.18); transition: all .25s; }
    .rm-card:hover { transform: translateY(-2px); border-color: rgba(167,139,250,.4); box-shadow: 0 12px 30px rgba(167,139,250,.12); }
    .rm-icon { width:48px; height:48px; border-radius:14px; background: rgba(167,139,250,.12); display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
    .rm-info { flex:1; min-width:0; }
    .rm-name { font-weight:800; font-size:15px; color:#e0f2fe; }
    .rm-meta { font-size:12px; color:#94a3b8; font-weight:600; margin-top:3px; display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
    .rm-dot { color:#475569; }
    .rm-action { display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }
    .rm-code { font-family:'Orbitron',monospace; color:#a78bfa; font-weight:800; font-size:12px; letter-spacing:1px; }
    .btn-join { padding:8px 18px; border-radius:10px; border:none; background: linear-gradient(135deg, #a78bfa, #7c3aed); color:#fff; font-weight:800; font-size:13px; cursor:pointer; font-family:'Nunito',sans-serif; box-shadow: 0 6px 16px rgba(124,58,237,.4); }
    .btn-join:hover:not(:disabled) { transform: translateY(-1px); }
    .btn-join:disabled { opacity:.5; cursor:not-allowed; background: #334155; box-shadow:none; }
    
    .rm-label { display:block; color:#7dd3fc; font-weight:700; font-size:12px; margin: 14px 0 6px; letter-spacing: .3px; }
    
    /* Lobby styles */
    .lobby-card { flex: 1 1 420px; background: linear-gradient(160deg, rgba(15,23,42,.85), rgba(7,16,32,.85)); border:1px solid rgba(167,139,250,.25); border-radius:22px; padding:20px; animation: fadeUp .4s both; }
    .lobby-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .lobby-back { background:none; border:none; color:#a78bfa; font-weight:800; font-size:13px; cursor:pointer; font-family:'Nunito',sans-serif; }
    .lobby-back:hover { color:#c4b5fd; }
    .lobby-code { font-family:'Orbitron',monospace; color:#a78bfa; font-weight:900; font-size:14px; letter-spacing:2px; padding:5px 12px; border-radius:999px; background: rgba(167,139,250,.1); border:1px solid rgba(167,139,250,.3); }
    
    .lobby-title-wrap { margin-bottom:18px; }
    .lobby-title-wrap h2 { color:#e0f2fe; font-weight:900; font-size:22px; margin-bottom:4px; }
    .lobby-meta { color:#94a3b8; font-size:13px; font-weight:600; display:flex; gap:6px; align-items:center; }
    .lobby-dot { color:#475569; }
    
    .lobby-members { display:flex; flex-direction:column; gap:9px; margin-bottom:18px; }
    .lobby-member { display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:14px; background: rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); }
    .lobby-member.ready { background: rgba(52,211,153,.07); border-color: rgba(52,211,153,.3); }
    .lobby-member.empty { opacity:.45; border-style:dashed; }
    .lm-avatar { width:38px; height:38px; border-radius:50%; background: linear-gradient(135deg, #a78bfa, #7c3aed); display:flex; align-items:center; justify-content:center; font-weight:900; color:#fff; font-size:15px; flex-shrink:0; }
    .lobby-member.ready .lm-avatar { background: linear-gradient(135deg, #34d399, #059669); }
    .lobby-member.empty .lm-avatar { background: rgba(255,255,255,.05); color:#475569; }
    .lm-info { flex:1; min-width:0; }
    .lm-name { font-weight:800; color:#e0f2fe; font-size:14px; }
    .lm-you { color:#fbbf24; font-size:11px; font-weight:700; }
    .lm-status { font-size:11.5px; color:#94a3b8; font-weight:600; margin-top:2px; }
    
    .lobby-actions { display:flex; gap:10px; }
    .btn-ready, .btn-start { flex:1; padding:12px; border-radius:12px; border:none; cursor:pointer; font-weight:800; font-size:14px; font-family:'Nunito',sans-serif; transition: all .2s; }
    .btn-ready { background: rgba(52,211,153,.12); color:#34d399; border:1px solid rgba(52,211,153,.4); }
    .btn-ready.on { background: linear-gradient(135deg,#34d399,#059669); color:#fff; }
    .btn-ready:hover { transform: translateY(-1px); }
    .btn-start { background: linear-gradient(135deg,#a78bfa,#7c3aed); color:#fff; box-shadow: 0 8px 20px rgba(124,58,237,.4); }
    .btn-start:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(124,58,237,.55); }
    .btn-start:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }
    
    /* Lobby chat */
    .lobby-chat { flex: 0 1 320px; min-width: 280px; background: linear-gradient(160deg, rgba(15,23,42,.85), rgba(7,16,32,.85)); border:1px solid rgba(56,189,248,.18); border-radius:22px; display:flex; flex-direction:column; height: 480px; max-height: 70vh; overflow:hidden; animation: fadeUp .4s .05s both; }
    .lc-head { padding:13px 16px; border-bottom:1px solid rgba(56,189,248,.12); color:#e0f2fe; font-weight:800; font-size:14px; }
    .lc-msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:7px; scrollbar-width:thin; }
    .lc-sys { text-align:center; color:#64748b; font-size:12px; padding:14px; font-weight:600; }
    .lc-msg { display:flex; flex-direction:column; max-width:85%; }
    .lc-msg.mine { align-self: flex-end; align-items: flex-end; }
    .lc-msg.other { align-self: flex-start; }
    .lc-name { font-size:10.5px; color:#a78bfa; font-weight:700; padding: 0 4px 2px; }
    .lc-bubble { padding:7px 12px; border-radius:14px; font-size:13px; word-break:break-word; line-height:1.4; }
    .lc-msg.mine .lc-bubble { background: linear-gradient(135deg,#a78bfa,#7c3aed); color:#fff; border-bottom-right-radius: 4px; }
    .lc-msg.other .lc-bubble { background: rgba(255,255,255,.06); color:#e0f2fe; border-bottom-left-radius:4px; }
    .lc-input-row { display:flex; gap:8px; padding:10px; border-top:1px solid rgba(56,189,248,.12); }
    .lc-input-row input { flex:1; padding:9px 12px; border-radius:10px; border:1px solid rgba(56,189,248,.2); background: rgba(0,0,0,.3); color:#e0f2fe; font-family:'Nunito',sans-serif; font-size:13px; }
    .lc-input-row input:focus { outline:none; border-color: rgba(167,139,250,.5); }
    .lc-input-row button { padding:9px 14px; border-radius:10px; border:none; background: linear-gradient(135deg,#a78bfa,#7c3aed); color:#fff; cursor:pointer; font-weight:800; font-family:'Nunito',sans-serif; font-size:14px; }
    
    @media (max-width: 720px) {
      .lobby-page { flex-direction: column; }
      .lobby-chat { width:100%; height: 360px; }
    }
    
    /* Modal styles */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99998;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: linear-gradient(160deg, rgba(15,23,42,.98), rgba(7,16,32,.98));
      border: 1px solid rgba(167,139,250,.25);
      border-radius: 22px;
      padding: 24px 28px;
      max-width: 420px;
      width: 90%;
      animation: fadeUp .3s both;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-header span {
      color: #e0f2fe;
      font-weight: 800;
      font-size: 18px;
      font-family: 'Orbitron', monospace;
    }
    .modal-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 22px;
      cursor: pointer;
      transition: color .2s;
    }
    .modal-close:hover { color: #e0f2fe; }
    .input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(167,139,250,.2);
      background: rgba(0,0,0,.3);
      color: #e0f2fe;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      box-sizing: border-box;
    }
    .input:focus { outline: none; border-color: rgba(167,139,250,.5); }
    .btn-primary {
      padding: 11px 22px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: all .2s;
      box-shadow: 0 6px 20px rgba(124,58,237,.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(124,58,237,.5); }
    .btn-secondary {
      padding: 11px 22px;
      border-radius: 12px;
      border: 1px solid rgba(167,139,250,.3);
      background: rgba(167,139,250,.06);
      color: #a78bfa;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: all .2s;
    }
    .btn-secondary:hover { background: rgba(167,139,250,.12); }
  </style>
  
  <script type="module" src="quests.js"></script>
  <script type="module" src="avatar.js"></script>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <!-- Top Nav sẽ được inject tự động bởi top-nav.js -->
  <div id="top-nav-root"></div>

  <!-- Đã bỏ nav cũ -->

  <!-- ===== LIST VIEW ===== -->
  <div id="listView" class="rooms-page">
    <div class="rooms-hero">
      <h1>👥 <span>Phòng chơi</span> nhiều người</h1>
      <p>Tạo phòng riêng · Mời bạn bè · Chiến đấu thật</p>
    </div>

    <div class="rooms-toolbar">
      <button class="btn-primary" onclick="openCreateModal()">➕ Tạo phòng mới</button>
      <button class="btn-secondary" onclick="openJoinByCode()">🔑 Vào bằng mã</button>
    </div>

    <div class="rooms-section">
      <div class="rs-label"><span class="rs-name">PHÒNG ĐANG MỞ</span><div class="rs-line"></div></div>
      <div id="rooms-list" class="rooms-list">
        <div class="rm-empty">Đang tải...</div>
      </div>
    </div>
  </div>

  <!-- ===== LOBBY VIEW ===== -->
  <div id="lobbyView" class="lobby-page" style="display:none">
    <div class="lobby-card">
      <div class="lobby-head">
        <button class="lobby-back" onclick="leaveLobby()">← Rời phòng</button>
        <span class="lobby-code" id="lobby-code">#------</span>
      </div>
      <div class="lobby-title-wrap">
        <h2 id="lobby-title">Phòng</h2>
        <div class="lobby-meta">
          <span id="lobby-game">🎮</span>
          <span class="lobby-dot">·</span>
          <span id="lobby-count">0/0</span>
        </div>
      </div>

      <div class="lobby-members" id="lobby-members"></div>

      <div class="lobby-actions">
        <button class="btn-ready" id="btn-ready" onclick="toggleReady()">✅ Sẵn sàng</button>
        <button class="btn-start" id="btn-start" onclick="startGame()" style="display:none">🚀 Bắt đầu</button>
      </div>
    </div>

    <div class="lobby-chat">
      <div class="lc-head">💬 Chat trong phòng</div>
      <div class="lc-msgs" id="lobby-chat-msgs"></div>
      <div class="lc-input-row">
        <input id="lobby-chat-input" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter')sendLobbyChat()"/>
        <button onclick="sendLobbyChat()">➤</button>
      </div>
    </div>
  </div>

  <!-- ===== CREATE MODAL ===== -->
  <div id="createModal" class="modal-overlay" onclick="if(event.target===this)closeCreateModal()">
    <div class="modal-box" style="max-width:420px">
      <div class="modal-header"><span>➕ Tạo phòng mới</span><button class="modal-close" onclick="closeCreateModal()">✕</button></div>
      <label class="rm-label">Game</label>
      <select id="cr-game" class="input"></select>
      <label class="rm-label">Tên phòng</label>
      <input id="cr-name" class="input" maxlength="40" placeholder="VD: Caro tối thứ 7"/>
      <label class="rm-label">Số người tối đa</label>
      <input id="cr-max" class="input" type="number" min="2" max="8" value="2"/>
      <label class="rm-label">Mật khẩu (tuỳ chọn)</label>
      <input id="cr-pw" class="input" maxlength="20" placeholder="Để trống nếu phòng công khai"/>
      <button class="btn-primary" style="width:100%;margin-top:14px" onclick="doCreateRoom()">🎮 Tạo & Vào phòng</button>
    </div>
  </div>

  <!-- ===== JOIN MODAL ===== -->
  <div id="joinModal" class="modal-overlay" onclick="if(event.target===this)closeJoinModal()">
    <div class="modal-box" style="max-width:380px">
      <div class="modal-header"><span>🔑 Vào bằng mã</span><button class="modal-close" onclick="closeJoinModal()">✕</button></div>
      <label class="rm-label">Mã phòng (6 ký tự)</label>
      <input id="jc-code" class="input" maxlength="6" placeholder="VD: AB23CD" style="text-transform:uppercase;font-family:'Orbitron',monospace;letter-spacing:3px;font-size:18px;text-align:center"/>
      <label class="rm-label">Mật khẩu (nếu có)</label>
      <input id="jc-pw" class="input" maxlength="20" placeholder="Để trống nếu phòng không khoá"/>
      <button class="btn-primary" style="width:100%;margin-top:14px" onclick="doJoinByCode()">Vào phòng</button>
    </div>
  </div>

  <div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none"></div>

  <script>
    // Particle background
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    for (let i = 0; i < 40; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-.5)*.4, vy: (Math.random()-.5)*.4, r: Math.random()*1.5+.5 });
    function drawParticles() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; if(p.x<0)p.x=canvas.width; if(p.x>canvas.width)p.x=0; if(p.y<0)p.y=canvas.height; if(p.y>canvas.height)p.y=0; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle='rgba(56,189,248,0.5)'; ctx.fill(); });
      for(let i=0;i<particles.length;i++) for(let j=i+1;j<particles.length;j++) { const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y, d=Math.sqrt(dx*dx+dy*dy); if(d<100){ ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y); ctx.strokeStyle=`rgba(56,189,248,${0.07*(1-d/100)})`; ctx.lineWidth=.5; ctx.stroke(); } }
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    function showToast(msg, type='info'){
      const colors = { info:'#38bdf8', success:'#34d399', warn:'#fbbf24', error:'#f87171' };
      const t = document.createElement('div');
      t.style.cssText = `pointer-events:all;padding:11px 16px;border-radius:12px;background:rgba(4,20,40,0.97);border:1px solid ${colors[type]||'#38bdf8'};color:#e0f2fe;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.5);max-width:280px`;
      t.innerHTML = msg;
      document.getElementById('toastContainer').appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }
    window.showToast = showToast;
  </script>
  <script type="module" src="rooms.js"></script>
</body>
</html>
