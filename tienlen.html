<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VTWorld — Tiến Lên</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="quests.css"/>
  <link rel="stylesheet" href="xidach.css"/>
  <link rel="stylesheet" href="tienlen.css"/>
  <script src="top-nav.js"></script>
  <script src="bottom-nav.js"></script>
  <script type="module" src="quests.js"></script>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div id="top-nav-root"></div>
  <div class="tl-wrap">

    <!-- STATUS BAR đồng bộ xì dách -->
    <div class="bc-status" id="bc-status" style="display:none">
      <span class="stat-bet" id="tl-bet">0</span>
      <div class="stat-score-wrap">
        <span class="stat-score" id="tl-score">--</span>
        <span class="stat-score-sub" id="tl-score-sub"></span>
      </div>
      <span class="stat-profit zero" id="tl-profit">+0</span>
    </div>

    <!-- MÀN HÌNH SETUP -->
    <div id="setup-screen" class="tl-setup">
      <h1>🃏 Tiến Lên Miền Nam</h1>
      <p class="tl-setup-sub">Bạn đấu với 3 máy · Tứ quý chặt heo lẻ · Đôi heo chặt tứ quý &amp; 3 đôi thông</p>

      <div class="tl-mode-list">
        <button type="button" class="tl-mode-card" data-mode="an_tat">
          <div class="tl-mode-name">Nhất ăn tất</div>
        </button>
        <button type="button" class="tl-mode-card" data-mode="nhi_ba_tu">
          <div class="tl-mode-name">Nhất Nhì Ba Tư</div>
        </button>
        <button type="button" class="tl-mode-card tl-mode-card-wide" data-mode="dem_la">
          <div class="tl-mode-name">Đếm lá</div>
        </button>
      </div>

      <div class="tl-start-panel">
        <div class="tl-bet-row">
          <label for="tl-bet-input">Mức cược</label>
          <input type="number" id="tl-bet-input" value="100" min="10" step="10"/>
        </div>

        <button id="start-btn" class="btn-deal tl-start-btn" disabled>BẮT ĐẦU</button>
      </div>
    </div>

    <!-- MÀN HÌNH VÁN ĐẤU -->
    <div id="game-screen" style="display:none">
      <div class="table-area">
        <div class="seat seat-top" id="seat-2">
          <div class="seat-ring">
            <svg class="seat-timer" viewBox="0 0 40 40"><circle class="seat-timer-bg" cx="20" cy="20" r="18"/><circle class="seat-timer-fg" cx="20" cy="20" r="18"/></svg>
            <div class="seat-badge">
              <div class="seat-name">Hoa</div>
              <div class="seat-count">13 lá</div>
            </div>
          </div>
        </div>
        <div class="seat seat-left" id="seat-1">
          <div class="seat-ring">
            <svg class="seat-timer" viewBox="0 0 40 40"><circle class="seat-timer-bg" cx="20" cy="20" r="18"/><circle class="seat-timer-fg" cx="20" cy="20" r="18"/></svg>
            <div class="seat-badge">
              <div class="seat-name">Minh</div>
              <div class="seat-count">13 lá</div>
            </div>
          </div>
        </div>
        <div class="seat seat-right" id="seat-3">
          <div class="seat-ring">
            <svg class="seat-timer" viewBox="0 0 40 40"><circle class="seat-timer-bg" cx="20" cy="20" r="18"/><circle class="seat-timer-fg" cx="20" cy="20" r="18"/></svg>
            <div class="seat-badge">
              <div class="seat-name">Tuấn</div>
              <div class="seat-count">13 lá</div>
            </div>
          </div>
        </div>

        <div class="center-board">
          <div id="table-combo" class="table-combo"></div>
          <div id="result-box" class="result-box" style="display:none"></div>
        </div>

      </div>

      <div class="my-area">
        <div class="seat seat-me" id="seat-0"></div>
        <div class="hand-wrap">
          <button id="sort-btn" class="sort-fab">Xếp</button>
          <div id="my-hand" class="my-hand"></div>
        </div>
        <div class="xd-actions">
          <button id="pass-btn" class="btn-hit">Bỏ lượt</button>
          <button id="play-btn" class="btn-deal">Đánh</button>
        </div>
        <div class="xd-bet-row" id="tl-round-bet-row" style="display:none">
          <label>Đặt cược:</label>
          <input id="tl-round-bet-input" type="number" min="10" step="10" value="100"/>
          <button onclick="window.tlGame.startNewRound()">✅ Đặt cược</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" style="display:none"></div>

  <script>
    const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d'); let particles = [];
    function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
    for(let i=0;i<25;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
    (function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(52,211,153,0.4)';ctx.fill()});requestAnimationFrame(loop)})();
  </script>

  <script type="module" src="tienlen.js"></script>
</body>
</html>
