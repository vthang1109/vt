<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>VTWorld — Xúc Xắc</title>
  <link rel="stylesheet" href="../../style.css"/>
  <link rel="stylesheet" href="../../games.css"/>
  <link rel="stylesheet" href="../../status-bar.css"/>
  <link rel="stylesheet" href="dice.css"/>
  <script src="../../top-nav.js"></script>
  <script src="../../bottom-nav.js"></script>
  <script src="../../fullscreen.js"></script>
  <script src="../../admin-toggle.js"></script>
</head>
<body data-bottom-nav="apps">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div id="top-nav-root"></div>

  <div class="dice-page">
    <div class="dice-hero">
      <h1>🎲 <span>Xúc Xắc</span></h1>
      <p>Lắc xúc xắc · Đoán số · Thử vận may</p>
    </div>

    <!-- STATUS BAR -->
    <div class="dice-status" id="dice-status">
      <span class="stat-bet" id="dice-count">0</span>
      <div class="stat-score-wrap">
        <span class="stat-score" id="dice-msg">Lắc nào!</span>
      </div>
      <span class="stat-profit zero" id="dice-stat">—</span>
    </div>

    <!-- KHU VỰC XÚC XẮC -->
    <div class="dice-area">
      <div class="dice-container" id="dice-container">
        <div class="dice-face" id="dice-result">1</div>
        <div class="dice-face dice-face-2" id="dice-result-2">2</div>
      </div>
      <div class="dice-hint">Ấn để lắc!</div>
    </div>

    <!-- CHẾ ĐỘ CHƠI -->
    <div class="dice-modes" id="dice-modes">
      <button class="dice-mode-btn active" data-mode="single" onclick="Dice.setMode('single')">
        <span class="dm-icon">🎲</span>
        <span class="dm-name">1 Xúc Xắc</span>
      </button>
      <button class="dice-mode-btn" data-mode="double" onclick="Dice.setMode('double')">
        <span class="dm-icon">🎲🎲</span>
        <span class="dm-name">2 Xúc Xắc</span>
      </button>
      <button class="dice-mode-btn" data-mode="guess" onclick="Dice.setMode('guess')">
        <span class="dm-icon">🔮</span>
        <span class="dm-name">Đoán Số</span>
      </button>
    </div>

    <!-- KHU VỰC ĐOÁN SỐ -->
    <div class="dice-guess" id="dice-guess" style="display:none">
      <div class="dg-label">Bạn đoán tổng 2 xúc xắc là?</div>
      <div class="dg-grid" id="dg-grid">
        <button class="dg-btn" data-val="2">2</button>
        <button class="dg-btn" data-val="3">3</button>
        <button class="dg-btn" data-val="4">4</button>
        <button class="dg-btn" data-val="5">5</button>
        <button class="dg-btn" data-val="6">6</button>
        <button class="dg-btn" data-val="7">7</button>
        <button class="dg-btn" data-val="8">8</button>
        <button class="dg-btn" data-val="9">9</button>
        <button class="dg-btn" data-val="10">10</button>
        <button class="dg-btn" data-val="11">11</button>
        <button class="dg-btn" data-val="12">12</button>
      </div>
    </div>

    <!-- LỊCH SỬ -->
    <div class="dice-history" id="dice-history">
      <div class="dh-header">
        <span>📜 Lịch sử</span>
        <button class="dh-clear" id="dh-clear">✕ Xóa</button>
      </div>
      <div class="dh-list" id="dh-list">
        <div class="dh-empty">Chưa có lần lắc nào</div>
      </div>
    </div>
  </div>

  <div id="toastContainer" style="display:none"></div>

  <script>
    // Particles
    const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d'); let particles = [];
    function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
    for(let i=0;i<25;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
    (function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(251,191,36,0.35)';ctx.fill()});requestAnimationFrame(loop)})();
    window.showToast=function(msg,type='info'){const c={info:'#38bdf8',success:'#34d399',warn:'#fbbf24',error:'#f87171'};const t=document.createElement('div');t.style.cssText=`pointer-events:all;padding:11px 16px;border-radius:12px;background:rgba(4,20,40,0.97);border:1px solid ${c[type]};color:#e0f2fe;font-size:13px;font-weight:400;font-family:"Science Gothic",sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.5);max-width:280px`;t.innerHTML=msg;document.getElementById('toastContainer').appendChild(t);setTimeout(()=>t.remove(),3500)};
  </script>
  <script src="dice.js"></script>
</body>
</html>
