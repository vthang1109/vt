<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>VTWorld — Karaoke</title>
  <link rel="stylesheet" href="../../style.css"/>
  <link rel="stylesheet" href="../../games.css"/>
  <link rel="stylesheet" href="../../status-bar.css"/>
  <link rel="stylesheet" href="karaoke.css"/>
  <script src="../../top-nav.js"></script>
  <script src="../../bottom-nav.js"></script>
  <script src="../../fullscreen.js"></script>
  <script src="../../admin-toggle.js"></script>
</head>
<body data-bottom-nav="apps">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div id="top-nav-root"></div>

  <div class="kr-page">
    <div class="kr-hero">
      <h1>🎤 <span>Karaoke</span></h1>
      <p>Tìm lời bài hát · Hát cùng nhau · Vui nhộn</p>
    </div>

    <!-- STATUS BAR -->
    <div class="kr-status" id="kr-status">
      <span class="stat-bet" id="kr-count">0</span>
      <div class="stat-score-wrap">
        <span class="stat-score" id="kr-msg">Tìm bài hát</span>
      </div>
      <span class="stat-profit zero" id="kr-status-icon">🎤</span>
    </div>

    <!-- TÌM KIẾM -->
    <div class="kr-search-section">
      <div class="kr-search-row">
        <input class="kr-input" id="kr-search-input" placeholder="🔍 Nhập tên bài hát..." onkeydown="if(event.key==='Enter')Karaoke.search()"/>
        <button class="kr-search-btn" onclick="Karaoke.search()">🔍</button>
      </div>
    </div>

    <!-- DANH SÁCH GỢI Ý / KẾT QUẢ -->
    <div class="kr-content" id="kr-content">
      <div class="kr-section-label">🎵 Bài hát gợi ý</div>
      <div class="kr-suggestions" id="kr-suggestions"></div>
    </div>

    <!-- LYRICS VIEW -->
    <div class="kr-lyrics-section" id="kr-lyrics-section" style="display:none">
      <div class="kr-lyrics-header">
        <button class="kr-back-btn" onclick="Karaoke.backToList()">←</button>
        <div>
          <div class="kr-song-title" id="kr-song-title"></div>
          <div class="kr-song-artist" id="kr-song-artist"></div>
        </div>
      </div>
      <div class="kr-lyrics-scroll" id="kr-lyrics-scroll">
        <div class="kr-lyrics" id="kr-lyrics"></div>
      </div>
      <div class="kr-lyrics-actions">
        <button class="kr-lyrics-btn" onclick="Karaoke.scrollToTop()">⬆️ Lên đầu</button>
        <button class="kr-lyrics-btn" onclick="Karaoke.toggleDarkness()">🌙 Tối</button>
        <button class="kr-lyrics-btn" onclick="Karaoke.toggleFontSize()">📏 Cỡ chữ</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" style="display:none"></div>

  <script>
    const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d'); let particles = [];
    function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
    for(let i=0;i<25;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
    (function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(244,114,182,0.35)';ctx.fill()});requestAnimationFrame(loop)})();
    window.showToast=function(msg,type='info'){const c={info:'#38bdf8',success:'#34d399',warn:'#fbbf24',error:'#f87171'};const t=document.createElement('div');t.style.cssText=`pointer-events:all;padding:11px 16px;border-radius:12px;background:rgba(4,20,40,0.97);border:1px solid ${c[type]};color:#e0f2fe;font-size:13px;font-weight:400;font-family:"Science Gothic",sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.5);max-width:280px`;t.innerHTML=msg;document.getElementById('toastContainer').appendChild(t);setTimeout(()=>t.remove(),3500)};
  </script>
  <script src="karaoke.js"></script>
</body>
</html>
