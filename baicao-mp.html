<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>VTWorld — Bài Cào Online</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="quests.css"/>
  <link rel="stylesheet" href="cards.css"/>
  <link rel="stylesheet" href="baicao-mp.css"/>
  <script src="top-nav.js"></script>
  <script src="bottom-nav.js"></script>
  <script type="module" src="quests.js"></script>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div id="top-nav-root"></div>

  <div class="bc-wrap">
    <!-- STATUS BAR -->
    <div class="bc-status" id="bc-status">
      <span class="stat-bet" id="bc-left"></span>
      <span class="stat-score-wrap">
        <span class="stat-score" id="bc-mid"></span>
      </span>
      <span class="stat-profit zero" id="bc-right"></span>
    </div>

    <!-- BET CONFIRM ROW (chỉ host hiện để chọn mức cược) -->
    <div class="bc-bet-row" id="bc-bet-row" style="display:none">
      <label>Mức cược:</label>
      <select id="bc-bet-select">
        <option value="50">50</option>
        <option value="100" selected>100</option>
        <option value="200">200</option>
        <option value="500">500</option>
        <option value="1000">1.000</option>
        <option value="2000">2.000</option>
        <option value="5000">5.000</option>
        <option value="10000">10.000</option>
      </select>
      <button id="btn-confirm-bet" onclick="confirmBet()">Xác nhận</button>
    </div>

    <!-- TABLE -->
    <div class="bc-table" id="bc-table"></div>

    <!-- ACTIONS -->
    <div class="bc-actions" id="bc-actions"></div>
  </div>

  <script>
    // Particle
    const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d'); let particles = [];
    function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
    for(let i=0;i<25;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
    (function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(52,211,153,0.4)';ctx.fill()});requestAnimationFrame(loop)})();
    
    window.showToast = function(msg, type) {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const colors = { info: '#38bdf8', success: '#34d399', warn: '#fbbf24', error: '#f87171' };
      const t = document.createElement('div');
      t.style.cssText = `pointer-events:all;padding:11px 16px;border-radius:12px;background:rgba(4,20,40,0.97);border:1px solid ${colors[type] || '#38bdf8'};color:#e0f2fe;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.5);max-width:280px`;
      t.textContent = msg;
      container.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    };
  </script>

  <div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none"></div>

  <script type="module" src="baicao-mp.js"></script>
</body>
</html>
