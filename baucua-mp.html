<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>VTWorld — Bầu Cua Online</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="quests.css"/>
  <style>
    .bc-wrap { min-height:100vh; padding:14px 12px 40px; max-width:760px; margin:0 auto; position:relative; z-index:1; }

    /* ===== STATUS BAR ===== */
    .bc-status {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 14px;
      border-radius:12px;
      margin-bottom:12px;
      font-weight:700;
      font-size:13px;
      background:rgba(56,189,248,.05);
      border:1px solid rgba(56,189,248,.1);
      min-height:42px;
      transition: all 0.3s;
    }
    .bc-status.rolling {
      background:rgba(251,191,36,.12);
      border-color:rgba(251,191,36,.5);
      box-shadow: 0 0 30px rgba(251,191,36,.15);
    }
    .bc-status .bc-round {
      color:#7dd3fc;
      font-weight:800;
      transition: color 0.3s;
    }
    .bc-status.rolling .bc-round {
      color:#fbbf24;
    }
    .bc-status .bc-profit {
      font-family:'Orbitron',monospace;
      font-weight:900;
      font-size:15px;
    }
    .bc-status .bc-profit.positive { color:#34d399; }
    .bc-status .bc-profit.negative { color:#f87171; }
    .bc-status .bc-profit.zero { color:#94a3b8; }
    .bc-status.rolling .bc-profit {
      color:#fbbf24 !important;
    }

    .bc-dice { display:flex; justify-content:center; gap:14px; margin:18px 0; }
    .bc-die { width:80px; height:80px; border-radius:18px; background:linear-gradient(160deg,#fef3c7,#fbbf24); display:flex; align-items:center; justify-content:center; font-size:46px; box-shadow: 0 8px 24px rgba(251,191,36,.4), inset 0 -3px 8px rgba(0,0,0,.15); transition:all .3s; }
    .bc-die.rolling { animation: bcRoll .12s infinite linear; }
    @keyframes bcRoll { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
    .bc-die.win { box-shadow: 0 8px 24px rgba(52,211,153,.6), inset 0 -3px 8px rgba(0,0,0,.15), 0 0 0 3px #34d399; }

    /* Board - full width */
    .bc-board {
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:10px;
      margin-bottom:14px;
    }
    @media (min-width: 600px){ 
      .bc-board { grid-template-columns:repeat(6, 1fr); } 
    }
    
    .bc-tile { 
      background:rgba(15,23,42,0.6);
      border:2px solid rgba(251,191,36,0.1);
      border-radius:16px;
      padding:14px 5px;
      cursor:pointer;
      transition:all 0.25s;
      text-align:center;
      font-family:'Nunito',sans-serif;
      font-weight:700;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:80px;
      position:relative;
    }
    .bc-tile:hover { background:rgba(251,191,36,0.08); border-color:#fbbf24; }
    
    .bc-tile.has-bet {
      border-color: #fbbf24 !important;
      box-shadow: 0 0 24px rgba(251,191,36,0.35), inset 0 0 30px rgba(251,191,36,0.05) !important;
      transform: translateY(-3px);
    }
    
    .bc-tile.hot { 
      background:linear-gradient(135deg,rgba(52,211,153,.18),rgba(5,150,105,.06)); 
      border-color:rgba(52,211,153,.6); 
      box-shadow: 0 0 24px rgba(52,211,153,.3); 
    }
    .bc-tile-icon { font-size:38px; display:block; }
    .bc-tile-bet {
      margin-top:8px;
      background:#1e293b;
      color:#fbbf24;
      padding:3px 8px;
      border-radius:10px;
      font-size:13px;
      font-weight:800;
      font-family:'Orbitron',sans-serif;
      min-height:22px;
    }
    .bc-tile.disabled { opacity:.55; cursor:not-allowed; }
    .bc-tile.disabled:hover { transform:none; background:rgba(15,23,42,0.6); border-color:rgba(251,191,36,0.1); }
    .bc-tile-mult { 
      position:absolute; 
      top:4px; 
      right:6px; 
      font-family:'Orbitron',monospace; 
      font-weight:900; 
      color:#34d399; 
      font-size:12px; 
      text-shadow:0 0 8px rgba(52,211,153,.6); 
    }

    /* Hàng chip + nút - CÙNG 1 HÀNG NGANG */
    .bc-bottom-row {
      display:flex;
      gap:8px;
      align-items:center;
      margin-bottom:14px;
      flex-wrap:wrap;
      justify-content:center;
    }
    .bc-chip {
      padding:10px 14px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.1);
      background:#1e293b;
      color:#fff;
      font-weight:700;
      cursor:pointer;
      font-family:'Orbitron',sans-serif;
      font-size:13px;
      transition:all .2s;
      text-align:center;
      min-width:50px;
      flex-shrink:0;
    }
    .bc-chip:hover { border-color:rgba(251,191,36,0.5); }
    .bc-chip.active { 
      background:linear-gradient(135deg, #fbbf24, #f59e0b);
      border-color:#fff;
      box-shadow:0 0 12px #fbbf24;
      color:#1e293b;
    }

    /* Nút Xoá, Lắc, Mới - style riêng */
    .btn-action {
      padding:10px 16px;
      border-radius:10px;
      border:none;
      cursor:pointer;
      font-weight:800;
      font-family:'Nunito',sans-serif;
      font-size:13px;
      white-space:nowrap;
      flex-shrink:0;
    }
    .btn-clear { background:rgba(255,255,255,.08); color:#cbd5e1; }
    .btn-roll { background:linear-gradient(135deg,#f87171,#dc2626); color:#fff; box-shadow:0 4px 12px rgba(220,38,38,.4); }
    .btn-roll:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; }
    .btn-next { background:linear-gradient(135deg,#a78bfa,#7c3aed); color:#fff; }

    .bc-players { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; margin-top:14px; }
    .bc-pl { padding:9px 12px; border-radius:12px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); transition:all .3s; position:relative; }
    .bc-pl.win { border-color:rgba(52,211,153,.6); box-shadow: 0 0 20px rgba(52,211,153,.3); background:rgba(52,211,153,.08); }
    .bc-pl.lose { border-color:rgba(248,113,113,.4); box-shadow: 0 0 20px rgba(248,113,113,.2); background:rgba(248,113,113,.06); }
    .bc-pl-name { font-weight:800; color:#e0f2fe; font-size:12.5px; }
    .bc-pl-bet { font-size:11px; color:#fbbf24; font-weight:700; margin-top:2px; }
    .bc-pl-result { font-size:12px; font-weight:800; margin-top:2px; }
    .bc-pl-result.win { color:#34d399; }
    .bc-pl-result.lose { color:#f87171; }
    .bc-pl .pl-status { position:absolute; top:4px; right:6px; font-size:14px; }

    /* Nav override - room id style */
    .vt-top-nav .vt-nav-logo .vt-room-id {
      font-family: 'Orbitron', monospace;
      color: #fbbf24;
      font-weight: 900;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(251,191,36,.1);
      border: 1px solid rgba(251,191,36,.4);
      display: inline-block;
      letter-spacing: 0.5px;
    }
    .vt-top-nav .vt-nav-logo .vt-room-id .room-icon {
      margin-right: 6px;
    }

    @media (max-width: 480px) {
      .bc-status { flex-direction:row; flex-wrap:wrap; gap:4px; font-size:12px; }
      .bc-bottom-row { 
        flex-direction:row; 
        flex-wrap:wrap;
        justify-content:center;
        gap:6px;
      }
      .bc-chip { 
        min-width:40px; 
        padding:8px 10px; 
        font-size:11px; 
        flex:0 1 auto;
      }
      .btn-action {
        padding:8px 12px; 
        font-size:11px; 
        flex:0 1 auto;
      }
      .bc-tile { min-height:65px; padding:10px 4px; }
      .bc-tile-icon { font-size:30px; }
    }
  </style>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <!-- TOP NAV -->
  <div id="top-nav-root"></div>
  <script src="top-nav.js"></script>

  <div class="bc-wrap">
    <!-- STATUS BAR -->
    <div class="bc-status" id="bc-status">
      <span class="bc-round" id="bc-round">🔄 Đang tải...</span>
      <span class="bc-profit zero" id="bc-profit">+0đ</span>
    </div>

    <div class="bc-dice" id="bc-dice">
      <div class="bc-die">?</div>
      <div class="bc-die">?</div>
      <div class="bc-die">?</div>
    </div>

    <!-- Board full width -->
    <div class="bc-board" id="bc-board"></div>

    <!-- Hàng chip + nút -->
    <div class="bc-bottom-row">
      <button class="bc-chip" data-v="100">100</button>
      <button class="bc-chip active" data-v="500">500</button>
      <button class="bc-chip" data-v="1000">1K</button>
      <button class="bc-chip" data-v="5000">5K</button>
      <button class="btn-action btn-clear" onclick="clearMyBets()">🗑 Xoá</button>
      <button class="btn-action btn-roll" id="btn-roll" onclick="hostRoll()" style="display:none">🎲 Lắc</button>
      <button class="btn-action btn-next" id="btn-next" onclick="hostNext()" style="display:none">▶ Mới</button>
    </div>

    <div class="bc-players" id="bc-players"></div>
  </div>

  <div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none"></div>

  <!-- BOTTOM NAV -->
  <script src="bottom-nav.js"></script>

  <script>
    const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d'); let particles = [];
    function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
    for(let i=0;i<25;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
    (function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(251,191,36,0.4)';ctx.fill()});requestAnimationFrame(loop)})();
    window.showToast=function(msg,type='info'){};
  </script>
  <script type="module" src="baucua-mp.js"></script>
</body>
</html>
