<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VTWorld — Caro</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="caro.css"/>
  <link rel="stylesheet" href="quests.css"/>
  <script type="module" src="quests.js"></script>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div id="top-nav-root"></div>
  <script src="top-nav.js"></script>

  <div class="caro-container">

    <!-- CHỌN CHẾ ĐỘ -->
    <div id="screen-mode" class="caro-screen">
      <h2 class="caro-screen-title">♟️ Chọn chế độ chơi</h2>
      <div class="mode-grid">
        <div class="mode-card" onclick="selectMode('tictactoe')">
          <span class="mode-emoji">⭕</span>
          <span class="mode-name">TicTacToe</span>
          <span class="mode-desc">Bàn 3×3 · Thắng 3 ô</span>
        </div>
        <div class="mode-card" onclick="selectMode('caro')">
          <span class="mode-emoji">♟️</span>
          <span class="mode-name">Caro</span>
          <span class="mode-desc">Bàn 15×15 · Thắng 5 ô</span>
        </div>
      </div>
    </div>

    <!-- CHỌN KIỂU CHƠI -->
    <div id="screen-type" class="caro-screen hidden">
      <h2 class="caro-screen-title" id="type-title">Chọn kiểu chơi</h2>
      <div class="mode-grid">
        <div class="mode-card" onclick="selectType('bot')">
          <span class="mode-emoji">🤖</span>
          <span class="mode-name">vs Máy</span>
          <span class="mode-desc">Chơi một mình</span>
        </div>
        <div class="mode-card" onclick="selectType('local')">
          <span class="mode-emoji">👥</span>
          <span class="mode-name">2 Người</span>
          <span class="mode-desc">Cùng 1 màn hình</span>
        </div>
      </div>
      <button class="caro-back-btn" onclick="goBack('screen-mode')">← Quay lại</button>
    </div>

    <!-- CHỌN ĐỘ KHÓ (vs Bot) -->
    <div id="screen-difficulty" class="caro-screen hidden">
      <h2 class="caro-screen-title">Chọn độ khó</h2>
      <div class="mode-grid">
        <div class="mode-card" onclick="startGame('easy')">
          <span class="mode-emoji">😊</span>
          <span class="mode-name">Dễ</span>
          <span class="mode-desc">Máy đánh ngẫu nhiên</span>
        </div>
        <div class="mode-card" onclick="startGame('medium')">
          <span class="mode-emoji">😤</span>
          <span class="mode-name">Trung bình</span>
          <span class="mode-desc">Máy biết chặn</span>
        </div>
        <div class="mode-card" onclick="startGame('hard')">
          <span class="mode-emoji">😈</span>
          <span class="mode-name">Khó</span>
          <span class="mode-desc">AI thông minh</span>
        </div>
      </div>
      <button class="caro-back-btn" onclick="goBack('screen-type')">← Quay lại</button>
    </div>

    <!-- GAME BOARD -->
    <div id="screen-game" class="caro-screen hidden">
      <div class="caro-header">
        <div class="caro-players">
          <div class="player-tag" id="player1-tag">
            <span class="player-symbol x">✕</span>
            <span id="player1-name">Bạn</span>
          </div>
          <div class="caro-score">
            <span id="score-p1">0</span>
            <span class="score-sep">:</span>
            <span id="score-p2">0</span>
          </div>
          <div class="player-tag right" id="player2-tag">
            <span id="player2-name">Máy</span>
            <span class="player-symbol o">○</span>
          </div>
        </div>
        <div class="caro-status" id="caro-status">⚔️ Lượt của bạn</div>
      </div>

      <div class="caro-board-wrap">
        <canvas id="caro-canvas"></canvas>
      </div>

      <div class="caro-controls">
        <button class="caro-btn" onclick="restartGame()">🔄 Ván mới</button>
        <button class="caro-btn" onclick="goToModeSelect()">🏠 Đổi chế độ</button>
      </div>
    </div>

  </div>

  <!-- RESULT MODAL -->
  <div id="result-modal" class="result-modal hidden">
    <div class="result-box">
      <div class="result-emoji" id="result-emoji">🏆</div>
      <div class="result-title" id="result-title">Bạn thắng!</div>
      <div class="result-pts" id="result-pts"></div>
      <button class="caro-btn green" onclick="restartGame()">🔄 Chơi lại</button>
      <button class="caro-btn" onclick="goToModeSelect()">🏠 Đổi chế độ</button>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="caro-toast"></div>

  <script src="bottom-nav.js"></script>
  <script type="module" src="caro.js"></script>
</body>
</html>
