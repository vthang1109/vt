<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VTWorld — Cờ Tướng</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="quests.css"/>
  <link rel="stylesheet" href="xiangqi.css"/>
  <script src="top-nav.js"></script>
  <script src="bottom-nav.js"></script>
  <script type="module" src="quests.js"></script>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div id="top-nav-root"></div>
  <div class="xq-wrap">

    <!-- MÀN HÌNH CHỜ: CÀI ĐẶT TRẬN ĐẤU -->
    <div class="xq-setup" id="setup-screen">
      <div class="setup-card">
        <h2 class="setup-title">♟ Cài đặt trận đấu</h2>

        <div class="setup-group">
          <label class="setup-label">Cấp độ</label>
          <div class="level-strip" id="level-strip"></div>
          <div class="level-info" id="level-info"></div>
        </div>

        <div class="setup-group">
          <label class="setup-label">Chọn quân</label>
          <div class="color-choice">
            <button type="button" class="color-btn active" id="color-red" data-color="r">
              <span class="color-piece">帥</span>
              <span class="color-name">Quân Đỏ</span>
              <span class="color-note">Đi trước</span>
            </button>
            <button type="button" class="color-btn" id="color-black" data-color="b">
              <span class="color-piece">將</span>
              <span class="color-name">Quân Đen</span>
              <span class="color-note">Đi sau</span>
            </button>
          </div>
        </div>

        <button class="btn-start" id="start-btn">BẮT ĐẦU</button>
      </div>
    </div>

    <!-- MÀN HÌNH BÀN CỜ -->
    <div id="game-screen" style="display:none">

      <!-- STATUS BAR -->
      <div class="bc-status" id="bc-status">
        <div class="stat-side stat-side-player" id="side-player">
          <div class="side-top">
            <span class="side-avatar" id="side-player-avatar">帥</span>
            <span class="side-label">BẠN</span>
          </div>
          <span class="stat-bet" id="xq-bet-label">
            <span id="xq-bet-value">0</span>
            <small>THƯỞNG</small>
          </span>
        </div>

        <div class="stat-score-wrap">
          <span class="stat-score" id="xq-score">--</span>
          <span class="stat-score-sub" id="xq-score-sub">Lượt đi</span>
        </div>

        <div class="stat-side stat-side-machine" id="side-machine">
          <div class="side-top">
            <span class="side-label">MÁY</span>
            <span class="side-avatar" id="side-machine-avatar">將</span>
          </div>
          <span class="stat-profit zero" id="xq-profit">+0</span>
        </div>
      </div>

      <!-- BÀN CỜ -->
      <div class="xq-board-wrap">
        <span class="xq-level-badge" id="xq-level-badge">Cấp 3</span>
        <div id="board"></div>
      </div>

      <!-- STATUS TEXT -->
      <div id="status">Đang tải...</div>

      <!-- ĐIỀU KHIỂN -->
      <div class="xq-controls">
        <button class="btn-undo" id="undo-btn">↺ Undo</button>
        <button class="btn-reset" id="reset">⟳ Ván mới</button>
      </div>

    </div>

  </div>

  <div id="toastContainer" style="display:none"></div>

  <script>
    // Particle background
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    }
    resize();
    addEventListener('resize', resize);

    for (let i = 0; i < 25; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        r: Math.random() * 1.5 + 0.5
      });
    }

    (function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(52,211,153,0.4)';
        ctx.fill();
      });
      requestAnimationFrame(loop);
    })();

    window.showToast = function() {};
  </script>

  <script type="module" src="xiangqi.js"></script>
</body>
</html>
