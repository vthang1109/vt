<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VTWorld — Cờ Vua</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="quests.css"/>
  <link rel="stylesheet" href="chess.css"/>
  <script src="top-nav.js"></script>
  <script src="bottom-nav.js"></script>
  <script type="module" src="quests.js"></script>
</head>
<body data-bottom-nav="games">
  <canvas id="bg-canvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div id="top-nav-root"></div>
  <div class="chess-wrap">

    <!-- MÀN HÌNH CHỜ: CÀI ĐẶT TRẬN ĐẤU -->
    <div class="chess-setup" id="setup-screen">
      <div class="setup-card">
        <h2 class="setup-title">♟ Cài đặt trận đấu</h2>

        <div class="setup-group">
          <label class="setup-label">Cấp độ</label>
          <div class="level-strip" id="level-strip"></div>
          <div class="level-info" id="level-info"></div>
        </div>

        <div class="setup-group">
          <label class="setup-label">Chọn quân</label>
          <div class="color-choice">
            <button type="button" class="color-btn active" id="color-white" data-color="w">
              <span class="color-piece">♔</span>
              <span class="color-name">Quân Trắng</span>
              <span class="color-note">Đi trước</span>
            </button>
            <button type="button" class="color-btn" id="color-black" data-color="b">
              <span class="color-piece">♚</span>
              <span class="color-name">Quân Đen</span>
              <span class="color-note">Đi sau</span>
            </button>
          </div>
        </div>

        <div class="setup-group">
          <label class="setup-label">Đặt cược</label>
          <div class="bet-input-row">
            <input id="chess-bet-input" type="number" min="50" step="50" value="100"/>
            <span style="color:#94a3b8;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px">⭐</span>
          </div>
          <div class="bet-quick">
            <button type="button" data-bet="100">100</button>
            <button type="button" data-bet="200">200</button>
            <button type="button" data-bet="500">500</button>
            <button type="button" data-bet="1000">1000</button>
          </div>
        </div>

        <button class="btn-start" id="start-btn">BẮT ĐẦU</button>
      </div>
    </div>

    <!-- MÀN HÌNH BÀN CỜ -->
    <div id="game-screen" style="display:none">

      <!-- STATUS BAR -->
      <div class="bc-status" id="bc-status">
        <div class="stat-side stat-side-player" id="side-player">
          <div class="side-top">
            <span class="side-avatar" id="side-player-avatar">♔</span>
            <span class="side-label">BẠN</span>
          </div>
          <span class="stat-bet" id="chess-bet-label">
            <span id="chess-bet-value">0</span>
            <small>CƯỢC</small>
          </span>
        </div>

        <div class="stat-score-wrap">
          <span class="stat-score" id="chess-score">--</span>
          <span class="stat-score-sub" id="chess-score-sub">Lượt đi</span>
        </div>

        <div class="stat-side stat-side-machine" id="side-machine">
          <div class="side-top">
            <span class="side-label">MÁY</span>
            <span class="side-avatar" id="side-machine-avatar">♚</span>
          </div>
          <span class="stat-profit zero" id="chess-profit">+0</span>
        </div>
      </div>

      <!-- BÀN CỜ -->
      <div class="chess-board-wrap">
        <span class="chess-elo-badge" id="chess-elo-badge">1500 ELO</span>
        <div id="board"></div>
      </div>

      <!-- STATUS TEXT -->
      <div id="status">Đang tải...</div>

      <!-- ĐIỀU KHIỂN -->
      <div class="chess-controls">
        <button class="btn-undo" id="undo-btn">↺ Undo</button>
        <button class="btn-reset" id="reset">⟳ Ván mới</button>
      </div>

    </div>

  </div>

  <div id="toastContainer" style="display:none"></div>

  <script>
    // Particle background
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    }
    resize();
    addEventListener('resize', resize);

    for (let i = 0; i < 25; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        r: Math.random() * 1.5 + 0.5
      });
    }

    (function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(52,211,153,0.4)';
        ctx.fill();
      });
      requestAnimationFrame(loop);
    })();

    window.showToast = function() {};
  </script>

  <!-- Load chess.js library với nhiều CDN fallback (dùng phiên bản ổn định) -->
  <script>
    (function loadChessLib(sources, i) {
      if (i >= sources.length) {
        var s = document.getElementById('status');
        if (s) s.textContent = '❌ Không tải được chess.js từ mọi CDN. Kiểm tra mạng.';
        return;
      }
      var tag = document.createElement('script');
      tag.src = sources[i];
      tag.onload = function () {
        // Load logic game
        var gameScript = document.createElement('script');
        gameScript.type = 'module';
        gameScript.src = 'chess.js';
        document.body.appendChild(gameScript);
      };
      tag.onerror = function () {
        console.warn('Chess.js CDN lỗi:', sources[i]);
        loadChessLib(sources, i + 1);
      };
      document.body.appendChild(tag);
    })([
      'https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.min.js',
      'https://cdn.jsdelivr.net/npm/chess.js@0.12.0/dist/chess.min.js',
      'https://unpkg.com/chess.js@0.12.0/dist/chess.min.js'
    ], 0);
  </script>
</body>
</html>
