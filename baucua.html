<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VTWorld — Bầu Cua</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="baucua.css">
    <link rel="stylesheet" href="quests.css">
    <script src="top-nav.js"></script>
    <script src="bottom-nav.js"></script>
    <script type="module" src="quests.js"></script>
</head>
<body data-bottom-nav="games">
    <canvas id="bg-canvas"></canvas>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <div id="top-nav-root"></div>

    <div class="game-container">
        <!-- Bank số dư kiểu xidach -->
        <div class="bc-bank">
            <span class="bc-bank-l">💰 Số dư của bạn</span>
            <span class="bc-bank-r" id="bc-balance-detail">0 đ</span>
        </div>

        <!-- Khu vực chính: 70% bát (nhấn để lắc) | 30% tổng cược + xoá -->
        <div class="bowl-row">
            <div class="bowl-side">
                <div id="bowl" class="bowl">
                    <div id="bowl-lid" class="bowl-lid"></div>
                    <div id="dice-container" class="dices">
                        <div class="dice" id="dice-0">?</div>
                        <div class="dice" id="dice-1">?</div>
                        <div class="dice" id="dice-2">?</div>
                    </div>
                    <!-- Thông báo kết quả nằm trong bát -->
                    <div id="result-notice" class="result-notice" style="display:none"></div>
                </div>
                <div class="bowl-hint">👆 Nhấn vào bát để lắc</div>
            </div>

            <div class="side-panel">
                <div class="total-bet-box">
                    <span class="total-bet-label">TỔNG CƯỢC</span>
                    <span id="total-bet-val">0</span>
                </div>
                <button id="btn-clear" class="chip-clear">🗑️ Xoá cược</button>
            </div>
        </div>

        <!-- Bàn đặt cược 6 ô -->
        <div class="bet-board">
            <div class="bet-card" data-id="bau">
                <span class="emoji">🎃</span>
                <div class="my-bet" id="bet-bau">0</div>
            </div>
            <div class="bet-card" data-id="cua">
                <span class="emoji">🦀</span>
                <div class="my-bet" id="bet-cua">0</div>
            </div>
            <div class="bet-card" data-id="tom">
                <span class="emoji">🦞</span>
                <div class="my-bet" id="bet-tom">0</div>
            </div>
            <div class="bet-card" data-id="ca">
                <span class="emoji">🐟</span>
                <div class="my-bet" id="bet-ca">0</div>
            </div>
            <div class="bet-card" data-id="ga">
                <span class="emoji">🐔</span>
                <div class="my-bet" id="bet-ga">0</div>
            </div>
            <div class="bet-card" data-id="nai">
                <span class="emoji">🦌</span>
                <div class="my-bet" id="bet-nai">0</div>
            </div>
        </div>

        <!-- Chọn chip -->
        <div class="chip-selector">
            <button class="chip" data-amt="100">100</button>
            <button class="chip" data-amt="500">500</button>
            <button class="chip active" data-amt="1000">1k</button>
            <button class="chip" data-amt="5000">5k</button>
        </div>
    </div>

    <div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none"></div>

    <script>
        // Particle nền (đồng bộ xidach)
        const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d'); let particles = [];
        function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
        for(let i=0;i<25;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
        (function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(251,191,36,0.4)';ctx.fill()});requestAnimationFrame(loop)})();

        // Toast
        window.showToast=function(msg,type='info'){const c={info:'#38bdf8',success:'#34d399',warn:'#fbbf24',error:'#f87171'};const t=document.createElement('div');t.style.cssText=`pointer-events:all;padding:11px 16px;border-radius:12px;background:rgba(4,20,40,0.97);border:1px solid ${c[type]};color:#e0f2fe;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.5);max-width:280px`;t.innerHTML=msg;toastContainer.appendChild(t);setTimeout(()=>t.remove(),3500)};
    </script>

    <script type="module" src="baucua.js"></script>
</body>
</html>
